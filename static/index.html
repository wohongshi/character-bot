<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#ffefdd">
<title>Character Bot</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-192.png">
<link rel="apple-touch-icon" href="/static/img/favicon-180.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- 字体不再 preload：它 197KB，preload 会和首屏大图抢 3G 带宽。
         font-display:swap 保证先用系统字渲染，字体到了再换。 -->
<script>
(function(){
  try{
    var s = localStorage.getItem("ks_theme");
    var d = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = (s === "light" || s === "dark") ? s : (d ? "dark" : "light");
  }catch(e){ document.documentElement.dataset.theme = "light"; }
})();
/* 低性能设备自适应。
   先看硬件线索（核心数 / 内存），拿不到就实测帧率；判定后给 <html> 加 .perf-low，
   CSS 那边关掉整屏飘落动画和 backdrop-filter（这两样是弱机掉帧的主要来源）。
   手动覆盖：?perf=low / ?perf=high，选完记在 localStorage。 */
(function(){
  var H = document.documentElement;
  function apply(mode){
    H.classList.toggle("perf-low", mode === "low");
    H.dataset.perf = mode;
  }
  var forced = "";
  try{ forced = localStorage.getItem("ks_perf") || ""; }catch(e){}
  if (!forced){
    var q = /[?&]perf=(low|high|auto)/.exec(location.search);
    if (q && q[1] !== "auto"){ forced = q[1]; try{ localStorage.setItem("ks_perf", q[1]); }catch(e){} }
  }
  if (forced === "low" || forced === "high"){ apply(forced); return; }

  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cores = navigator.hardwareConcurrency || 0;
  var mem = navigator.deviceMemory || 0;
  // 硬件线索足够就立刻降级，不必等测帧
  // 内存 ≤4GB 或核心 ≤4 就是这批「低性能设备」的主力（安卓中低端常见配置），
  // 直接降级，不必先卡几秒再判断。想要满效果可以访问 ?perf=high 永久覆盖。
  if (reduced || (mem && mem <= 4) || (cores && cores <= 4)){ apply("low"); return; }
  apply("high");

  // 再实测：load 之后连续数 90 帧，掉队超过 20% 就降级（只降不升，避免抖动）
  function probe(){
    var n = 0, slow = 0, last = performance.now();
    function tick(t){
      var dt = t - last; last = t;
      if (dt > 30) slow++;                 // 一帧超过 30ms ≈ 掉到 33fps 以下
      if (++n < 60) return requestAnimationFrame(tick);
      if (slow > 15){ apply("low"); try{ H.dataset.perfWhy = "fps"; }catch(e){} }
    }
    requestAnimationFrame(tick);
  }
  if (document.readyState === "complete") setTimeout(probe, 250);
  else window.addEventListener("load", function(){ setTimeout(probe, 250); });
})();

/* 分辨率自适应：把「屏幕有多细 / 窗口有多宽」变成两个 CSS 变量 + 一个状态位。
   - --fx    小字号系数。1x 屏（老显示器、投影、4K 未缩放）物理像素就是 CSS 像素，
             9.5px 的说明字在上面几乎看不清；按 DPR 和宽度放大 0–30%。
             2x/3x 的视网膜屏保持 1，避免把布局撑破。
   - --vh    1% 的视觉视口高度。iOS/安卓地址栏收起时 100vh 会多算一截，
             用 --vh 兜底（支持 dvh 的浏览器内部本来就用 dvh）。
   - data-bp 断点状态位（xs/sm/md/lg/xl），让 JS 和 CSS 用同一套判定。 */
(function(){
  var H = document.documentElement;
  var BPS = [[400, "xs"], [640, "sm"], [900, "md"], [1440, "lg"], [1e9, "xl"]];
  function apply(){
    var w = window.innerWidth || 390;
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 640;
    var dpr = window.devicePixelRatio || 1;

    var fx = 1;
    if (dpr < 1.5) fx *= (w >= 1600 ? 1.22 : w >= 1200 ? 1.12 : 1.04);
    if (w < 360) fx *= 1.08;                  // 320/360 的窄屏，同样的字更显小
    fx = Math.min(fx, 1.3);                   // 别和用户自己的字号设置叠乘爆掉
    H.style.setProperty("--fx", fx.toFixed(3));
    H.style.setProperty("--vh", (h / 100).toFixed(2) + "px");

    var bp = "xl";
    for (var i = 0; i < BPS.length; i++){ if (w < BPS[i][0]){ bp = BPS[i][1]; break; } }
    if (H.dataset.bp !== bp){ H.dataset.bp = bp; }
    H.dataset.dpr = String(dpr);
    // 触屏判定：pointer:coarse 在部分 WebView/模拟环境里不可靠，用 maxTouchPoints 兜底
    var touch = (navigator.maxTouchPoints || 0) > 0
             || (window.matchMedia && matchMedia("(pointer:coarse)").matches);
    if (Boolean(H.dataset.touch) !== touch) H.dataset.touch = touch ? "1" : "0";
  }
  apply();
  var t = null;
  function soon(){ clearTimeout(t); t = setTimeout(apply, 120); }
  window.addEventListener("resize", soon);
  window.addEventListener("orientationchange", soon);
  if (window.visualViewport){
    window.visualViewport.addEventListener("resize", soon);
    window.visualViewport.addEventListener("scroll", soon);
  }
  // 换屏幕 / 拖到另一台显示器：DPR 会变
  try{
    matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)")
      .addEventListener("change", soon);
  }catch(e){}
})();
</script>
<style>
/* ============ 字体 ============ */
@font-face{
  font-family:"ZCOOL KuaiLe";
  src:url("/static/fonts/zcool-ui.woff2") format("woff2"),
      url("/static/fonts/zcool-ui.ttf") format("truetype");
  font-display:swap;
  font-display:swap;
}
/* ============ 主题 ============ */
:root{
  --bg:#fff3e2; --paper:#fffdf6; --ink:#4a342a; --dim:#94745a; --line:#f2dcc4;
  --red:#e8484f; --red-deep:#c93a45; --red-soft:#ffe9e6;
  --gold:#f2b23e; --gold-soft:#fff3d6;
  --sky:#6fb9e4; --sky-soft:#e8f5fc;
  --green:#7aab5e; --green-soft:#eef7e8;
  --shadow:0 4px 14px rgba(190,120,80,.14);
  --font-cute:"ZCOOL KuaiLe","PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --font-body:-apple-system,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light dark}
html,body{height:100%}
body{
  color:var(--ink);font:14px/1.65 var(--font-body);background:var(--bg);
  background-image:
    radial-gradient(circle at 10% 6%, rgba(255,186,164,.24), transparent 42%),
    radial-gradient(circle at 90% 3%, rgba(148,208,240,.20), transparent 40%),
    radial-gradient(#f8e6d1 1.2px, transparent 1.2px);
  background-size:auto, auto, 26px 26px;
  background-attachment:fixed;
}
/* 角色配色由主题插件下发（/api/theme.css），这里不再写死 */
.charava{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  font-size:22px;color:#fff;box-shadow:0 4px 10px rgba(120,80,60,.22);line-height:1}
.charava.sm{width:38px;height:38px;border-radius:13px;font-size:18px}
.brand .charava{width:42px;height:42px;border-radius:14px;font-size:21px}
.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:12px}
.charitem{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px;
  cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.charitem:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.charitem.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.charitem.active{background:linear-gradient(180deg,var(--paper),var(--red-soft))}
.charitem .nm{font-family:var(--font-cute);font-size:17px;margin-top:8px}
.charitem .en{font-size:11px;color:var(--dim);letter-spacing:.5px}
.charitem .tagline{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5;min-height:34px}
.charitem .meta2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dim)}
.charbadge{position:absolute;top:12px;right:12px;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--red);color:#fff;font-family:var(--font-cute)}
.charbadge.off{background:#e9dccd;color:#8a6f58}
.swatches{display:flex;gap:4px;align-items:center}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.08)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.themecard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.themecard .nm{font-family:var(--font-cute);font-size:14px}
.docbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 20px;
  font-size:13.5px;line-height:1.8;max-height:70vh;overflow:auto}
.docbox h1{font-family:var(--font-cute);font-size:20px;color:var(--red-deep);margin:6px 0 10px}
.docbox h2{font-family:var(--font-cute);font-size:16px;color:var(--red-deep);margin:18px 0 6px;
  padding-bottom:4px;border-bottom:1px dashed var(--line)}
.docbox h3{font-size:14px;margin:14px 0 4px}
.docbox p{margin:6px 0;color:var(--ink)}
.docbox ul{margin:6px 0 6px 20px}
.docbox li{margin:2px 0}
.docbox code{background:var(--red-soft);padding:1px 5px;border-radius:5px;font-size:12px}
.docbox pre{background:#2e2721;color:#f4e8d8;border-radius:10px;padding:10px 12px;overflow:auto;
  font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
.docbox pre code{background:none;padding:0;color:inherit;font-size:12px}
.docbox table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px}
.docbox th,.docbox td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.docbox th{background:var(--red-soft);color:var(--red-deep);font-weight:600}
.docbox tr:nth-child(even) td{background:rgba(0,0,0,.015)}
.charsoul{width:100%;min-height:320px;font:13px/1.7 var(--font-body);border:2px solid var(--line);
  border-radius:14px;padding:12px;background:var(--surface-2)}
/* 右下角暖光 */
body::after{
  content:"";position:fixed;right:-140px;bottom:-160px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,204,176,.55) 0%, rgba(255,204,176,0) 68%);
  pointer-events:none;z-index:0;
}
::selection{background:#ffd6cf;color:var(--red-deep)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#f0cdb0;border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#e7b28c;background-clip:content-box}
#app{display:flex;height:100vh;height:100dvh;max-width:min(var(--app-max),100vw);margin:0 auto;position:relative;z-index:1}
/* ============ 侧边栏 ============ */
aside{width:214px;flex:none;background:linear-gradient(180deg,#fffaf0,#ffeede);
  border-right:2px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 10px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:2px dashed #f3ddc2;margin-bottom:10px}
.brand img{width:52px;height:52px;border-radius:50%;border:3px solid var(--surface-2);background:var(--surface-2);
  box-shadow:var(--shadow);transition:transform .2s}
.brand:hover img{transform:translateY(-3px) rotate(-5deg)}
.bt{font-family:var(--font-cute);font-size:19px;color:var(--red);letter-spacing:1px;line-height:1.2}
.bs{font-size:max(11px, calc(9.5px * var(--fx)));color:var(--dim);letter-spacing:2.5px;margin-top:2px}
.navgroup{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.navlabel{font-size:max(11px, calc(9.5px * var(--fx)));letter-spacing:1.6px;color:var(--ink-soft);padding:2px 12px 3px}
nav button kbd{margin-left:auto;font-size:max(11px, calc(9px * var(--fx)));color:var(--ink-soft);background:var(--surface-3);
  border:1px solid var(--glass-line);border-radius:5px;padding:0 4px;line-height:14px}
nav button.on kbd{color:#fff;background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}
.cmdkbtn{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;
  border:1px dashed color-mix(in srgb,var(--ink) 18%,transparent);background:var(--surface-3);
  border-radius:12px;padding:8px 10px;font-size:12px;color:var(--ink-soft);cursor:pointer}
.cmdkbtn:hover{background:var(--surface-2);color:var(--ink)}
.navgroup .navlabel:first-child{margin-top:0}
nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  color:var(--ink);font-family:var(--font-cute);font-size:14.5px;padding:10px 13px;border-radius:14px;
  cursor:pointer;text-align:left;transition:transform .15s,background .15s}
nav button:hover{background:var(--surface-2);transform:translateX(3px)}
nav button.on{background:linear-gradient(135deg,#ff7e60,#e8484f);color:#fff;
  box-shadow:0 4px 12px rgba(232,72,79,.35);transform:translateX(2px)}
.sidefoot{margin-top:auto;text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.55}
.sidefoot .peek{width:96px;display:block;margin:4px auto 2px;opacity:.92;
  filter:drop-shadow(0 6px 10px rgba(210,130,90,.26))}
#app:has(.hero) .sidefoot .peek{display:none}
/* ============ 主区 ============ */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;
  border-bottom:2px solid var(--line);background:color-mix(in srgb, var(--surface) 86%, transparent);backdrop-filter:blur(6px)}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-cute);font-size:12px;
  background:var(--surface-2);border:2px solid var(--line);border-radius:999px;padding:3px 13px;color:var(--dim)}
.pill b{color:var(--ink);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;background:#d9c3aa;box-shadow:0 0 0 3px #f4e6d4}
.pill.ok{border-color:#cde7bd;background:#f6fcf1}
.pill.ok .dot{background:var(--green);box-shadow:0 0 0 3px #e2f2d8}
.pill.bad{border-color:#f2bcb6;background:color-mix(in srgb, var(--red-soft) 70%, var(--surface-2))}
.pill.bad .dot{background:#e05252;box-shadow:0 0 0 3px #fadcd9}
.pill.wait{border-color:#f0d9a8;background:color-mix(in srgb, var(--gold-soft) 70%, var(--surface-2))}
.pill.wait .dot{background:var(--gold);box-shadow:0 0 0 3px #f8ecc9}
.spacer{flex:1}
.content{flex:1;overflow:auto;padding:18px 20px 14px;position:relative}
h2.page{font-family:var(--font-cute);font-size:18px;font-weight:400;color:var(--red-deep);margin-bottom:4px}
p.tip{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
p.tip code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:11px}
.kv{font-size:12px;color:var(--dim);margin-top:5px}
.kv b{color:var(--ink)}
/* ============ 按钮 ============ */
button.btn{font-family:var(--font-cute);background:var(--surface-2);border:2px solid var(--line);border-radius:12px;
  padding:6px 15px;font-size:13px;cursor:pointer;color:var(--ink);
  box-shadow:0 3px 0 rgba(196,138,96,.16);transition:transform .12s,box-shadow .12s,border-color .12s}
button.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 rgba(196,138,96,.18);border-color:#eec9a4}
button.btn:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(196,138,96,.18)}
button.primary{background:linear-gradient(135deg,#ff7a5c,#e8484f);border-color:#d43c46;color:#fff;
  text-shadow:0 1px 0 rgba(150,40,40,.22)}
button.primary:hover{filter:brightness(1.05);color:#fff}
button.tiny{padding:3px 10px;font-size:12px;border-radius:10px;box-shadow:none}
button.tiny:hover{transform:none;box-shadow:none}
button:disabled{opacity:.5;pointer-events:none}
button.btn.tabon{background:var(--red-soft);border-color:#f0a99e;color:var(--red-deep);box-shadow:none}
/* ============ 对话 ============ */
#chatWrap{display:flex;flex-direction:column;height:100%}
.chatbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.chatbar select{font:inherit;font-family:var(--font-cute);padding:5px 11px;border-radius:12px;
  border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
#msgs{flex:1;overflow:auto;padding:6px 2px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:min(86%,640px);align-items:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.ava{position:relative;flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;border:2.5px solid #fff;
  box-shadow:0 3px 8px rgba(200,120,80,.28);background:var(--red-soft);
  display:flex;align-items:center;justify-content:center}
.ava img{position:relative;z-index:1;width:100%;height:100%;display:block;object-fit:cover}
.ava .avafb{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;line-height:1}
.msg.me .ava{background:linear-gradient(135deg,#f09a7a,#d96a55);color:#fff;font-size:12px;font-weight:700}
.msg > div{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.msg.me > div{align-items:flex-end}
.bub{position:relative;background:var(--surface-2);border:2px solid var(--line);border-radius:16px;border-top-left-radius:5px;
  padding:10px 14px;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;max-width:100%;font-size:14.5px}
.bub::before{content:"";position:absolute;left:-8px;top:15px;width:11px;height:11px;
  background:inherit;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.msg.me .bub::before{left:auto;right:-8px;border-left:0;border-bottom:0;
  border-right:2px solid #f2bfb4;border-top:2px solid #f2bfb4}
.msg.me .bub{background:linear-gradient(180deg,#ffece5,#ffdcd0);border-color:#f2bfb4;
  border-radius:16px;border-top-right-radius:5px}
.bub.img{padding:6px;background:var(--surface);overflow:hidden}
/* 用户发上来的图（气泡内） */
.att{display:block;max-width:230px;max-height:230px;border-radius:12px;margin-top:6px;cursor:zoom-in;
  border:1px solid var(--line)}
/* 发送前的预览条 */
#pend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
#pend:empty{display:none}
#pend .p{position:relative;width:58px;height:58px;border-radius:11px;overflow:hidden;
  border:1px solid var(--line);background:var(--surface-2)}
#pend .p img{width:100%;height:100%;object-fit:cover;display:block}
#autoSpk.on{color:var(--ink);border-color:var(--ui-accent);
  background:color-mix(in srgb, var(--ui-accent) 18%, var(--surface-2))}
/* 从全局搜索跳过来时闪一下，不然眼睛找不到是哪条 */
@keyframes hitflash{0%,100%{background:transparent}30%{background:color-mix(in srgb,var(--ui-accent) 22%,transparent)}}
.msg.hit .bub{animation:hitflash 1.6s ease 2;border-radius:12px}
#pend .p button{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;
  border:0;background:rgba(20,12,10,.62);color:#fff;font-size:11px;line-height:18px;padding:0;cursor:pointer}
/* 消息操作（悬停/触屏显示） */
.acts{display:flex;gap:4px;margin-top:4px;opacity:0;transition:opacity .15s;flex-wrap:wrap}
.msg:hover .acts,.msg:focus-within .acts{opacity:1}
html[data-touch="1"] .acts{opacity:.85}
.acts button{border:1px solid var(--line);background:var(--surface-2);color:var(--dim);
  border-radius:8px;padding:1px 7px;font-size:max(11px, calc(10.5px * var(--fx)));cursor:pointer;
  font-family:var(--font-body)}
.acts button:hover{color:var(--ink);border-color:var(--ui-accent)}
.acts button[hidden]{display:none}       /* 作者样式别把 UA 的 [hidden] 顶掉 */
.bub.img img{display:block;max-width:100%;border-radius:12px;cursor:zoom-in}
.bub.img .cap{font-size:12px;color:var(--dim);padding:6px 6px 2px;white-space:pre-wrap}
.meta{font-size:11px;color:var(--dim);margin-top:5px;max-width:100%;overflow-wrap:anywhere}
.msg.me .meta{text-align:right}
.face{font-size:16px;vertical-align:-2px;margin:0 1px}
.face.chip{font-size:11px;background:var(--gold-soft);border:1px solid #f0dcae;border-radius:6px;
  padding:0 5px;vertical-align:1px;color:#8a6a1f}
.typing .bub{color:#b98f6b}
.typing .ava img{animation:run .8s ease-in-out infinite}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
/* 空状态：立绘 + 搭话 */
.hero{margin:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;padding:8px}
.hero img{width:clamp(150px,30vh,235px);border-radius:26px;filter:drop-shadow(0 12px 20px rgba(215,120,90,.30));
  animation:bob 3.4s ease-in-out infinite}
.hbub{position:relative;background:var(--surface-2);border:2px solid var(--line);border-radius:20px;
  border-bottom-left-radius:6px;padding:16px 20px;font-family:var(--font-cute);font-size:16px;
  color:var(--red-deep);box-shadow:var(--shadow);max-width:330px;transform:rotate(-1.5deg)}
.hbub small{display:block;font-family:var(--font-body);font-weight:400;color:var(--dim);
  font-size:12px;margin-top:8px;line-height:1.7}
#chatInput{display:flex;gap:10px;margin-top:12px;align-items:flex-end}
#chatInput textarea{flex:1;resize:none;font:inherit;border:2px solid var(--line);border-radius:18px;
  padding:11px 15px;min-height:48px;max-height:140px;background:var(--surface-2);box-shadow:var(--shadow);
  transition:border-color .15s,box-shadow .15s}
#chatInput textarea:focus{outline:none;border-color:#f3b0a5;box-shadow:0 0 0 4px rgba(232,72,79,.12)}
#sendBtn{font-size:15px;padding:10px 24px;border-radius:999px;min-height:48px}
.hintline{font-size:11px;color:var(--dim);text-align:right;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{background:var(--surface-3);border:2px solid color-mix(in srgb, var(--line) 80%, var(--gold));color:var(--ink-soft);border-radius:999px;
  padding:4px 13px;font-size:12px;cursor:pointer;font-family:var(--font-cute);transition:all .15s}
.chips button:hover{color:var(--red);border-color:#f0a99e;background:var(--red-soft);
  transform:rotate(-1deg) translateY(-1px)}

/* 历史搜索结果 */
.qhit{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.qhit:last-child{border-bottom:0}
.qhit .qt{flex:none;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.qhit .qw{flex:none}
.qhit .qs{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qhit mark{background:color-mix(in srgb,var(--red) 22%,transparent);color:inherit;padding:0 2px;border-radius:3px}
/* ============ 通用卡 ============ */
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 18px;
  box-shadow:var(--shadow);margin-bottom:16px}
.card h3{font-family:var(--font-cute);font-size:15px;font-weight:400;margin-bottom:10px;color:var(--red-deep)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:9px 13px}
.stat b{display:block;font-family:var(--font-cute);font-size:20px;color:var(--red);font-weight:400}
.stat span{font-size:11px;color:var(--dim)}
.stat:nth-child(2) b{color:#4d93c4}
.stat:nth-child(3) b{color:#c98d1e}
textarea.code{width:100%;min-height:380px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;
  border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-3);color:var(--ink)}
textarea.code:focus{outline:none;border-color:#f3b0a5}
label.f{font-family:var(--font-cute);font-size:13px;color:var(--dim);display:block;margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;border:2px solid var(--line);border-radius:12px;font-family:var(--font-body);background:var(--surface-2);
  padding:6px 11px;background:var(--surface-2);color:var(--ink)}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,textarea:focus,select:focus{outline:none;border-color:#f3b0a5}
input[type=checkbox]{accent-color:var(--red);width:15px;height:15px}
input::placeholder,textarea::placeholder{color:var(--ink-faint);opacity:1}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)}
/* 折叠的辅助说明：默认收起，不占版面 */
.zipspec,.rawErr{margin-top:10px}
.zipspec>summary,.rawErr>summary{cursor:pointer;font-size:12px;color:var(--ink-soft);
  display:inline-block;padding:2px 0}
.zipspec>summary:hover,.rawErr>summary:hover{color:var(--ink)}
.rawErr{margin-top:4px}
.rawErr code{display:block;margin-top:6px;padding:8px 10px;border-radius:10px;
  background:var(--surface-3);color:var(--ink-soft);font-size:11.5px;line-height:1.6;
  max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.pdform{display:flex;flex-direction:column;gap:8px}
.plrow{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink)}
.plrow span{color:var(--ink-soft)}
.plrow i{font-style:normal;opacity:.75}
.plrow .req{color:var(--red);font-weight:700}
.tag.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.mbar{flex:1;min-width:60px;height:8px;border-radius:999px;background:var(--surface-3);
  overflow:hidden;display:block}
.mbar i{display:block;height:100%;border-radius:999px;transition:width .25s}
.mbar i.mb-a{background:var(--ui-accent)}
.mbar i.mb-b{background:var(--green)}
.mbar i.mb-c{background:#8a6fd8}
/* 「处理这条」：折叠在消息下面，展开后是 4 个动作 + 结果 */
.mtools{margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface-2);max-width:min(560px,100%)}
.mtools .mres{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.mtools .mresTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.mtools .mresBody{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
  max-height:320px;overflow:auto}
/* 表情包网格：一行能塞几个塞几个，图统一 96px 高，名字一行省略 */
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:6px}
.stk{border:2px solid var(--line);border-radius:14px;background:var(--surface-2);
  padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.stk img{width:100%;height:96px;object-fit:contain;border-radius:10px;background:var(--surface);
  cursor:zoom-in}
.stk .nm{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk .ops{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.stk .ops .btn{padding:2px 7px;font-size:11.5px}
.plrow input,.plrow select{border-radius:10px;border:2px solid var(--line);background:var(--surface-2);
  color:var(--ink);padding:6px 9px;font-size:12.5px;font-family:var(--font-body)}
.mpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;
  max-height:280px;overflow:auto;margin-top:8px;padding:10px 12px;border-radius:12px;
  border:2px solid var(--line);background:var(--surface-2)}
.mpick label{display:flex;gap:7px;align-items:center;min-width:0;cursor:pointer;
  font-size:12px;color:var(--ink);padding:3px 0}
.mpick label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpick input{flex:none;accent-color:var(--ui-accent);margin:0}
.mpick{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 30%,transparent) transparent}
.mpick::-webkit-scrollbar{width:10px}
.mpick::-webkit-scrollbar-track{background:transparent}
.mpick::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 26%,transparent);
  border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.mpick::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--ink) 45%,transparent);background-clip:padding-box}
@media(max-width:700px){.mpick{grid-template-columns:1fr;max-height:300px}}
/* 手机上的触控目标：22px 高的按钮手指按不准，统一抬到 34px 左右 */
@media(max-width:760px){
  #view button:not(.x):not(.chip), #view .btn, .drawer button:not(.x){min-height:34px}
  #view .btn.tiny, #view button.tiny{min-height:32px;padding-top:5px;padding-bottom:5px;font-size:12px}
  #view .charcard .btn.tiny, #view .charcard button{min-height:32px}
  #view .seg button{min-height:32px}
  #view .fbtn{min-height:32px}
}
/* 触屏设备在桌面断点下也要保持可点：判据是「指针粗不粗」，不是「屏多宽」。
   iPad 竖屏 768px 走的是桌面布局，但手指和手机一样粗。 */
@media(pointer:coarse){
  #view button:not(.x),#view .btn,.drawer button:not(.x),
  #view .btn.tiny,#view button.tiny{min-height:30px}
  /* 侧栏条目：41px 是 padding 撑出来的，手指按着紧；44 是 iOS/Material 的推荐下限 */
  nav button{min-height:44px}
  #view .chatbar .btn.tiny{min-height:32px;height:auto}
  #reasonSel{height:32px}
}
/* 同一组规则再镜像到 JS 判定（navigator.maxTouchPoints > 0）——
   有些 WebView / 模拟环境里 (pointer:coarse) 不生效，触屏上按钮就变小了 */
html[data-touch="1"] #view button:not(.x),
html[data-touch="1"] #view .btn,
html[data-touch="1"] .drawer button:not(.x),
html[data-touch="1"] #view .seg button,
html[data-touch="1"] #view .fbtn,
html[data-touch="1"] .cmdkitem{min-height:32px}
html[data-touch="1"] #view .btn.tiny,
html[data-touch="1"] #view button.tiny{min-height:30px}
html[data-touch="1"] nav button{min-height:44px}
html[data-touch="1"] #view .chatbar .btn.tiny{min-height:32px;height:auto}
/* 发送栏里的 📎：和发送按钮同高，手指按得准（32px 太小） */
html[data-touch="1"] #chatInput #attachBtn{width:40px;height:40px;min-height:40px}
@media(pointer:coarse){#chatInput #attachBtn{width:40px;height:40px;min-height:40px}}
html[data-touch="1"] #reasonSel{height:32px}
/* 文字链（看板的「去运维 →」、供应商的「删除」、面板卡的「切换」）在触屏上
   只有 16–18px 高，横着够宽但竖着按不准 —— 补到 26px，不改变排版观感 */
html[data-touch="1"] #view .wl,
html[data-touch="1"] #view .tag a,
html[data-touch="1"] #view .opsline a,
html[data-touch="1"] #view .cmdrow a,
html[data-touch="1"] #view .kv a{display:inline-flex;align-items:center;min-height:30px;padding:0 6px}
html[data-touch="1"] #view .tag a{margin:-7px 0}   /* 负边距：撑高点击区但不撑大胶囊 */
html[data-touch="1"] #view .wl{margin-top:4px}
/* 顶栏状态胶囊（可点，跳运维）和「重载插件」在触屏上也偏矮 */
html[data-touch="1"] header#strip .pill{min-height:30px;padding-top:3px;padding-bottom:3px}
html[data-touch="1"] header#strip .btn{min-height:30px}
html[data-touch="1"] .cmdkbtn{min-height:44px}   /* 侧栏里的搜索按钮，和导航同高 */
/* 人格页：官方介绍卡 */
.posterRow{display:flex;gap:20px;align-items:center}
.posterRow img{width:102px;border-radius:14px;border:3px solid #fff;
  box-shadow:0 8px 20px rgba(190,110,80,.30);transform:rotate(-2deg);transition:transform .25s}
.posterRow img:hover{transform:rotate(0deg) scale(1.03)}
.pcopy{font-size:12px;color:var(--dim);line-height:1.9}
.pcopy b{color:var(--red-deep);font-family:var(--font-cute);font-size:15px;font-weight:400}
.pcopy .hint{display:block;margin-top:6px;font-size:11.5px}
/* ============ 插件 ============ */
.plgrid{display:grid;grid-template-columns:250px 1fr;gap:16px}
/* 工坊工作台：代码区撑满、干跑台常驻可见 */
.plview{display:flex;flex-direction:column;overflow:hidden}
.plview .plgrid{display:grid;grid-template-columns:250px 1fr;gap:16px;flex:1;min-height:0}
.plcolL{display:flex;flex-direction:column;min-height:0}
.plcolL .pllist{overflow:auto;min-height:0}
.plcolR{display:flex;flex-direction:column;min-height:0;overflow:auto}
.plcolR textarea.code{flex:1;min-height:110px}
.plcolR .card.dry{margin:12px 0 0}
.pllist{background:var(--surface-2);border:2px solid var(--line);border-radius:16px;overflow:hidden;height:fit-content}
.pllist button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;
  background:transparent;padding:10px 13px;font-size:13px;cursor:pointer;
  border-bottom:2px dashed #f6ead8;color:var(--ink);transition:background .12s}
.pllist button:last-child{border-bottom:0}
.pllist button::before{content:"✦";color:#f2c78e;font-size:11px}
.pllist button:hover{background:var(--surface-3)}
.pllist button.on{background:var(--gold-soft);color:#9a6d15;font-weight:700}
.pllist button.on::before{color:var(--gold)}
.badge{font-size:max(11px, calc(10.5px * var(--fx)));border-radius:99px;padding:0 8px;margin-left:auto}
.badge.on{background:var(--green-soft);color:#487a2e}
.badge.off{background:#f8e7e2;color:#b25a3c}
.result{background:var(--surface-3);border:2px dashed #eed7b4;border-radius:16px;padding:12px 14px;margin-top:12px;font-size:13px;max-height:200px;overflow:auto}
.route{font-family:var(--font-cute);font-size:15px}
.route.agent{color:#55953a}
.route.stop{color:var(--red)}
.say{display:flex;gap:9px;align-items:flex-start;margin-top:7px}
.ava.sm{width:28px;height:28px;border-width:2px}
/* ============ 记忆整理 ============ */
.tidygrp{border-left:3px solid var(--line);padding:4px 0 4px 8px;margin-bottom:8px}
.tidyold{opacity:.6;font-size:max(11px, calc(11px * var(--fx)));text-decoration:line-through}
/* ============ 群友画像 ============ */
.pprow{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);
  font-size:12.5px;flex-wrap:wrap}
.pprow:last-child{border-bottom:0}
.pprow .nm{flex:none;min-width:76px;max-width:150px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pprow .bar{flex:1;min-width:60px;height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.pprow .bar i{display:block;height:100%;background:var(--red);opacity:.55}
.pprow .ct{flex:none;color:var(--dim);font-size:max(11px, calc(11px * var(--fx)))}
/* ============ 提示词调试 ============ */
.prbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line);margin:8px 0 6px}
.prbar i{display:block;height:100%}
.pb-a{background:#d97757}.pb-b{background:#c9a227}.pb-c{background:#5b9e6f}
.pb-d{background:#7a6ff0}.pb-e{background:#e08bb0}.pb-f{background:#4fa3c7}
.pb-g{background:#2f8f8a}.pb-h{background:#b06f3a}.pb-i{background:#9a9a9a}
.pb-j{background:#6d7fa8}.pb-k{background:#c0392b}
.prrow{border-bottom:1px dashed var(--line);padding:3px 0;font-size:12.5px}
.prrow summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;list-style:none;flex-wrap:wrap}
.prrow summary::-webkit-details-marker{display:none}
.prrow .lb{font-weight:600;min-width:84px}
.prrow .ct{color:var(--dim);font-size:max(11px, calc(11px * var(--fx)))}
.pretxt{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border-radius:10px;
  padding:8px 10px;margin:6px 0;font-size:12px;max-height:220px;overflow:auto;
  font-family:var(--font-body);line-height:1.6}
/* ============ 文档导入 ============ */
.ingrow{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.ingrow .ix{color:var(--dim);width:30px;flex:none}
.ingrow .ti{flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ingrow .tx{flex:1;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ingrow.dup{opacity:.55}
/* ============ 主动消息 ============ */
.pvrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}
.pvrow .id{font-weight:600;min-width:118px}
.pvrow input[type=number]{width:70px}
/* ============ 知识库 ============ */
.kbhit{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--surface-2)}
.kbh-h{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.kbh-t{font-weight:600;color:var(--ink)}
.kbh-s{margin-left:auto}
.kbh-x{font-size:13px;color:var(--ink);white-space:pre-wrap}
.kbctx{background:var(--surface-3);border:2px dashed #eed7b4;border-radius:12px;padding:10px;
  font-size:12px;white-space:pre-wrap;word-break:break-all}
/* ============ 消息流 ============ */
.feedbar{align-items:center}
.feedbar select,.feedbar .btn{height:38px;box-sizing:border-box;display:inline-flex;align-items:center}
.feed{display:flex;flex-direction:column;gap:10px}
.fitem{display:flex;gap:12px;background:var(--surface-2);border:2px solid var(--line);border-radius:16px;
  padding:10px 14px;box-shadow:var(--shadow)}
.fitem .who{flex:none;width:126px;font-size:11.5px;color:var(--dim);line-height:1.5}
.fitem .txt{flex:1;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.fitem.assistant{background:var(--surface-3)}
.tag{font-size:max(11px, calc(10.5px * var(--fx)));border-radius:99px;padding:1px 8px;background:var(--red-soft);
  color:var(--red-deep);margin-right:4px;display:inline-block}
.fitem.assistant .tag{background:var(--green-soft);color:var(--green)}
/* ============ 动效 ============ */
@keyframes fadein{from{opacity:.3}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes run{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px) rotate(-5deg)}70%{transform:translateY(-2px) rotate(3deg)}}
@keyframes tw{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
@keyframes dots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}
#view.fadein{animation:fadein .18s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- 低性能设备自适应（由脚本判定后加到 <html class="perf-low">）----
   1) 停掉整屏飘落层：它虽然已经改成合成层位移，但弱 GPU 上 60fps 搬一层
      660K 像素仍然吃力，静态星点视觉上几乎一样。
   2) 关掉 backdrop-filter：磨砂玻璃要求每帧重新采样背后内容，是弱机掉帧头号元凶。
   3) 只留 120ms 内的反馈动画（按下/弹窗），长过渡一律砍掉。 */
html.perf-low body[data-effects="true"]::after{animation:none}
html.perf-low aside,html.perf-low header#strip,html.perf-low .card,
html.perf-low .drawerbox,html.perf-low .cmdk,
html.perf-low .chatbar,html.perf-low .hero,html.perf-low .pill{backdrop-filter:none!important}
html.perf-low *{animation-duration:0s!important;animation-iteration-count:1!important}
html.perf-low .msg,html.perf-low .card,html.perf-low .plugcard{transition:none}
html.perf-low #view.fadein{animation:none}
html.perf-low .wcard,html.perf-low .stat{box-shadow:0 2px 6px rgba(120,70,50,.08)}
/* ============ 移动端 ============ */
@media(max-width:760px){
  #app{flex-direction:column}

  border-radius:999px;border:1px solid var(--glass-line);
  background:color-mix(in srgb, var(--surface-2) 84%, transparent);
  box-shadow:0 4px 12px rgba(140,90,60,.08), 0 1px 0 rgba(255,255,255,.8) inset;
  transition:transform .14s ease, box-shadow .14s ease, background .14s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(140,90,60,.14)}
.btn.primary{
  background:linear-gradient(135deg,var(--ui-accent),color-mix(in srgb,var(--ui-accent) 60%,var(--ui-accent2)));
  border-color:transparent;color:#fff;font-weight:700;
  box-shadow:0 10px 24px color-mix(in srgb,var(--ui-accent) 30%,transparent), 0 1px 0 rgba(255,255,255,.35) inset;
}
.btn.tabon{background:var(--ui-accent);color:#fff;border-color:transparent}
.tag{border-radius:999px;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);background:color-mix(in srgb,var(--surface-2) 70%, transparent)}
/* 角色总览一行：手机上自动折行 */
.ovrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;
  border-bottom:1px solid var(--line)}
.ovrow:last-child{border-bottom:0}
.ovrow .kv{margin:0}
.tag.cold{opacity:.6}
/* 二次确认的删除按钮：红字红边，和普通 tiny 区分开 */
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
/* 按需装载的角色小牌：已加载的描边点亮，未加载的淡一点 */
.lptag{opacity:.55}
.lptag.on{opacity:1;border-color:color-mix(in srgb,var(--green) 45%,var(--line));
  color:var(--green)}
/* 花费行：一条会话一行（名字 + 数字 + 进度条） */
.urow{padding:7px 0;border-bottom:1px solid var(--line)}
.ucbtn{min-width:64px;justify-content:center}
/* 会话名太长时省略，别把右边的数字挤到下一行 */
.ulb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usub{text-align:right;margin:2px 0 0}
.urow:last-child{border-bottom:0}
.utop{display:flex;gap:8px;align-items:baseline;justify-content:space-between;margin-bottom:3px}
.utop b{font-weight:600;font-size:max(12px, calc(12.5px * var(--fx)))}
/* 会话绑定里「这个角色已经删了」的标签：红边框、不填色，别抢视觉 */
.tag.ccbad{border-color:var(--red);color:var(--red);background:transparent}

/* 对话 */
#chatWrap{display:flex;flex-direction:column;height:100%;min-height:520px;gap:10px}
.chatbar{align-items:center}
/* 命令试跑：参数输入 + 输出区 */
#tryBox{display:none;margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:10px}
#tryBox.on{display:block}
#tryBox .tb-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#tryBox .tb-h code{font-size:13px}
#tryBox .tb-out{white-space:pre-wrap;word-break:break-word;font-size:13px;
  background:var(--surface-2);border-radius:10px;padding:8px 10px;max-height:260px;overflow:auto}
#tryBox .tb-out.err{color:var(--red-deep,var(--red));background:color-mix(in srgb,var(--red) 8%,var(--surface-2))}
#tryBox img{max-width:190px;border-radius:10px;margin:6px 6px 0 0;border:1px solid var(--line)}
/* 正在朗读的那条：气泡描一圈呼吸光，不抢眼但能看出「就是它在说」 */
.msg.speaking .bub{box-shadow:0 0 0 2px color-mix(in srgb,var(--ui-accent) 55%,transparent),var(--shadow);
  animation:spk 1.6s ease-in-out infinite}
@keyframes spk{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ui-accent) 18%,transparent),var(--shadow)}}
/* 流式输出：气泡末尾一个跳动的方块 */
.bub.streaming::after{content:"▋";margin-left:2px;opacity:.75;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
/* 引用块（气泡内） */
.qb{border-left:3px solid var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 9%,transparent);
  border-radius:0 8px 8px 0;padding:4px 8px;margin-bottom:6px;font-size:max(11px,calc(11px*var(--fx)));
  color:var(--dim);white-space:pre-wrap;word-break:break-word;max-height:66px;overflow:hidden}
.qb b{color:var(--ink);font-weight:600;margin-right:4px}
/* 输入框上方的「正在引用」 */
/* 会话工具菜单（⋯）：三个图标挤在手机上会溢出，收进一个菜单 */
.cmenu{position:fixed;z-index:75;display:none;min-width:132px;padding:6px;
  background:var(--surface);border:1px solid var(--glass-line);border-radius:14px;
  box-shadow:0 14px 34px rgba(60,30,20,.22)}
.cmenu.on{display:block}
.cmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;
  color:var(--ink);font-family:var(--font-body);font-size:13px;padding:8px 10px;border-radius:9px;cursor:pointer}
.cmenu button:hover{background:var(--surface-2)}
.cmenu button.danger{color:var(--red-deep,var(--red))}
.cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
/* 会话内搜索 */
#csearch{display:none;align-items:center;gap:6px;margin-bottom:6px}
#csearch.on{display:flex}
#csearch input{flex:1;min-width:0;height:34px;font-size:13px}
#csearch .n{font-size:max(11px,calc(11px*var(--fx)));color:var(--dim);flex:none;min-width:44px;text-align:right}
#csearch button{flex:none}
.msg.hit .bub{outline:2px solid var(--ui-accent);outline-offset:2px}
#qbar{display:none;align-items:flex-start;gap:8px;margin:0 0 6px;padding:6px 10px;
  border-left:3px solid var(--ui-accent);border-radius:0 10px 10px 0;
  background:color-mix(in srgb,var(--ui-accent) 8%,var(--surface-2));
  font-size:max(11px,calc(11px*var(--fx)));color:var(--dim)}
#qbar.on{display:flex}
#qbar .qt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qbar .qt b{color:var(--ink);margin-right:4px}
#qbar button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:14px;
  line-height:1;padding:0 2px}
#ebar{display:none;align-items:center;gap:8px;margin:0 0 6px;padding:6px 10px;
  border-left:3px solid #d69a2d;border-radius:0 10px 10px 0;
  background:color-mix(in srgb,#d69a2d 12%,var(--surface-2));
  font-size:max(11px,calc(11px*var(--fx)));color:var(--dim)}
#ebar.on{display:flex}
#ebar .et{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ebar button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:12px;padding:0 2px}
#msgs{gap:14px;padding:6px 2px 2px}
.msg .bub{
  border-radius:18px;border:1px solid var(--glass-line);
  background:var(--surface-2);
  box-shadow:0 8px 22px rgba(120,70,50,.09);
  padding:11px 14px;line-height:1.68;
}
body[data-bubble="round"] .msg .bub{border-radius:999px;padding:12px 18px}
body[data-bubble="minimal"] .msg .bub{border-radius:10px;box-shadow:none;background:transparent;border:1px solid color-mix(in srgb,var(--ink) 16%,transparent)}
.msg .bub::before{display:none}
body[data-bubble="comic"] .msg .bub::after{
  content:"";position:absolute;left:-6px;bottom:12px;width:12px;height:12px;
  background:inherit;border-left:1px solid var(--glass-line);border-bottom:1px solid var(--glass-line);
  transform:rotate(45deg);border-bottom-left-radius:3px;
}
/* 自己的气泡不要尾巴：渐变背景 inherit 到三角上会串色，而且会被「我」头像压住一半 */
body[data-bubble="comic"] .msg.me .bub::after{display:none}
.msg.me .bub{
  background:linear-gradient(135deg,var(--ui-accent),color-mix(in srgb,var(--ui-accent) 55%,var(--ui-accent2)));
  color:#fff;border-color:transparent;
  box-shadow:0 10px 24px color-mix(in srgb,var(--ui-accent) 26%,transparent);
}
.msg.me .meta{color:rgba(255,255,255,.75)}
.msg .ava{box-shadow:0 6px 16px rgba(120,70,50,.16)}
.chips button{
  background:color-mix(in srgb, var(--surface-2) 84%, transparent);border:1px solid var(--glass-line);
  border-radius:999px;padding:7px 13px;font-size:12px;color:var(--ink);
  box-shadow:0 4px 12px rgba(140,90,60,.07);
}
.chips button:hover{border-color:var(--ui-accent);color:var(--ui-accent);transform:translateY(-1px)}
.chips button::before{content:"✧ ";color:var(--ui-accent2)}
#chatInput{background:color-mix(in srgb, var(--surface-2) 74%, transparent);border:1px solid var(--glass-line);border-radius:calc(var(--ui-radius) + 4px);
  box-shadow:var(--comic-shadow);backdrop-filter:blur(12px)}
#chatBox{background:transparent;border:0;resize:none;max-height:132px;overflow-y:auto}

/* 角色卡：立绘 + 渐变遮罩 */
.chargrid{grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.charitem{
  position:relative;overflow:hidden;padding:0;border-radius:calc(var(--ui-radius) + 4px);
  border:1px solid var(--glass-line);background:var(--paper);min-height:316px;
  display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:var(--comic-shadow);transition:transform .16s ease, box-shadow .16s ease;
}
.charitem:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(120,70,50,.18)}
.charitem .artbg{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 0%, color-mix(in srgb,var(--c2) 75%, white), transparent 70%),
  linear-gradient(160deg,var(--c2),var(--c1));}
.charitem .artbg img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;opacity:.92;
  mix-blend-mode:luminosity;filter:saturate(1.1) contrast(1.02)}
.charitem .artveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,8,8,.02) 12%,rgba(16,8,8,.18) 40%,rgba(16,8,8,.62) 68%,rgba(16,8,8,.88) 100%)}
.charitem .artbody{position:relative;z-index:1;padding:14px 15px 15px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.charitem .artbody .nm{font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:26px;margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.charitem .artbody .en{color:rgba(255,255,255,.88);font-size:max(11px, calc(10.5px * var(--fx)));letter-spacing:2px}
.charitem .artbody .tagline{color:rgba(255,255,255,.86);min-height:0;margin-top:3px}
.charitem .artbody .meta2{color:rgba(255,255,255,.88);font-size:max(11px, calc(10.5px * var(--fx)));gap:8px}
.charitem .artacts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.charitem.active{box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-accent) 55%,white), 0 18px 38px rgba(120,70,50,.2)}
.charitem .charbadge{position:absolute;z-index:2;left:12px;right:auto;top:12px;background:linear-gradient(135deg,var(--ui-accent),var(--ui-accent2));color:#fff;
  border-radius:999px;padding:2px 9px;font-size:max(11px, calc(10px * var(--fx)));box-shadow:0 4px 12px rgba(0,0,0,.2)}

/* 插件商店 */
.plugkpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:8px 0 14px}
.plugkpi .k{background:var(--glass);border:1px solid var(--glass-line);border-radius:calc(var(--ui-radius) - 2px);padding:11px 13px;box-shadow:var(--comic-shadow)}
.plugkpi .k b{display:block;font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:26px;line-height:1.1;color:var(--ui-accent)}
.plugkpi .k span{font-size:11px;color:var(--ink-soft)}
/* 标题与页面级动作同一行（动作不该混在筛选 chip 里，看着像筛选项） */
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pagehead h2.page{margin-bottom:0}
.plugbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.plugbar input{flex:1;min-width:180px;border-radius:999px;border:1px solid var(--glass-line);
  background:var(--surface-2);padding:0 14px;height:38px;font-size:13px}
/* 筛选单行横滚：换行会排出「第二行只有两个 chip + 右侧一大片空」 */
.filterbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
          mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%)}
.filterbar::-webkit-scrollbar{display:none}
.filterbar .fbtn{flex:none;min-height:32px;border-radius:999px;padding:0 13px;font-size:12px;
  border:1px solid var(--glass-line);background:var(--surface-3);cursor:pointer}
.filterbar .fbtn.on{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700}
.plugbar .fbtn{border-radius:999px;padding:6px 12px;font-size:12px;border:1px solid var(--glass-line);background:var(--surface-3);cursor:pointer}
.plugbar .fbtn.on{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700}
.pluggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px;margin-bottom:16px}
.plugcard{
  position:relative;text-align:left;border:1px solid var(--glass-line);border-radius:calc(var(--ui-radius) + 2px);
  background:linear-gradient(160deg,rgba(255,255,255,.9),color-mix(in srgb,var(--paper) 82%,white));
  padding:13px 14px;box-shadow:var(--comic-shadow);cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  display:flex;flex-direction:column;gap:6px;min-height:132px;
}
.plugcard:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(120,70,50,.16);border-color:color-mix(in srgb,var(--ui-accent) 35%,white)}
.plugcard.on{border-color:var(--ui-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-accent) 22%,transparent)}
.plugcard .top{display:flex;align-items:center;gap:8px}
.plugcard .ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ui-accent) 18%,white),color-mix(in srgb,var(--ui-accent2) 26%,white))}
.plugcard .nm{font-family:var(--font-body);font-weight:650;font-size:14.5px;line-height:1.25;
  letter-spacing:.1px}
.plugcard .sub{font-size:max(11px, calc(10px * var(--fx)));color:var(--ink-soft);letter-spacing:.5px}
.plugcard .desc{font-size:11.5px;color:var(--ink-soft);line-height:1.55;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plugcard .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:max(11px, calc(10px * var(--fx)));color:var(--ink-soft)}
.plugcard .st{position:absolute;right:11px;top:11px;width:9px;height:9px;border-radius:99px;background:#d9c9b8;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.plugcard .st.on{background:#59b36b;box-shadow:0 0 0 3px rgba(89,179,107,.18)}
/* 类名写两遍是有意的：角色主题里有 `body[data-theme=x] .plugcard{border-color:…}`
   （选择器权重 0,2,1），单个 .plugcard.syscard（0,2,0）压不过它，左边条会被刷掉。 */
.plugcard.syscard.syscard{
  /* 用 ink 混色而不是 --red：主题里的 --red 是「色调」不是「对比色」，
     角色主题下它可能是浅粉，做左边条根本看不见。 */
  border-left:3px solid color-mix(in srgb,var(--ink) 60%,transparent);
  background:linear-gradient(160deg,
    color-mix(in srgb,var(--ink) 5%,white),
    color-mix(in srgb,var(--ink) 2%,var(--paper)))}
.plugcard.syscard.syscard .ico{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.plugcard.syscard.syscard .lock{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 26%,transparent)}
.plugcard .st.err{background:#e05a4f}
.plugcard .lock{font-size:max(11px, calc(10px * var(--fx)));color:var(--ui-accent);border:1px solid color-mix(in srgb,var(--ui-accent) 30%,transparent);border-radius:999px;padding:1px 7px}
body[data-card_style="outline"] .plugcard{background:transparent}

details.card>summary{cursor:pointer;font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:17px;color:var(--red-deep);
  display:flex;align-items:center;gap:8px;list-style:none;padding:2px 0}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"▸";color:var(--ui-accent);font-size:14px;transition:transform .15s}
details.card[open]>summary::before{content:"▾"}
details.card>summary+.themegrid,details.card>summary+#plStat{margin-top:10px}

#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  z-index:80;max-width:min(88vw,520px);background:rgba(30,20,18,.92);color:#fff;border-radius:999px;
  padding:10px 18px;font-size:13px;line-height:1.5;box-shadow:0 14px 34px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
#toast.on{opacity:1;transform:translate(-50%,0)}

#bar{position:fixed;left:0;top:0;height:2.5px;width:0;z-index:90;opacity:0;
  background:linear-gradient(90deg,var(--ui-accent),var(--ui-accent2));
  transition:width .25s ease,opacity .2s ease;pointer-events:none}
#bar.on{opacity:1;width:82%}
#bar.done{opacity:0;width:100%}

.plugcard,.fitem,.charitem,.wcard{content-visibility:auto;contain-intrinsic-size:132px}
.feed .fitem{contain-intrinsic-size:72px}
@media(prefers-reduced-motion:reduce){.drawerbox{animation:none}}

/* 命令面板 */
.cmdk{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;
  padding-top:12vh;background:rgba(20,12,10,.42);backdrop-filter:blur(6px)}
.cmdk.on{display:flex}
.cmdkbox{width:min(620px,92vw);background:var(--paper);border:1px solid var(--glass-line);
  border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.cmdkbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:15px;
  background:transparent;color:var(--ink);outline:none}
.cmdklist{max-height:52vh;overflow:auto;padding:6px}
.cmdkitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:13px}
.cmdkitem .ic{width:26px;text-align:center;font-size:16px}
.cmdkitem .sub{margin-left:auto;font-size:max(11px, calc(10.5px * var(--fx)));color:var(--ink-soft)}
.cmdkitem.on,.cmdkitem:hover{background:color-mix(in srgb,var(--ui-accent) 12%,white)}
.cmdkitem .hl{color:var(--ui-accent);font-weight:700}
.cmdkempty{padding:18px;text-align:center;color:var(--ink-soft);font-size:12.5px}
.cmdkfoot{display:flex;gap:10px;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);
  font-size:max(11px, calc(10.5px * var(--fx)));color:var(--ink-soft)}
.cmdkfoot .touch{display:none}
@media(max-width:760px){
  .cmdk{padding-top:8vh}
  .cmdkfoot .kb{display:none}
  .cmdkfoot .touch{display:inline}
  .cmdkbox input{font-size:16px}   /* 防 iOS 聚焦缩放 */
}

/* 插件详情抽屉 */
.drawer{position:fixed;inset:0;z-index:65;display:none;background:rgba(20,12,10,.35);backdrop-filter:blur(4px)}
.drawer.on{display:block}
.drawerbox{position:absolute;right:0;top:0;bottom:0;width:min(460px,94vw);background:var(--paper);
  box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;
  animation:slidein .18s ease}
@keyframes slidein{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
.drawerhead{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawerhead .x{margin-left:auto;border:0;background:transparent;font-size:18px;color:var(--ink-soft);cursor:pointer}
.drawerbody{padding:14px 18px;overflow:auto;font-size:12.5px;line-height:1.7}
/* 插件自带页面：同源 iframe，撑满抽屉 */
.plugframe{width:100%;height:min(62vh,560px);border:1px solid var(--line);border-radius:14px;
  background:var(--surface);display:block}
.drawerbody.paged{padding:10px;display:flex;flex-direction:column}
.drawerbody h4{font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:15px;color:var(--red-deep);margin:14px 0 6px}
.drawerbody .cmdrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;
  align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
.drawerbody .cmdrow .h{min-width:0}
.drawerbody .cmdrow .alias{justify-self:end;text-align:right}
@media(max-width:760px){
  .drawerbody .cmdrow{grid-template-columns:auto minmax(0,1fr)}
  .drawerbody .cmdrow .alias{grid-column:1/-1;justify-self:end}
}
.drawerbody .cmdrow code{font-size:12px;color:var(--ui-accent)}
.drawerbody .cmdrow .h{color:var(--ink-soft);font-size:11.5px}
.drawerfoot{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* 更多面板 */

/* 表单 / 自定义 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.5px}
.fld input[type=text],.fld input[type=password],.fld select,.fld input[type=number]{
  border-radius:12px;border:1px solid var(--glass-line);background:var(--surface-2);padding:8px 11px;font-size:13px;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border-radius:999px;padding:6px 12px;font-size:12px;border:1px solid var(--glass-line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:11px;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.12);cursor:pointer}
.swatch{position:relative;display:grid;place-items:center}
.swatch.on{outline:3px solid #fff;box-shadow:0 0 0 5px var(--ui-accent),0 6px 14px rgba(0,0,0,.18)}
.swatch.on::after{content:"✓";color:#fff;font-size:15px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.previewbox{border-radius:calc(var(--ui-radius) + 4px);padding:16px;border:1px solid var(--glass-line);box-shadow:var(--comic-shadow);
  background:linear-gradient(135deg,color-mix(in srgb,var(--ui-accent) 14%,var(--surface-2)),color-mix(in srgb,var(--ui-accent2) 22%,var(--surface-2)));}
.previewbox .bub{max-width:320px}
.modlist{display:flex;flex-direction:column;gap:7px}
.modrow{display:flex;align-items:center;gap:9px;border:1px solid var(--glass-line);border-radius:12px;padding:8px 11px;background:var(--surface-3)}
.modrow .nm{flex:1;font-size:12.5px}
.modrow .mv{border:0;background:rgba(255,255,255,.9);width:30px;height:28px;border-radius:9px;cursor:pointer;
  font-size:14px;color:var(--ink-soft);padding:0;box-shadow:0 2px 6px rgba(120,70,50,.08)}
.modrow .mv:hover{color:var(--ui-accent)}

/* 看板模块 */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.wcard{position:relative;overflow:hidden;border-radius:calc(var(--ui-radius) + 2px);border:1px solid var(--glass-line);
  background:linear-gradient(150deg,rgba(255,255,255,.9),color-mix(in srgb,var(--paper) 78%,white));
  padding:13px 15px;box-shadow:var(--comic-shadow)}
.wcard .wt{font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:15px;color:var(--ink);display:flex;align-items:center;gap:7px}
.wcard .wv{font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:30px;line-height:1.15;color:var(--ui-accent);margin-top:4px}
.wcard .ws{font-size:11px;color:var(--ink-soft)}
.wcard .wl{display:block;margin-top:7px;font-size:11px;color:var(--ui-accent);text-decoration:none;font-weight:700}
/* 窄屏把看板小卡改成两列：一列时每张卡都撑满整屏、右半边全空，滚动还长一倍 */
@media(max-width:760px){
  .wgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .wcard{padding:11px 12px}
  .wcard .wt{font-size:13px;gap:5px}
  .wcard .wv{font-size:26px;margin-top:2px}
  .wcard .ws{font-size:max(11px, calc(10px * var(--fx)));line-height:1.45}
  .wcard .wl{font-size:max(11px, calc(10px * var(--fx)));margin-top:5px}
  .wgrid .wchar,.wgrid .wfull{grid-column:1 / -1}   /* 角色卡带图；单数时最后一张横过来 */
  .wcard .row{gap:5px!important}
  .wcard .btn.tiny{min-height:30px;padding:0 9px;font-size:12px}
}

@media(max-width:760px){

/* ============ 消息内轻量富文本 ============ */

/* 代码高亮（Node 侧染色，服务端已转义）：字色跟主题走，不写死 */

html[data-theme="dark"] .msg .bub pre.code .t-k{color:#ff9d7a}
html[data-theme="dark"] .msg .bub pre.code .t-s{color:#9fd89a}
html[data-theme="dark"] .msg .bub pre.code .t-c{color:#a08b7a}
html[data-theme="dark"] .msg .bub pre.code .t-n{color:#9cc4ff}
html[data-theme="dark"] .msg .bub pre.code .t-a{color:#d0a0ff}
.msg .bub i{opacity:.82}
.msg .bub a{color:var(--ui-accent);text-decoration:underline;word-break:break-all}
.msg.me .bub code,.msg.me .bub pre{background:rgba(255,255,255,.22)}
.msg.me .bub a{color:#fff}
/* 回到底部 */

/* ============ 深色主题 ============ */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"],
/* 角色主题（theme.css）把变量写在 body[data-theme] 上，这里必须同样落在 body 才盖得住 */
html[data-theme="dark"] body{
  --bg:#181210; --paper:#241c17;
  --ink:#f5e9dc; --dim:#cdb5a0;
  --line:#3c2d24;
  --red:#ff6f61; --red-deep:#ff9a86; --red-soft:#3a211d;
  --gold:#f2b23e; --gold-soft:#3a2e18;
  --sky:#79c2e8; --sky-soft:#1d2b36;
  --green:#93c477; --green-soft:#21301b;
  --shadow:0 4px 14px rgba(0,0,0,.5);
  --glass-line:rgba(255,255,255,.14);
  /* 深色下这三块必须一起变，否则会出现「浅色卡 + 浅色字」（对比度 1.1:1） */
  --glass:rgba(255,255,255,.055);
  --surface:var(--paper);
  --surface-2:#2b221d;
  --surface-3:#33281f;
  --ink-soft:color-mix(in srgb, var(--ink) 86%, var(--bg));
  --ink-faint:color-mix(in srgb, var(--ink) 72%, var(--bg));
  --comic-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.05) inset;
}
html[data-theme="dark"] body{
  background-image:
    radial-gradient(circle at 10% 6%, rgba(255,140,110,.10), transparent 42%),
    radial-gradient(circle at 90% 3%, rgba(120,190,235,.10), transparent 40%),
    radial-gradient(#2a211c 1.2px, transparent 1.2px);
  background-size:auto, auto, 26px 26px;
  background-attachment:fixed;
}
html[data-theme="dark"] body[data-bg="aurora"]{
  background-image:
    radial-gradient(900px 520px at 85% -8%, color-mix(in srgb, var(--ui-accent2) 18%, transparent), transparent 60%),
    radial-gradient(700px 520px at 0% 30%, color-mix(in srgb, var(--ui-accent) 12%, transparent), transparent 62%),
    linear-gradient(160deg, #1e1713, var(--bg) 55%, #1b1410);
}
html[data-theme="dark"] body::after{background:radial-gradient(circle, rgba(255,150,110,.14) 0%, transparent 68%)}
html[data-theme="dark"] aside{
  background:linear-gradient(180deg, color-mix(in srgb,var(--paper) 94%, black), color-mix(in srgb,var(--red-soft) 45%, #1b1411));
  box-shadow:8px 0 40px rgba(0,0,0,.45);
}
html[data-theme="dark"] nav button:hover{background:rgba(255,255,255,.07)}
html[data-theme="dark"] .brand .charava{box-shadow:0 8px 22px color-mix(in srgb,var(--ui-accent) 30%, transparent), 0 0 0 3px rgba(255,255,255,.14)}
html[data-theme="dark"] header#strip{background:color-mix(in srgb, var(--paper) 80%, transparent)}
html[data-theme="dark"] .pill{background:rgba(255,255,255,.06);box-shadow:none}
html[data-theme="dark"] .pill.ok{background:#1e2a19;border-color:#34502b}
html[data-theme="dark"] .pill.bad{background:#331c1a;border-color:#5a2b26}
html[data-theme="dark"] .pill.wait{background:#312713;border-color:#57431f}
html[data-theme="dark"] h2.page{text-shadow:none}
html[data-theme="dark"] .btn,html[data-theme="dark"] button.btn{background:#2b221d;border-color:var(--line);box-shadow:0 3px 0 rgba(0,0,0,.35)}
html[data-theme="dark"] .btn:hover,html[data-theme="dark"] button.btn:hover{border-color:#5a4133;box-shadow:0 5px 0 rgba(0,0,0,.35)}
html[data-theme="dark"] button.primary{background:linear-gradient(135deg,#ff7a5c,#e8484f);border-color:#d43c46}
html[data-theme="dark"] .tag{background:rgba(255,255,255,.07)}
html[data-theme="dark"] .chatbar select,html[data-theme="dark"] select{
  background:#2b221d;color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .msg .bub{background:rgba(255,255,255,.055);box-shadow:0 8px 22px rgba(0,0,0,.35)}
html[data-theme="dark"] .msg .bub code,html[data-theme="dark"] .msg .bub pre{background:rgba(255,255,255,.10)}
html[data-theme="dark"] .msg.me .bub{background:linear-gradient(135deg,var(--ui-accent),color-mix(in srgb,var(--ui-accent) 55%,var(--ui-accent2)))}
html[data-theme="dark"] #chatInput{background:rgba(255,255,255,.055)}
html[data-theme="dark"] #chatInput textarea{background:transparent;box-shadow:none;border-color:var(--line)}
html[data-theme="dark"] .chips button{background:rgba(255,255,255,.06);box-shadow:none}
html[data-theme="dark"] .plugcard{background:linear-gradient(160deg,rgba(255,255,255,.06),var(--paper))}
html[data-theme="dark"] .wcard{background:linear-gradient(150deg,rgba(255,255,255,.06),var(--paper))}
html[data-theme="dark"] .plugbar input{background:rgba(255,255,255,.06)}
html[data-theme="dark"] .plugcard .ico{background:linear-gradient(135deg,color-mix(in srgb,var(--ui-accent) 24%,#2a211c),color-mix(in srgb,var(--ui-accent2) 20%,#2a211c))}
html[data-theme="dark"] .plugcard:hover{border-color:color-mix(in srgb,var(--ui-accent) 45%,transparent)}
html[data-theme="dark"] .plugbar .fbtn{background:rgba(255,255,255,.05)}
html[data-theme="dark"] #toBottom{background:rgba(43,34,29,.96);box-shadow:0 8px 20px rgba(0,0,0,.5)}
html[data-theme="dark"] .charitem{background:var(--paper)}
html[data-theme="dark"] .charitem.active{background:linear-gradient(180deg,var(--paper),var(--red-soft))}
html[data-theme="dark"] .cmdkbox,html[data-theme="dark"] .drawerbox,html[data-theme="dark"] html[data-theme="dark"] .msg .bub a{color:color-mix(in srgb,var(--ui-accent) 70%, white)}
html[data-theme="dark"] .ava{background:#3a2b23;border-color:rgba(255,255,255,.16)}
html[data-theme="dark"] .msg.me .ava{background:linear-gradient(135deg,#f09a7a,#d96a55)}
html[data-theme="dark"] .msg .ava{box-shadow:0 6px 16px rgba(0,0,0,.45)}
html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border:2px solid transparent;background-clip:content-box}
html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26);background-clip:content-box}
html[data-theme="dark"] .meta{color:#c0a894}
html[data-theme="dark"] .sidefoot .peek{filter:brightness(.72) saturate(.88);border:1px solid rgba(255,255,255,.10)}
html[data-theme="dark"] .msg.me .meta{color:rgba(255,255,255,.8)}
html[data-theme="dark"] #chatBox::placeholder{color:#a9917e}
html[data-theme="dark"] .msg.me .bub{background:linear-gradient(135deg,#c9412f,#a8323a);color:#fff}
html[data-theme="dark"] #msgs{padding-right:5px}
html[data-theme="dark"] .chips button{color:#ecdccb}
html[data-theme="dark"] .kv,html[data-theme="dark"] .tip{color:#bda48f}
/* 注：深色下 .tag 实测 6.91:1（#ff9a86 叠 10% 白再叠卡片底），本来就合格，
   不要再给它换色 —— 换了反而跟角色卡徽章不是同一个色了。 */
html[data-theme="dark"] h2.page{color:#f7ecdf}

/* ============ 骨架屏与空状态 ============
   「正在读取…」这种纯文字占位既不能提示进度、又会让布局跳一下；
   换成同尺寸的骨架块，内容到位后原地替换，页面不抖。 */
.skel{display:block;border-radius:8px;height:12px;
  background:linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%);
  background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite}
.skel.w40{width:40%}.skel.w60{width:60%}.skel.w80{width:80%}
.skel.h18{height:18px}.skel.h28{height:28px}
.skelrow{display:flex;gap:10px;align-items:center;margin:8px 0}
.skelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none;background:var(--surface-3)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:38px 16px;text-align:center;color:var(--ink-soft)}
.empty b{font-size:30px;line-height:1;opacity:.65;font-weight:400}
.empty span{font-family:var(--font-cute);font-size:15px;color:var(--ink)}
.empty i{font-style:normal;font-size:12px;opacity:.8}
/* 键盘可达性：只有键盘聚焦才画环，鼠标点不画 */
:focus-visible{outline:2px solid color-mix(in srgb,var(--ui-accent) 70%, white);
  outline-offset:2px;border-radius:10px}

.rtwrap{display:flex;flex-direction:column;gap:2px}
.rtrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 10px;align-items:center;
  padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
.rtrow:last-child{border-bottom:0}
.rtl{font-weight:650;font-family:var(--font-body)}
.rtw{color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtv{color:var(--dim);font-size:11.5px;text-align:right;white-space:nowrap}
.rtn{grid-column:2 / 4;color:var(--dim);font-size:11px;margin-top:-2px}
.rtv{max-width:46vw;overflow:hidden;text-overflow:ellipsis}
/* 基准：一条一块，「A → B」不许断开 */
.rtbench{display:grid;gap:4px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.rtb{display:flex;gap:8px;align-items:baseline;font-size:11.5px;flex-wrap:wrap}
.rtb i{font-style:normal;font-weight:650;color:var(--ink)}
.rtb em{font-style:normal;color:var(--dim)}
.rtbp{white-space:nowrap;color:var(--ink-soft)}
.rtbp b{color:var(--ui-accent)}
.rtbh{margin-left:auto;font-size:max(11px, calc(10.5px * var(--fx)));color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:0 6px}
.rtbs{font-size:max(11px, calc(10.5px * var(--fx)));color:var(--green);font-weight:700}
@media(max-width:520px){
  .rtrow{grid-template-columns:74px minmax(0,1fr);gap:2px 8px}
  .rtv{grid-column:2;text-align:left}
}

/* ============ 可折叠侧栏（替代底部 dock） ============
   手机：侧栏变成浮层，左上角 ☰ 开；点遮罩/选项关。
   桌面：☰ 把侧栏收成图标条，状态记在 localStorage。 */
.navbtn{display:none;align-items:center;justify-content:center;width:34px;height:34px;flex:none;
  border-radius:11px;border:1px solid var(--glass-line);background:var(--surface-2);color:var(--ink);
  cursor:pointer;font-size:17px;line-height:1;padding:0}
.navbtn:hover{background:var(--surface-3)}
#navScrim{display:none}
@media(min-width:761px){
  .navbtn{display:inline-flex}
  body.rail aside{width:74px;padding:14px 8px}
  body.rail .brand > div,
  body.rail nav button .t,
  body.rail nav button kbd,
  body.rail .navlabel,
  body.rail .sidefoot,
  body.rail .cmdkbtn span{display:none}
  body.rail nav button{justify-content:center;padding:10px 0}
  body.rail .brand{justify-content:center}
  body.rail .cmdkbtn{justify-content:center;padding:9px 0}
}
/* 判据：窄屏 **或者** 手机横屏。
   只写 max-width:760px 会漏掉横屏手机（844×390 这类）：它按「桌面」处理，
   点 ☰ 得到的是 74px 图标条，而且 390px 高放不下 450px 的内容。
   桌面窄窗口不受影响 —— 那里 pointer 是 fine。 */
@media (max-width:760px), ((max-height:520px) and (orientation:landscape) and (pointer:coarse)){
  #app{flex-direction:row}
  aside{position:fixed;left:0;top:0;bottom:0;width:min(79vw,276px);z-index:70;
    flex-direction:column;align-items:stretch;
    /* viewport-fit=cover + PWA standalone：不给安全区内边距，顶部会被刘海盖住、
       底部会被 home 指示条压住（实测 sidefoot 底边就在屏幕 10px 以内）。 */
    padding:calc(14px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,var(--paper),color-mix(in srgb,var(--red-soft) 55%,white));
    border-right:1px solid var(--glass-line);border-bottom:0;box-shadow:18px 0 50px rgba(80,40,30,.28);
    transform:translateX(-104%);
    /* visibility 而不是 display:none —— 还能做滑出动画；延迟到动画结束再藏。
       这也是 inert 的兜底：老 Safari 没有 inert，aria-hidden 又不移出 tab 序。 */
    visibility:hidden;
    transition:transform .22s cubic-bezier(.4,0,.2,1),visibility 0s linear .22s;
    overflow:auto;overscroll-behavior:contain}
  body.nav-open aside{transform:none;visibility:visible;
    transition:transform .22s cubic-bezier(.4,0,.2,1),visibility 0s}
  /* 桌面收条（body.rail）之后把窗口拉窄、或者转到横屏时，rail 类可能还挂着：
     它会把侧栏压成 74px 并把文字全藏掉。浮层模式下必须救回来。
     （JS 的 navSync 也会清掉 rail，这里是不依赖 JS 的兜底。） */
  body.rail aside{width:min(79vw,276px);
    padding:calc(14px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom))}
  body.rail .brand > div,body.rail nav button .t,body.rail nav button kbd,
  body.rail .navlabel,body.rail .sidefoot{display:block}
  body.rail nav button{justify-content:flex-start;padding:10px 12px}
  /* 打开侧栏时焦点落在容器本身（不是第一个按钮）：容器不画描边，
     手指点开不会看到一个「键盘焦点框」，Tab 仍然从容器内第一项继续。 */
  #navAside:focus{outline:none}
  /* ☰ 就在刘海那一块：给它 40px，并让整个顶栏避开安全区 */
  header#strip{padding-top:calc(4px + env(safe-area-inset-top))}
  .navbtn{width:40px;height:40px;font-size:19px;border-radius:12px}
  aside .brand{border-bottom:2px dashed #f3ddc2;margin-bottom:8px;padding:2px 6px 10px}
  aside .bs{display:block}
  aside .brand .bt{font-size:18px}
  nav{display:flex;flex-direction:column;flex:none;overflow:visible;gap:2px}
  nav button{justify-content:flex-start;width:100%;padding:10px 12px}
  .sidefoot{display:block}
  #navScrim{display:block;position:fixed;inset:0;z-index:65;background:rgba(40,20,15,.45);
    opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open #navScrim{opacity:1;pointer-events:auto}
  .navbtn{display:inline-flex}
  .content{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  #toBottom{bottom:20px}
}

/* 横向滚动的两处（快捷话题 / 插件筛选栏）：右侧渐隐，暗示「还能往右滑」 */
.chips{
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
          mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
}
/* 横屏手机只有 ~390px 高：9 个导航项 + 大图 + 说明文字塞不下，
   侧栏一打开就得滚。把装饰性的底部栏让出来，能少滚一半。 */
@media ((max-height:520px) and (orientation:landscape) and (pointer:coarse)){
  aside .sidefoot{display:none}
  aside .brand{padding:0 6px 6px;margin-bottom:4px}
  aside .brand .bs{display:none}
  aside .brand .charava{width:32px;height:32px;font-size:17px;border-radius:11px}
  aside nav{gap:0}
}

/* ============ 控件规范（最后一层） ============
   历史原因，按钮/分段/下拉有 6 种内边距、4 种圆角、2 种高度 —— 面板上到处是
   「差不多但不完全一样」的按钮，看着就像没做完。这里定一套刻度，全部指过去。 */
:root{
  --ctl-h:34px;      /* 常规控件高 */
  --ctl-h-sm:28px;   /* 紧凑控件高 */
  --ctl-r:calc(var(--ui-radius) * .55);
}
.btn.btn{
  font-family:var(--font-body);          /* 手写体只给标题和名字，按钮用正文字体 */
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:auto;min-height:var(--ctl-h);padding:0 15px;
  border-radius:var(--ctl-r);font-size:13px;font-weight:600;line-height:1.2;
  white-space:nowrap;
}
.btn.btn.tiny{
  min-height:var(--ctl-h-sm);padding:0 11px;font-size:12px;
  border-radius:calc(var(--ui-radius) * .45);
}
.btn.btn.icon{
  width:var(--ctl-h-sm);min-width:var(--ctl-h-sm);padding:0;font-size:14px;
}
/* 触摸设备上小按钮抬到 32px（手指点得中），但仍是一套刻度 */
html[data-touch="1"] .btn.btn.tiny,
html[data-touch="1"] .chatbar > select{min-height:32px;height:32px}
html[data-touch="1"] .btn.btn.icon{width:32px;min-width:32px}
/* 分段选择：等分铺满。以前按文字长度自适应，一页里三行三種宽度，右边缘参差不齐 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;flex-wrap:nowrap}
.seg button{
  font-family:var(--font-body);
  width:100%;height:var(--ctl-h-sm);padding:0 6px;font-size:12px;
  border-radius:999px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 色块：8 列等分，左右边缘跟输入框对齐（原来固定 34px，右端差 30px） */
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.swatch{width:100%;height:auto;aspect-ratio:1;border-radius:calc(var(--ui-radius) * .5)}
/* 对话工具条：下拉与按钮同一高度，不再一个 26 一个 32 */
.chatbar > select,.chatbar > .btn.btn{height:var(--ctl-h-sm);min-height:var(--ctl-h-sm)}
.chatbar > select{padding:0 10px;border-radius:calc(var(--ui-radius) * .45);font-size:12px;
  font-family:var(--font-body)}
</style>

</head>

<script>
/* ================= 基础 ================= */
const $ = id => document.getElementById(id);

/* ================= 语言（跟随系统，可覆盖） =================
   面板是中文优先的，但“系统是英文”的用户打开时不该满屏中文导航。

const I18N = {

    "status.stopped": "stopped", "status.loggedIn": "signed in", "status.notReady": "not ready",

const LANG_PREF = (() => { try { return localStorage.getItem("ks_lang") || "auto"; } catch(e){ return "auto"; } })();
const LANG = LANG_PREF === "auto"
  ? (/^zh\b|^zh-/i.test(navigator.language || "zh") ? "zh" : "en")
  : LANG_PREF;
const T = I18N[LANG] || I18N.zh;
function t(key, ...args){
  let s = T[key];
  if (s == null) s = I18N.zh[key];
  if (s == null) return key;
  return args.length ? s.replace(/\{(\d+)\}/g, (m, i) => args[i]) : s;
}
/* 外壳里那些写死在 HTML 模板里的固定词，渲染完统一刷一遍 */
/* 插件/平台有英文名就用英文，没有就回落中文原文 —— 不硬翻内容 */
function bi(zh, en){ return (LANG === "en" && en) ? en : zh; }

function applyChrome(){
  document.documentElement.lang = (LANG === "en") ? "en" : "zh-CN";
  const bs = document.querySelector(".brand .bs"); if (bs) bs.textContent = t("brand.sub");
  document.querySelectorAll("nav button[data-v]").forEach(b => {
    const el = b.querySelector(".t"); if (el) el.textContent = t("nav." + b.dataset.v);
    b.title = t("nav." + b.dataset.v);
  });
  const cmdBtn = document.querySelector(".cmdkbtn span");
  if (cmdBtn) cmdBtn.textContent = "🔍 " + t("nav.search");
  document.querySelectorAll("#view .fbtn[data-pf]").forEach(b => {
    b.textContent = t("filter." + b.dataset.pf);
  });
  // 「安装插件包」已经从筛选 chip 挪到标题行，选择器要跟着改
  const inst = document.querySelector('#view [onclick*="pickPluginZip"]');
  if (inst) inst.textContent = t("plug.install");
  const ps = $("plugSearch"); if (ps) ps.placeholder = t("plug.search");
  const h2 = document.querySelector("#view h2.page");
  if (h2 && V && T["page." + V]) h2.textContent = t("page." + V);

// 注意：`'` 也转。`esc()` 的结果既进文本也进属性，而属性里大量是 onclick="...('名字')" ——
// 不转单引号的话，一个带 ' 的名字（或英文 "it's"）就能跳出 JS 字符串。
const esc = s => (s ?? "").toString().replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// 往 onclick 里塞字符串必须用这个，不能用 esc()：
// 属性值里的字符实体是**先被 HTML 解码、再当 JS 解析**的，所以 esc("'") 变成
// &#39; 之后又变回 '，照样能跳出 JS 字符串。这里用 JSON.stringify 生成带双引号的
// 字面量（属性本身是双引号，所以里面的 " 再由 esc 转成 &quot;）。
const jsq = s => esc(JSON.stringify(String(s ?? "")));
const FACE = {"呲牙":"😁","微笑":"🙂","大哭":"😭","流泪":"😢","捂脸":"🤦","调皮":"😜","doge":"🐶","比心":"🫰","点赞":"👍",
 "睡":"😴","抓狂":"😫","亲亲":"😘","委屈":"🥺","偷笑":"🤭","酷":"😎","可怜":"🥹","生气":"😠","疑问":"🤔","鼓掌":"👏",
 "ok":"👌","爱心":"❤️","玫瑰":"🌹","吃瓜":"🍉","惊讶":"😮","汗":"😅","奋斗":"💪","大兵":"🫡","抱抱":"🤗","庆祝":"🎉"};
function faces(text){
  return esc(text).replace(/\[表情[:：]([^\[\]]{1,16})\]/g, (m, n) => {
    const e = FACE[n.trim()];
    return e ? `<span class="face">${e}</span>` : `<span class="face chip">${esc(n.trim())}</span>`;
  });
}
let _hlSeq = 0;
let _hlTimer = null;
/* 代码块：先按纯文本渲染（服务器不在也能看），随后异步请求 Node 高亮替换。
   为什么要异步：高亮要走一次 /api/highlight（~3 ms），但首屏不该等它。 */
async function upgradeHighlight(){
  const nodes = [...document.querySelectorAll('pre[data-code]')];
  for (const el of nodes){
    if (el.dataset.hl) continue;
    el.dataset.hl = "1";
    const lang = el.dataset.lang || "js";
    const code = el.dataset.code || "";
    if (code.length > 20000) continue;
    try{
      const r = await fetch("/api/highlight", {method:"POST",
        headers:{"X-Klee-Studio":"1","Content-Type":"application/json"},
        body: JSON.stringify({lang, code})});
      const d = await r.json();
      if (d && d.ok && d.html && el.isConnected){

function mdLite(h){
  // 输入已是 esc() 过的纯文本；只认最常见的几种，避免误伤角色扮演里的符号
  h = h.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (m, lang, c) =>
    `<pre data-code="${esc(c.replace(/^\n+|\n+$/g,""))}" data-lang="${esc(lang || "js")}"` +
    ` data-hlseq="${++_hlSeq}">${c.replace(/^\n+|\n+$/g,"")}</pre>`);
  // 合并：一次渲染里 fmt() 会被调用几十次，每个都排一个 setTimeout 就是几十次全 DOM 扫描。
  // 用一个 pending 标记把它们压成一轮。
  if (!_hlTimer) _hlTimer = setTimeout(() => { _hlTimer = null; upgradeHighlight(); }, 0);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s（(])\*([^*\n]{1,80})\*(?=$|[\s，。！？、）」)])/g, "$1<i>$2</i>");
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}

/* 秒数 → 人话：45 秒 / 3 分 12 秒 / 2 小时 5 分 / 3 天 4 小时 */
function durText(sec){
  if (sec === null || sec === undefined || isNaN(sec)) return "—";
  const n = Math.max(0, Math.round(Number(sec)));
  if (n < 60) return n + " 秒";
  if (n < 3600) return Math.floor(n / 60) + " 分 " + (n % 60) + " 秒";
  if (n < 86400) return Math.floor(n / 3600) + " 小时 " + Math.floor((n % 3600) / 60) + " 分";
  return Math.floor(n / 86400) + " 天 " + Math.floor((n % 86400) / 3600) + " 小时";
}
