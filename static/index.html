/* 判据要和 CSS 完全一致：窄屏或手机横屏。只判 max-width 的话，横屏手机会走桌面
   分支（得到 74px 图标条），和样式表里写的浮层规则对不上。 */
const NAV_MQ = "(max-width:760px), ((max-height:520px) and (orientation:landscape) and (pointer:coarse))";
function isNarrowNav(){
  try { return !!(window.matchMedia && window.matchMedia(NAV_MQ).matches); } catch(e){ return false; }
}
/* 侧栏关闭时它只是被 transform 移出屏幕，**仍在 tab 序里** ——
   键盘 tab 会跳进看不见的按钮（实测 9 个）。用 inert 真正摘掉。 */
function navSync(){
  const a = document.getElementById("navAside"), b = document.getElementById("navBtn");
  if (!a) return;
  const narrow = isNarrowNav();
  const open = document.body.classList.contains("nav-open");
  // 窄屏/手机横屏没有「图标条」这回事：桌面收条留下的 rail 会让侧栏变 74px、文字全没
  if (narrow && document.body.classList.contains("rail")) document.body.classList.remove("rail");
  const hidden = narrow && !open;       // 桌面的图标条是一直可见的，不能 inert
  try { if ("inert" in a) a.inert = hidden; } catch(e){}
  if (hidden) a.setAttribute("aria-hidden", "true"); else a.removeAttribute("aria-hidden");
  // 桌面 ☰ 控制的是 body.rail（图标条↔完整侧栏），读屏也要看出这个状态，
  // 不能永远写 false。
  const expanded = narrow ? open : !document.body.classList.contains("rail");
  if (b) b.setAttribute("aria-expanded", String(expanded));
}
function navOpen(){
  document.body.classList.add("nav-open");
  navSync();
  /* 焦点移进侧栏（否则 Tab 还会从被遮住的页面内容开始）。
     落在**容器**上而不是第一个按钮：按钮会把 :focus-visible 的描边画出来，
     手指点开侧栏时看到一个蓝色焦点框很突兀；容器有 outline:none。 */
  const a = document.getElementById("navAside");
  if (a) { try { a.focus({preventScroll:true}); } catch(e){} }
}
function navClose(){
  const a = document.getElementById("navAside");
  const was = document.body.classList.contains("nav-open");
  // **先**记下焦点在不在侧栏里：navSync() 会设 inert，支持 inert 的浏览器
  // 会当场把焦点踢到 <body>，之后再 contains(activeElement) 永远是 false ——
  // 「焦点还给 ☰」这段就变成了死代码。
  const focusInside = !!(a && document.activeElement && a.contains(document.activeElement));
  document.body.classList.remove("nav-open");
  navSync();
  if (was && focusInside && isNarrowNav()){
    const b = document.getElementById("navBtn");
    if (b) { try { b.focus({preventScroll:true}); } catch(e){} }
  }
}

  if (isNarrowNav()){

    if (document.body.classList.contains("nav-open")) navClose(); else navOpen();
    return;
  }
  const on = document.body.classList.toggle("rail");
  try { localStorage.setItem("ks_rail", on ? "1" : "0"); } catch(e){}
  navSync();
}

/* ---------- 本地部分：页面 / 角色 / 插件（同步，随打随渲染） ---------- */
function cmdkBuild(q){
  const needle = (q || "").trim().toLowerCase();
  const out = [];
  PAGES.forEach(([v, ic, title, sub]) => {
    if (!needle || (title + sub + v).toLowerCase().includes(needle))
      out.push({ic, title, sub, run: () => go(v)});
  });
  ((charData && charData.items) || []).forEach(c => {
    if (!needle || (c.name + c.en + c.tagline).toLowerCase().includes(needle))
      out.push({ic: c.emoji || "🎭", title: "切换到 " + c.name, sub: c.active ? "当前角色" : "角色",
                run: async () => {
                  if (c.active) return go("chars");
                  const r = await post("/api/characters/switch", {id: c.id});
                  if (r.ok){ setActiveChar(r.character); charSel = c.id; go("chars"); flash("已切换到 " + c.name); }
                  else flash("切换失败：" + (r.error || ""));
                }});
  });
  Object.entries(cmdPluginCache || {}).forEach(([name, m]) => {
    if (m.characters && m.characters.length && !m.characters.includes(ACTIVE.id)) return;
    const hay = "插件 " + (m.title || name) + " " + (m.description || "");
    if (needle && !hay.toLowerCase().includes(needle)) return;
    out.push({ic: m.characters && m.characters.length ? "🧩" : "⚙️", title: m.title || name,
              sub: "插件 · " + (m.commands || 0) + " 命令", run: () => openPluginDrawer(name, m)});
  });
  return out.slice(0, 14);
}

async function cmdkCommands(){

async function cmdkSearchMsgs(q){
  try {
    // src=chat：只要「点得进去」的那份（另一份是 QQ 消息流，没有会话/角色）
    const d = await api("/api/search?src=chat&limit=8&q=" + encodeURIComponent(q));
    return (d && d.hits) || [];

function cmdkSnip(s){
  return esc(String(s || "")).replace(/&lt;&lt;/g, "<mark>").replace(/&gt;&gt;/g, "</mark>");
}
function cmdkCharName(id){
  const c = ((charData && charData.items) || []).find(x => x.id === id);
  return (c && c.name) || id || "";
}

function cmdkRender(q){
  const base = cmdkBuild(q);
  cmdItems = base; cmdIdx = 0; cmdkPaint();
  const seq = ++cmdSeq;
  const needle = String(q || "").trim();
  if (needle.length < 2) return;              // 一个字就查库，等于每次都全表扫
  if (cmdTimer) clearTimeout(cmdTimer);
  cmdTimer = setTimeout(async () => {
    const [cmds, hits] = await Promise.all([cmdkCommands(), cmdkSearchMsgs(needle)]);
    if (seq !== cmdSeq) return;               // 期间又敲了字
    const low = needle.toLowerCase();
    const extra = [];
    let ncmd = 0;
    for (const c of cmds){
      const hay = (c.name + " " + (c.aliases || []).join(" ") + " " + (c.help || "")).toLowerCase();
      if (!hay.includes(low) || ncmd >= 6) continue;
      ncmd++;
      extra.push({ic: "⌘", title: "." + c.name,
                  sub: (c.help || "") + (c.title ? " · " + c.title : ""),
                  run: () => cmdkFillCommand(c.name)});
    }
    for (const h of hits){
      extra.push({ic: h.role === "user" ? "🙋" : "💬",
                  title: cmdkCharName(h.character) + " · " + (h.session || ""),
                  sub: cmdkSnip(h.snippet || h.text), subHTML: true,
                  run: () => cmdkJumpTo(h)});
    }
    if (seq !== cmdSeq) return;
    cmdItems = base.concat(extra);
    if (cmdIdx >= cmdItems.length) cmdIdx = 0;
    cmdkPaint();
  }, 160);
}

function cmdkPaint(){
  const box = $("cmdkList"); if (!box) return;
  box.innerHTML = cmdItems.length
    ? cmdItems.map((it, i) => `<div class="cmdkitem ${i === cmdIdx ? "on" : ""}" onclick="cmdkRun(${i})">
        <span class="ic">${it.ic}</span><span>${esc(it.title)}</span>
        <span class="sub">${it.subHTML ? it.sub : esc(it.sub)}</span></div>`).join("")
    : `<div class="cmdkempty">没有找到；试试「角色」「插件」「运维」，或者一句话里的几个字</div>`;
  const on = box.querySelector(".cmdkitem.on");
  if (on) on.scrollIntoView({block: "nearest"});
}

function cmdkKey(e){
  // 中文输入法组词时的 Enter 是「确认候选词」，不是「打开这一条」
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if (!cmdItems.length) return;
    cmdIdx = (cmdIdx + (e.key === "ArrowDown" ? 1 : -1) + cmdItems.length) % cmdItems.length;
    document.querySelectorAll("#cmdkList .cmdkitem").forEach((x, i) => x.classList.toggle("on", i === cmdIdx));
    const on = document.querySelector("#cmdkList .cmdkitem.on"); if (on) on.scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter"){
    e.preventDefault(); cmdkRun(cmdIdx);
  } else if (e.key === "Escape"){
    cmdkClose();
  }
}
function cmdkRun(i){
  const it = cmdItems[i]; if (!it) return;
  cmdkClose();
  Promise.resolve(it.run()).catch(e => flash(String(e)));
}

  const box = $("chatBox");
  if (!box){ flash("先打开对话页再试"); return; }
  const cur = box.value.replace(/\s+$/, "");
  box.value = (cur ? cur + "\n" : "") + "." + name + " ";
  box.dispatchEvent(new Event("input"));
  box.focus();
  try { box.setSelectionRange(box.value.length, box.value.length); } catch(e){}
}

/* 消息：跳到那条气泡上并闪一下 */
async function cmdkJumpTo(h){
  const target = h.character || ACTIVE.id;
  if (target !== ACTIVE.id){
    const r = await post("/api/characters/switch", {id: target});
    if (!r || !r.ok){ flash("切换角色失败"); return; }
    if (r.character) setActiveChar(r.character);
    chat.char = ""; chat.after = 0;
  }
  chat.session = h.session || "studio-main";
  chat.after = 0;
  localStorage.setItem("ks_session", chat.session);
  if (V !== "chat") go("chat"); else viewChat();
  // viewChat 自己会拉第一屏；这里只等它铺好，别再手动清一次 ——
  // 清了以后 chat.after 已经推到最新，再 poll 只会拿到空数组（之前就这么白屏的）。
  for (let i = 0; i < 30 && !document.querySelector("#msgs .msg[data-ts]"); i++){
    await new Promise(r => setTimeout(r, 100));
  }
  const want = Number(h.ts || 0);
  let best = null, bestD = Infinity;
  document.querySelectorAll("#msgs .msg[data-ts]").forEach(n => {
    const d = Math.abs(Number(n.dataset.ts) - want);
    if (d < bestD){ bestD = d; best = n; }
  });
  if (best && bestD < 0.01){
    best.scrollIntoView({block: "center"});
    best.classList.add("hit");
    setTimeout(() => best.classList.remove("hit"), 3400);
  } else {
    flash("这条不在当前加载的历史里（对话太长，可以「导出 Markdown」看全文）");
  }
}

async function openPluginDrawer(name, meta){

    // 不在插件页也能打开（运维页的「插件页」按钮、命令试跑都走这里）：
    // 先问一次 detail，别直接甩一句「还没加载好」。
    try {
      const d0 = await api("/api/plugins/detail?name=" + encodeURIComponent(name));
      if (d0 && d0.ok && d0.meta){ m = d0.meta; plMeta[name] = m; }
    } catch(e){}
  }
  if (!m){ flash(t("plug.notReady")); return; }
  // 列表接口为了省流量不带命令清单/schema/能力表；抽屉打开时补这一次（1–3 ms）

  $("pdBody").innerHTML = `
    <div>${esc(bi(m.description, m.description_en) || "（没有说明）")}</div>
    ${m.system ? capLine : ""}

    ${m.usage ? `<h4>用法</h4><div>${esc(m.usage)}</div>` : ""}
    ${(m.tools && m.tools.length) ? `<h4>工具（${m.tools.length}）</h4>
      <div class="row" style="gap:6px;flex-wrap:wrap">${m.tools.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="kv">这些是 agent 能自己调用的能力。停用这个插件，模型的可调用列表里就没有它们了。</div>` : ""}
    ${m.system ? "" : `<h4>命令（${cmds.length}）</h4>
    ${cmds.length ? cmds.map(c => `<div class="cmdrow"><code>.${esc(c.name)}</code>
        <span class="h">${esc(cmdHelpText(c))}</span>
        ${c.aliases && c.aliases.length ? `<span class="h alias">别名：${esc(c.aliases.join(" / "))}</span>` : ""}
        <button class="btn tiny" style="flex:none;margin-left:auto"

      ${m.system ? "" : `<span class="tag">命中 ${m.hits || 0}</span>

  if (Object.keys(m.schema || {}).length) loadPluginSchema(name);

/* ================= 插件自带页面（小型 webui） =================
   同源 iframe：插件可以 fetch 面板的 /api/*，但它的 DOM/CSS 跟面板完全隔离，
   一个插件写崩了也不会把主界面搞坏。主题变量在打开时从 :root 抄一份进去。 */
const FRAME_VARS = ["--paper","--paper-2","--surface","--surface-2","--surface-3","--glass-line",
  "--ink","--ink-soft","--dim","--line","--ui-accent","--red","--red-soft","--red-deep",
  "--green","--radius","--font-cute","--font-body"];
const FRAME_BASE = `
  *{box-sizing:border-box}
  body{margin:0;padding:12px;background:var(--paper);color:var(--ink);
    font-family:var(--font-body);font-size:13px;line-height:1.7}
  h3{font-family:var(--font-cute);font-size:16px;margin:0 0 8px}
  h4{font-family:var(--font-cute);font-size:14px;margin:12px 0 6px;color:var(--red-deep)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;margin-bottom:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .kv{color:var(--ink-soft);font-size:12px}
  .tag{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);font-size:11.5px}
  .btn{font:inherit;padding:6px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700}
  .btn:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);max-width:100%}
  code{font-family:ui-monospace,monospace;font-size:12px;background:var(--surface-2);
    padding:1px 5px;border-radius:6px}
  pre{background:var(--surface-2);padding:8px;border-radius:8px;overflow:auto;font-size:12px}
  .ok{color:var(--green)} .bad{color:var(--red)}
  a{color:var(--ui-accent)}
`;

function pluginFrameDoc(html){
  const cs = getComputedStyle(document.documentElement);
  // 空值不能抄进去：`--radius:` 这种「声明了但为空」会让 var() 在计算时失效，
  // 比不写还糟（border-radius 直接变 0）。没值的就跳过，让 FRAME_BASE 的默认值生效。
  const vars = FRAME_VARS
    .map(v => { const val = cs.getPropertyValue(v).trim(); return val ? `${v}:${val}` : ""; })
    .filter(Boolean).join(";");
  return `<!doctype html><html data-theme="${esc(document.documentElement.dataset.theme || "")}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{--radius:14px;--paper-2:var(--paper);${vars}}${FRAME_BASE}</style></head>
<body><script>
  async function ksApi(path, opt){
    const o = Object.assign({headers:{"X-Klee-Studio":"1"}}, opt || {});
    if (o.body && typeof o.body !== "string"){ o.headers["Content-Type"]="application/json"; o.body=JSON.stringify(o.body); }
    const r = await fetch(path, o);
    let body = null;
    try { body = await r.json(); } catch(e){ return {ok:false, error:"HTTP "+r.status}; }
    // 403/400 之类要能看出来，别让页面把错误当成功
    if (!r.ok && body && body.ok === undefined) body.ok = false;
    return body;
  }
  const KS_CHAR = ${JSON.stringify(String((typeof ACTIVE !== "undefined" && ACTIVE && ACTIVE.id) || ""))};
  const KS_SESSION = ${JSON.stringify(String((typeof chat !== "undefined" && chat && chat.session) || "studio-main"))};
  window.ks = {
    // 当前角色 / 当前会话：插件页不用猜，也不要依赖「服务端默认值」
    char: KS_CHAR,
    session: KS_SESSION,
    api: (p) => ksApi(p),
    post: (p, b) => ksApi(p, {method:"POST", body:b}),
    toast: (t) => parent.postMessage({ks:"toast", text:String(t||"")}, "*"),
    reload: () => parent.postMessage({ks:"reload"}, "*"),
    goto: (v) => parent.postMessage({ks:"goto", view:String(v||"chat")}, "*"),
    esc: (s) => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
    /* 「发一句、等回复」。
       POST /api/chat 只是**入队**（返回 {queued:true}，没有正文），
       插件页以前直接读 d.messages 拿到的是 undefined —— 这就是「试发一条」永远不给回复的原因。
       这里把「入队 → 轮询到那条助手回复」封成一个原语，别让每个插件页各写一遍。 */
    send: async (text, opts) => {
      const o = opts || {};
      const session = String(o.session || ks.session || "web-console");
      const char = String(o.character || ks.char || "");
      const qs = "session=" + encodeURIComponent(session) + "&character=" + encodeURIComponent(char);
      const before = await ksApi("/api/chat?" + qs + "&after=0");
      const base = Number((before && before.total) || 0);
      const q = await ksApi("/api/chat", {method:"POST", body:{session, text, character: char}});
      if (!q || !q.ok) return {ok:false, error:(q && q.error) || "没发出去"};
      const end = Date.now() + Number(o.timeout || 90000);
      while (Date.now() < end){
        await new Promise(r => setTimeout(r, 500));
        const d = await ksApi("/api/chat?" + qs + "&after=" + base);
        const rows = (d && d.messages) || [];
        const reply = rows.filter(m => m.role === "assistant").pop();
        if (reply) return {ok:true, reply: reply.text, message: reply, rows, session};
      }
      return {ok:false, error:"等回复超时（可能还在队列里）"};
    },
  };
<\/script>${html || ""}</body></html>`;
}

/* ---------- 命令试跑 ---------- */
/* 和 agent 的 use_skill 走同一条链路（SkillHub.run + 捕获适配器），
   所以这里跑通 = 聊天里也能跑通。 */
let tryState = {plugin: "", command: ""};
function tryCommand(plugin, command, help){
  const box = $("tryBox");
  if (!box) return;
  tryState = {plugin, command};
  box.classList.add("on");
  box.innerHTML = `<div class="tb-h"><code>.${esc(command)}</code>
      <span class="kv" style="flex:1;min-width:0">${esc(help || "")}</span>
      <button class="btn tiny icon" onclick="closeTry()" title="关掉">✕</button></div>
    <div class="row" style="flex-wrap:nowrap">
      <input type="text" id="tryArgs" placeholder="参数（可以留空）" style="flex:1;min-width:120px">
      <button class="btn primary tiny" onclick="runTry()">运行</button>
    </div>
    <div id="tryOut" style="margin-top:8px"></div>`;
  const inp = $("tryArgs");
  if (inp){ inp.focus(); inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); runTry(); } }); }
}
function closeTry(){
  const box = $("tryBox");
  if (box){ box.classList.remove("on"); box.innerHTML = ""; }
}
async function runTry(){
  const out = $("tryOut");
  const argsEl = $("tryArgs");
  const args = argsEl ? argsEl.value.trim() : "";
  if (out) out.innerHTML = `<div class="kv">运行中…</div>`;
  const d = await post("/api/commands/run", {command: tryState.command, args,
                                             character: ACTIVE.id});
  if (!out) return;
  if (!d){ out.innerHTML = `<div class="tb-out err">请求失败</div>`; return; }
  if (!d.ok){
    out.innerHTML = `<div class="tb-out err">${esc(d.error || "没有输出")}</div>`;
    return;
  }
  const head = `<div class="kv" style="margin-bottom:4px">.${esc(d.command || tryState.command)} · ${d.ms} ms${d.skill ? " · " + esc(d.skill) : ""}</div>`;
  const body = `<div class="tb-out">${esc(d.text || "（没有文字输出）")}</div>`;
  const extra = d.extra ? `<div class="tb-out" style="margin-top:6px">${esc(d.extra)}</div>` : "";
  const imgs = (d.images || []).map(im =>
    `<img src="${esc(im.url)}" alt="${esc(im.caption || "")}" onclick="window.open(this.src,'_blank')">`).join("");
  out.innerHTML = head + body + extra + (imgs ? `<div>${imgs}</div>` : "");
}

window.addEventListener("message", (e) => {

/* ---- 插件开关 / 设置 ---- */
async function plugToggle(name, on){
  const btn = $("pdToggle"), msg = $("pdMsg");
  if (btn){ btn.disabled = true; }
  const d = await post("/api/plugins/config", {set: {[name]: !!on}});
  if (!d || !d.ok){
    if (msg) msg.textContent = "✗ " + ((d && d.error) || "失败");
    if (btn) btn.disabled = false;
    return;
  }
  // 以服务端返回的 enabled 为准，别用点之前的状态猜（快速连点会来回打脸）
  const real = Array.isArray(d.enabled) ? d.enabled.includes(name) : !!on;
  if (msg) msg.textContent = real ? "✓ 已启用，8 秒内生效" : "✓ 已停用，8 秒内生效";
  const st = $("pdState");
  if (st) st.textContent = real ? "● 已启用" : "○ 已停用";
  if (btn){
    btn.disabled = false;
    btn.textContent = real ? t("plug.disable") : t("plug.enable");
    btn.setAttribute("onclick", `plugToggle(${JSON.stringify(name)}, ${!real})`);
  }
  const m = (plMeta || {})[name];
  if (m) m.enabled = real;
  renderPlugGrid();
  // 插件热重载是 ≤8 秒的，太早重新拉 meta 会拿到旧状态、把刚翻的开关又打回去
  setTimeout(() => { if (V === "plugins") viewPlugins(); }, 10000);
}

async function loadPluginSchema(name){
  const box = $("pdForm"); if (!box) return;
  const d = await api("/api/plugins/schema?name=" + encodeURIComponent(name));
  if (!d || !d.ok || !d.has_schema){ box.textContent = "这个插件没有声明配置项"; return; }
  const fields = Object.entries(d.schema || {});
  const ss = d.secret_set || {};
  window.__pdSchema = d.schema || {};
  // 「这个密钥已经存过」的集合：必填校验要用它。
  // 不记的话，密钥类必填项永远是空框（服务端不回传明文）→ 每次保存都被
  // 「还差必填：AppSecret」挡回去，配好的插件连开关都改不了。
  window.__pdSecret = {};
  Object.entries(ss).forEach(([k, v]) => { if (v && v.set) window.__pdSecret[k] = true; });
  box.className = "pdform";
  box.innerHTML = fields.map(([k, f]) => {
    const v = d.values ? d.values[k] : f.default;
    const val = v === null || v === undefined ? "" : String(v);
    // 字段名要能一眼认出「这是 AppID 还是 AppSecret」——以前这里把 description
    // 当标题用，于是三个必填框分别显示成「同一页」「同一页」「Ed25519 校验用」，
    // 用户根本不知道该往哪个框里贴什么。
    const label = esc(f.label || k);
    const hint = esc(f.description || "");
    const req = f.required ? ' <b class="req" title="必填">*</b>' : "";
    let ctl;
    if (f.type === "bool" || typeof f.default === "boolean"){
      ctl = `<select id="pls_${esc(k)}"><option value="true" ${val === "true" ? "selected" : ""}>开</option>
             <option value="false" ${val !== "true" ? "selected" : ""}>关</option></select>`;
    } else if (Array.isArray(f.choices)){
      ctl = `<select id="pls_${esc(k)}">${f.choices.map(o =>
        `<option ${String(o) === val ? "selected" : ""}>${esc(String(o))}</option>`).join("")}</select>`;
    } else if (f.secret){
      /* 密钥类字段：服务端不回传明文，所以这里**永远**是空框。
         「填过没有」用 placeholder 说，改的时候留空就不动它，
         要抹掉得按「清除」—— 否则改个开关就会把 AppSecret 顺手清空。 */
      const info = ss[k] || {};
      ctl = `<div class="row" style="gap:6px;flex-wrap:nowrap;align-items:center">
        <input type="password" id="pls_${esc(k)}" data-secret="1" autocomplete="new-password"
               value="" placeholder="${info.set ? `已保存 ${info.len} 位 · 留空不改` : "还没填"}"
               style="flex:1;min-width:0" oninput="this.dataset.dirty='1';this.dataset.clear=''">
        <button class="btn tiny" style="flex:none" onclick="peekSecret('pls_${esc(k)}',this)">显示</button>

async function copyPlain(text, btn){
  const t = String(text || "");
  try { await navigator.clipboard.writeText(t); if (btn) btn.textContent = "已复制"; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); if (btn) btn.textContent = "已复制"; }
    catch(e2){ if (btn) btn.textContent = "复制不了"; }
    ta.remove();
  }
  setTimeout(() => { if (btn) btn.textContent = "复制"; }, 1600);
}

async function plugSaveSettings(name){
  const box = $("pdForm"), msg = $("pdSMsg");
  if (!box) return;
  const values = {}, clear = [];
  box.querySelectorAll("[id^=pls_]").forEach(el => {
    const k = el.id.slice(4);
    if (el.dataset.clear === "1"){ clear.push(k); return; }        // 「清除」按了才算清
    // 密钥框是空的：可能是没动过（保留原值），也可能是用户真想要空 —— 后者得按「清除」。
    if (el.dataset.secret === "1" && !String(el.value || "").length) return;
    values[k] = el.value;
  });
  // 必填项漏了就先说清楚，别让服务端存一半、界面看着像成功
  const schema = window.__pdSchema || {};
  const stored = window.__pdSecret || {};
  const miss = Object.entries(schema)
    .filter(([k, f]) => {
      if (!f.required) return false;
      if (clear.includes(k)) return true;                  // 明确点了「清除」→ 算缺
      if (String(values[k] ?? "").trim()) return false;     // 这次填了
      return !stored[k];                                   // 已经存过、这次留空 = 不改
    })
    .map(([, f]) => f.label || "");
  if (miss.length && msg){
    msg.style.color = "var(--red)";
    msg.textContent = "还差必填：" + miss.join(" / ");
    return;
  }
  const d = await post("/api/plugins/settings", {name, values, clear});
  if (msg) msg.style.color = "";
  if (!d || !d.ok){ if (msg) msg.textContent = "✗ " + ((d && d.error) || "失败"); return; }
  if (msg) msg.textContent = (d.errors && d.errors.length)
    ? "✓ 已保存（有 " + d.errors.length + " 项被纠正：" + d.errors.slice(0, 2).join("；") + "）"
    : "✓ 已保存，已经生效";
  loadPluginSchema(name);          // 刷新「已保存 N 位」与缺项提示
}

async function _blobDownload(url, fallbackName){
  const r = await fetch(url, {headers: {"X-Klee-Studio": "1"}});
  if (!r.ok){
    let msg = "下载失败";
    try { msg = (await r.json()).error || msg; } catch(e){}
    return {ok: false, error: msg};
  }
  const cd = r.headers.get("Content-Disposition") || "";
  const m = /filename="([^"]+)"/.exec(cd);
  const name = m ? m[1] : fallbackName;
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return {ok: true, name, bytes: blob.size};
}

function charArt(id){ return "/static/img/chars/" + encodeURIComponent(id) + ".webp?v=5"; }
/* 多档尺寸（见 tools/char_variants.py）：_s=480w / _m=720w / 原图=900w。
   不用 srcset —— 这套布局里 Chrome 会退回按 100vw 计算，一律挑到最大的 900w。
   直接按 视口×DPR 算需要多少物理像素，够用就下最小那档：
     thumb  头像 / 侧栏 / 看板小卡        固定 _s（≤48 CSS px）
     card   角色卡（手机一整列 ~356px）    520 以内 _s，否则 _m
     hero   聊天页大图（整屏宽）           ≤900 用 _m，再大才原图 */
const CHAR_STEPS = [[480, "_s"], [720, "_m"], [900, ""]];
function charSrc(id, role){
  const key = encodeURIComponent(id);
  if (role === "thumb") return `/static/img/chars/${key}_s.webp?v=5`;
  const vw = window.innerWidth || 390;
  // 角色卡的 CSS 宽度：手机一整列（约 92vw），桌面最多 300px（三列网格）
  const css = role === "card" ? (vw <= 760 ? vw * 0.92 : 300) : vw;
  const need = css * (window.devicePixelRatio || 1);
  // 允许 10% 的轻微放大 —— 省下的字节比那点锐度值钱
  for (const [w, suf] of CHAR_STEPS){
    if (w >= need * 0.9) return `/static/img/chars/${key}${suf}.webp?v=5`;
  }
  return `/static/img/chars/${key}.webp?v=5`;
}
function artFallback(img){
  // 老浏览器不支持 WebP 时退回同目录 JPG
  if (img.src.endsWith(".webp") || img.src.includes(".webp?")){
    img.src = img.src.replace(".webp", ".jpg").replace("?v=3", "?v=2");
  } else { img.remove(); }
}

    const set = (id, cls, html, tip) => {         // 内容没变就不碰 DOM（8 秒一轮不再引人分心）

      const t = tip || "";
      if (el.title !== t) el.title = t;

       正常（三个都 OK）时整块隐藏，顶栏只剩 ☰。 */
    let cls = "ok", label = "在线", tip = "面板、QQ、NapCat 都正常";

    }
    set("pConn", "pill " + cls,

  }catch(e){}

    </div>
  </div>`;
  $("sessSel").onchange = () => { stopSpeak(); chat.session = $("sessSel").value; localStorage.setItem("ks_session", chat.session); chat.after = 0; $("msgs").innerHTML=""; pollChat(); };
  paintAutoSpk();
  $("chatBox").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMsg(); } });

  });
  ["dragover", "drop"].forEach(ev => $("chatWrap").addEventListener(ev, e => {

      .filter(f => String(f.type).startsWith("image/"));
    if (!files.length) return;
    e.preventDefault();

  }));
  // 输入框自动长高（最多 5 行）+ 草稿保留

  chat.after = 0; $("msgs").innerHTML = "";
  pendingImgs = []; renderPend();
  chatQuote = null; renderQ();
  await pollChat();
  // 会话列表（不阻塞首帧；置顶/改名都靠它刷新）
  refreshSessions();
  chat.idle = 0;
  armChatPoll();
  clearInterval(chat.tick); chat.tick = setInterval(tickTyping, 1000);
}

/* ---------- 会话内搜索（纯前端：消息都在 DOM 里，不用再问后端） ---------- */
let searchHits = [], searchIdx = -1;
function toggleSearch(){
  const bar = $("csearch");
  if (!bar) return;
  if (bar.classList.contains("on")) { closeSearch(); return; }
  bar.classList.add("on");
  const inp = $("csearchInput");
  if (inp){ inp.value = ""; inp.focus(); }
  findInChat("");
}
function closeSearch(){
  const bar = $("csearch");
  if (bar) bar.classList.remove("on");
  searchHits.forEach(el => el.classList.remove("hit"));
  searchHits = []; searchIdx = -1;
  const n = $("csearchN"); if (n) n.textContent = "0 / 0";
}
function findInChat(q){
  const box = $("msgs"); if (!box) return;
  searchHits.forEach(el => el.classList.remove("hit"));
  searchHits = []; searchIdx = -1;
  const needle = String(q || "").trim().toLowerCase();
  if (needle){
    Array.from(box.querySelectorAll(".msg")).forEach(m => {
      const bub = m.querySelector(".bub");
      if (bub && (bub.innerText || "").toLowerCase().includes(needle)) searchHits.push(m);
    });
  }
  const n = $("csearchN");
  if (n) n.textContent = searchHits.length ? `1 / ${searchHits.length}` : "0 / 0";
  if (searchHits.length){ searchIdx = 0; focusHit(); }
}
function searchStep(delta){
  if (!searchHits.length) return;
  searchIdx = (searchIdx + delta + searchHits.length) % searchHits.length;
  focusHit();
}
function focusHit(){
  const el = searchHits[searchIdx];
  const n = $("csearchN");
  if (n) n.textContent = `${searchIdx + 1} / ${searchHits.length}`;
  if (!el) return;
  searchHits.forEach(x => x.classList.remove("hit"));
  el.classList.add("hit");
  el.scrollIntoView({block: "center", behavior: "smooth"});
}

async function exportConv(fmt){
  // 不能 window.open：这个接口在「要登录」名单里，导航请求带不了 X-Klee-Studio，
  // 只会拿到 403。和备份一样 fetch → blob → a[download]。
  // fmt=html 是自包含单页（图片 base64 进去），md 是纯文本 —— 给人看用 html，
  // 想再加工/喂给别的工具用 md。
  const u = `/api/chat/export?session=${encodeURIComponent(chat.session)}` +
            `&character=${encodeURIComponent(ACTIVE.id)}` +
            (fmt === "html" ? "&fmt=html" : "");
  try{
    const r = await fetch(u, {headers: {"X-Klee-Studio": "1"}});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const blob = await r.blob();
    const cd = r.headers.get("Content-Disposition") || "";
    const m = /filename="([^"]+)"/.exec(cd);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = m ? m[1] : `${ACTIVE.id}-${chat.session}.${fmt === "html" ? "html" : "md"}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    flash(`导出好了（${(blob.size / 1024).toFixed(0)} KB）`);
  }catch(e){ flash("导出失败：" + (e.message || e)); }
}
/* ---------- 朗读 ---------- */
/* 一次只念一条：点第二条会先停掉前一条。分段返回的音频按顺序播，播完自动收尾。
   自动播放：合成要几秒，用户手势的「临时激活」早过期了，play() 会被拦。
   所以在点击那一刻先用一个静音 wav 把同一个 <audio> 元素解锁，后面只换 src。 */
const SILENT_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
/* 一次只念一条：点第二条会先停掉前一条。分段返回的音频按顺序播，播完自动收尾。
   自动播放：合成要几秒，用户手势的「临时激活」早过期了，play() 会被拦。
   所以「解锁」必须发生在点击那一刻 —— 手动朗读在按钮的 click 里做，
   自动朗读在打开开关的那一下做（同一个 <audio> 元素，页面活着就一直算解锁）。
   注意：stopSpeak() **不销毁**这个元素，否则解锁状态跟着丢。 */
let speakState = {box: null, audio: null, list: [], idx: 0, btn: null, token: 0, tick: null};
const AUTO_SPEAK_MAX = 500;          // 超过这么多字就不自动念（点 🔊 还能手动念）

function ensureAudio(){
  let a = speakState.audio;
  if (!a){
    try { a = new Audio(); a.preload = "auto"; } catch(e){ return null; }
    speakState.audio = a;
  }
  return a;
}
/* 必须在用户手势里调：静音 wav 先把元素「点着」，之后换 src 才播得出来 */
function unlockAudio(){
  const a = ensureAudio();
  if (!a) return;
  try { a.onended = null; a.onerror = null; a.src = SILENT_WAV; a.play().catch(() => {}); } catch(e){}
}
function stopSpeak(){
  const st = speakState;
  st.token++;
  if (st.tick){ clearInterval(st.tick); st.tick = null; }
  if (st.audio){
    try{ st.audio.onended = null; st.audio.onerror = null; st.audio.pause(); }catch(e){}
    try{ st.audio.removeAttribute("src"); st.audio.load(); }catch(e){}
  }
  if (st.box) st.box.classList.remove("speaking");
  if (st.btn){ st.btn.textContent = "🔊 朗读"; st.btn = null; }
  st.box = null; st.list = []; st.idx = 0;
}

/* ---------- 自动朗读 ---------- */
function autoSpeakWanted(){
  try { return localStorage.getItem("ks_autospeak") === "1"; } catch(e){ return false; }
}
function paintAutoSpk(){
  const b = $("autoSpk");
  if (!b) return;
  const on = autoSpeakWanted();
  b.classList.toggle("on", on);
  b.textContent = on ? "🔊" : "🔈";
  b.title = on ? "自动朗读已开：新回复会念出来（点一下关）" : "自动朗读新回复";
  b.setAttribute("aria-pressed", on ? "true" : "false");
}
function toggleAutoSpeak(){
  const on = !autoSpeakWanted();
  try { localStorage.setItem("ks_autospeak", on ? "1" : "0"); } catch(e){}
  if (on){ unlockAudio(); flash("自动朗读已开：新回复会念出来"); }   // 手势里解锁
  else { stopSpeak(); flash("自动朗读已关"); }
  paintAutoSpk();
}
/* 只念**刚到的**助手回复：翻历史、切会话都不出声。 */
function maybeAutoSpeak(fresh){
  if (!autoSpeakWanted() || !fresh || !fresh.length) return;
  let pick = null;
  for (const m of fresh){
    if (m.role !== "assistant" || m.kind === "image") continue;
    if (String(m.text || "").trim()) pick = m;
  }
  if (!pick) return;
  const text = String(pick.text || "").trim();
  if (text.length > AUTO_SPEAK_MAX){
    flash(`这条 ${text.length} 字，太长就不自动念了（点消息下面的 🔊 朗读 可以手动念）`);
    return;
  }
  const box = document.querySelector(`#msgs .msg[data-ts="${Number(pick.ts || 0)}"]`);
  speakText(text, box, null);
}

/* ---------- 朗读本体（手动 / 自动共用） ---------- */
async function speakText(text, box, btn){
  stopSpeak();
  const token = ++speakState.token;
  const audio = ensureAudio();
  if (!audio){ flash("这个浏览器不支持播放音频"); return; }
  if (btn){                            // 手动：在手势里解锁
    try { audio.onended = null; audio.onerror = null; audio.src = SILENT_WAV; audio.play().catch(() => {}); } catch(e){}
  }
  speakState.box = box || null;
  speakState.btn = btn || null;
  if (box) box.classList.add("speaking");

  const t0 = Date.now();
  if (btn) btn.textContent = "…合成中 0s";
  if (btn) speakState.tick = setInterval(() => {
    if (token !== speakState.token) return;
    btn.textContent = "…合成中 " + Math.round((Date.now() - t0) / 1000) + "s";
  }, 500);

  let d = null;
  try{ d = await post("/api/tts", {text}); }catch(e){}
  if (speakState.tick){ clearInterval(speakState.tick); speakState.tick = null; }
  if (token !== speakState.token) return;             // 期间被停掉了
  if (!d || !d.ok || !(d.chunks || []).length){
    stopSpeak();
    flash((d && d.error) || "语音合成失败");
    return;
  }
  speakState.list = d.chunks.map(c => "/api/tts.wav?h=" + encodeURIComponent(c.h));
  speakState.idx = 0;
  if (btn) btn.textContent = "⏹ 停止";

  const playNext = () => {
    if (token !== speakState.token) return;
    const url = speakState.list[speakState.idx];
    if (!url){ stopSpeak(); return; }
    const a = speakState.audio;
    /* 「迟到的 ended」：解锁用的静音 wav 只有几十毫秒，它结束时派发的事件
       可能还排在队列里 —— 我们换完 src、挂上新 onended，它就打在新处理器上，
       于是第一段还没开口就被当成「播完了」。只有元素自己确实 ended 才算数。 */
    a.onended = () => {
      // 三种都可能是「假 ended」：解锁用的静音 wav 的事件迟到、换 src 时被 abort、
      // 或者上一段的收尾打在新处理器上。只有真的播到末尾才进下一段。
      if (!a.ended) return;
      const dur = Number(a.duration);
      if (isFinite(dur) && dur > 0 && a.currentTime + 0.2 < dur) return;
      speakState.idx++; playNext();
    };
    /* 换 src 会 abort 上一次加载，浏览器据此派发 error 但 a.error 是 null；
       只有真错误（编码/网络）才停，否则会被 abort 误伤。 */
    a.onerror = () => { if (a.error){ stopSpeak(); flash("这一段播不出来（" + (a.error.message || a.error.code) + "）"); } };
    a.src = url;
    a.play().catch(() => { stopSpeak(); flash("浏览器拦住了自动播放，点一下 🔊 朗读 再试"); });
  };
  playNext();
}

async function speakMsg(el){
  const box = el.closest(".msg");
  if (!box) return;
  const busy = speakState.tick || (speakState.audio && !speakState.audio.paused);
  if (speakState.box === box && busy){ stopSpeak(); return; }      // 再点一次 = 停（合成中也能停）
  const bub = box.querySelector(".bub");
  if (!bub) return;
  // 念**原文**：页面上的 textContent 已经把 ``` 变成 <pre>、把 ** 变成 <b>，
  // 后端那套清洗规则一条都匹配不上，代码块会被整段念出来。
  const raw = bub.dataset.raw;
  const qb = bub.querySelector(".qb");                 // 引用块不念，只念这一轮的正文
  const text = (raw != null && raw !== "")
    ? String(raw).trim()
    : (qb ? bub.textContent.replace(qb.textContent, "") : bub.textContent).trim();
  if (!text){ flash("这条没有可念的文字"); return; }
  speakText(text, box, el);
}

/* ---------- 对某一条消息做处理（翻译 / 总结 / 拆解 / 润色） ----------
   结果只显示在这儿，**不写进聊天记录**：它是工具输出，不是她说的话；
   写进去会污染历史，下一轮还会被当上下文喂回模型。 */
const MSG_TOOLS = [
  ["translate", "翻译", "中文 ↔ 英文"],
  ["summary", "总结", "压成几条"],
  ["explain", "拆解", "这段在说什么"],
  ["polish", "润色", "说得更清楚"],
];
function msgTools(btn){
  const msg = btn.closest(".msg");
  if (!msg) return;
  const old = msg.querySelector(".mtools");
  if (old){ old.remove(); return; }
  const bub = msg.querySelector(".bub");
  const text = bub ? (bub.innerText || "").trim() : "";
  if (!text){ flash("这条没有文字可以处理"); return; }
  const box = document.createElement("div");
  box.className = "mtools";
  box.innerHTML = `<div class="row" style="gap:6px;flex-wrap:wrap">
      ${MSG_TOOLS.map(([k, t, d]) => `<button class="btn tiny" data-act="${k}"
          title="${esc(d)}" onclick="runMsgTool(this,'${k}')">${esc(t)}</button>`).join("")}
      <span class="kv" data-out style="flex:1;min-width:0"></span>
      <button class="btn tiny" onclick="this.closest('.mtools').remove()">✕</button>
    </div>
    <div class="mres" hidden></div>`;
  const acts = msg.querySelector(".acts");
  // 文本挂在**这个面板自己**身上：以前是页面级的 window.__msgToolsText，
  // 同时开两条消息的处理栏时，后开的会覆盖前一条 —— 点老面板上的「翻译」，
  // 翻的是第二条消息。
  box.dataset.text = text;
  msg.insertBefore(box, acts ? acts.nextSibling : null);
}
async function runMsgTool(btn, action){
  const box = btn.closest(".mtools");
  const out = box.querySelector("[data-out]");
  const res = box.querySelector(".mres");
  const body = box.dataset.text || "";
  if (out) out.textContent = "处理中…";
  const d = await post("/api/chat/tool", {action, text: body, character: ACTIVE.id});
  if (out) out.textContent = "";
  if (!d || !d.ok){
    res.hidden = false;
    res.innerHTML = `<div class="kv" style="color:var(--red)">✗ ${esc((d && d.error) || "失败")}</div>`;
    return;
  }
  res.hidden = false;
  res.innerHTML = `<div class="mresTop">
      <span class="kv">${esc((MSG_TOOLS.find(x => x[0] === action) || [])[1] || action)}
        · ${Number(d.ms) || 0}ms</span>
      <button class="btn tiny" onclick="copyPlain(${esc(JSON.stringify(d.text))},this)">复制</button>
    </div>
    <div class="mresBody">${esc(d.text || "（没有输出）").replace(/\n/g, "<br>")}</div>`;
}

async function copyMsg(el){

  catch(e){                                  // 非 https / 老浏览器
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); flash("复制好了"); } catch(e2){ flash("复制不了"); }
    ta.remove();
  }
}

async function delMsg(el){
  const box = el.closest(".msg");
  const ts = Number(box && box.dataset.ts);
  if (!ts) return;
  if (!confirm("删掉这一条？")) return;
  const r = await post("/api/chat/msg/delete", {session: chat.session, character: ACTIVE.id, ts});
  if (!r || !r.ok){ alert((r && r.error) || "删除失败"); return; }
  // chat.after 是服务端「这个会话里的第几条」，删掉一条它就得退一格，
  // 否则下一次轮询从旧游标切，新发的消息会被跳过（要刷新页面才看得见）。
  chat.after = Math.max(0, chat.after - Number(r.removed || 0));
  box.remove();
  onlyLastRegen();          // 删的可能就是最后一条：让新的最后一条拿回按钮
  flash("删掉了");
}
// agent 常开（面板本身就是半个 agent）：不再有开关，也就不再存偏好。

let chatOpts = {
  reasoning: localStorage.getItem("ks_reasoning") || "default",
};
/* 发出去之前先问一句「你是不是问过」—— 用 Java 的 Dice 相似度，
   命中 >= 0.9 才提示（同义改写 0.4~0.7，不该打扰）。 */
async function maybeDuplicate(text){
  try{
    const d = await api("/api/similar?q=" + encodeURIComponent(text) + "&limit=1");
    const h = (d && d.hits && d.hits[0]) || null;
    if (h && h.score >= 0.9) flash(`上次你问过差不多的：「${h.text.slice(0, 18)}」`);
  }catch(e){}
}

/* ---------- 引用 ---------- */
let chatQuote = null;                 // {ts, who, text}
function renderQ(){
  const bar = $("qbar");
  if (!bar) return;
  if (!chatQuote){ bar.classList.remove("on"); bar.innerHTML = ""; return; }
  bar.classList.add("on");
  bar.innerHTML = `<div class="qt"><b>${esc(chatQuote.who)}</b>${esc(chatQuote.text.slice(0, 120))}</div>` +
                  `<button onclick="dropQuote()" aria-label="取消引用">✕</button>`;
}
let chatEdit = null;                  // {ts, n: 后面还有几条}
function renderEdit(){
  const bar = $("ebar");
  if (!bar) return;
  if (!chatEdit){ bar.classList.remove("on"); bar.innerHTML = ""; return; }
  bar.classList.add("on");
  bar.innerHTML = `<span class="et">正在改这条提问${chatEdit.n ? `（发送后它之后 ${chatEdit.n} 条会作废）` : ""}</span>` +
                  `<button onclick="cancelEdit()">取消</button>`;
}
function cancelEdit(){
  chatEdit = null;
  renderEdit();
  const box = $("chatBox");
  if (box){ box.value = ""; box.style.height = "auto"; box.dispatchEvent(new Event("input")); }
}
function editMsg(el){
  const box = el.closest(".msg");
  if (!box) return;
  const ts = Number(box.dataset.ts || 0);
  if (!ts) return;
  const bub = box.querySelector(".bub");
  const raw = (bub && bub.dataset.raw != null && bub.dataset.raw !== "")
    ? bub.dataset.raw : (bub ? bub.textContent : "");
  const all = Array.from(box.parentNode.querySelectorAll(":scope > .msg"));
  const at = all.indexOf(box);
  const nAfter = at >= 0 ? all.length - 1 - at : 0;
  // 改中间那句 = 把它之后的回复全丢掉，先说清楚再动手
  if (nAfter > 0 && !confirm(`这条之后还有 ${nAfter} 条消息，改完会一起删掉。继续？`)) return;
  chatEdit = {ts, n: nAfter};
  chatQuote = null;                    // 改提问的时候不要再带着旧引用
  const inp = $("chatBox");
  if (!inp){ flash("先打开对话页"); return; }
  inp.value = String(raw || "");
  inp.dispatchEvent(new Event("input"));
  inp.focus();
  try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch(e){}
  renderEdit();
  renderQ();
}
function quoteMsg(el){
  const box = el.closest(".msg"); if (!box) return;
  const bub = box.querySelector(".bub");
  const who = box.classList.contains("me") ? "我" : (ACTIVE.name || "对方");
  const text = (bub ? bub.innerText : "").trim().slice(0, 300);
  if (!text) return;
  chatQuote = {ts: Number(box.dataset.ts) || 0, who, text};
  renderQ();
  const cb = $("chatBox"); if (cb) cb.focus();
}
function dropQuote(){ chatQuote = null; renderQ(); }

/* ---------- 发图 ---------- */
let pendingImgs = [];                 // 已上传、还没发出去的图片 ref
function pickImg(){ const el = $("imgFile"); if (el) el.click(); }
function renderPend(){
  const box = $("pend");
  if (!box) return;
  box.innerHTML = pendingImgs.map((r, i) =>
    `<div class="p"><img src="/api/chat/image?p=${encodeURIComponent(r)}" alt="">` +
    `<button onclick="dropPend(${i})" aria-label="移除">✕</button></div>`).join("");
}
function dropPend(i){ pendingImgs.splice(i, 1); renderPend(); }
async function uploadBlob(blob, name){
  if (!blob) return;
  if (blob.size > 8 * 1024 * 1024){ flash("图太大（上限 8MB）"); return; }
  const data = await new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ""));
    r.onerror = () => res("");
    r.readAsDataURL(blob);
  });
  if (!data){ flash("读不到这个文件"); return; }
  const d = await post("/api/chat/upload", {data, name: name || ""});
  if (!d || !d.ok){ flash((d && d.error) || "上传失败"); return; }
  if (pendingImgs.length >= 3){ flash("一次最多 3 张"); return; }
  if (d.vision === false) flash(d.note || "没配看图模型");
  pendingImgs.push(d.ref);
  renderPend();
}
async function onPick(inp){
  const files = Array.from(inp.files || []);
  inp.value = "";                     // 允许连续选同一张
  for (const f of files.slice(0, 3 - pendingImgs.length)) await uploadBlob(f, f.name);
}
async function sendMsg(){
  const box = $("chatBox"); const text = box.value.trim();
  if (!text && !pendingImgs.length) return;
  const imgs = pendingImgs.slice();
  const quote = chatQuote;
  box.value = ""; box.style.height = "auto";
  localStorage.removeItem("ks_draft_" + ACTIVE.id);
  pendingImgs = []; renderPend();
  chatQuote = null; renderQ();
  if (text) maybeDuplicate(text);             // 不 await：提示慢一点无所谓，别拖慢发送
  if (chatEdit){
    // 编辑重发：先让服务端把这条之后的都删掉，再把新文本排进队列
    const r = await post("/api/chat/edit", {session: chat.session, character: ACTIVE.id,
                                            ts: chatEdit.ts, text,
                                            reasoning: chatOpts.reasoning});
    if (!r || !r.ok){
      flash((r && r.error) || "改不了这条");
      box.value = text; box.dispatchEvent(new Event("input"));
      return;
    }
    chatEdit = null; renderEdit();
    chat.after = 0;
    $("msgs").innerHTML = "";
    await pollChat();
    return;
  }
  const r = await post("/api/chat", {session: chat.session, text, images: imgs, quote,
                                     character: ACTIVE.id, reasoning: chatOpts.reasoning});
  if (!r || !r.ok){
    // 发失败就把图、引用和文字还给用户，别让人重打一遍
    flash((r && r.error) || "没发出去");
    pendingImgs = imgs; renderPend();
    chatQuote = quote; renderQ();
    if (!box.value) { box.value = text; box.dispatchEvent(new Event("input")); }
    return;
  }
  await pollChat();
}
function actsHTML(role){
  const copy = `<button onclick="copyMsg(this)" title="复制这条">复制</button>`;
  const quote = `<button onclick="quoteMsg(this)" title="引用这条再问">引用</button>`;
  const speak = role === "assistant" ? `<button onclick="speakMsg(this)" title="用她的声音念出来">🔊 朗读</button>` : "";
  const keep = `<button onclick="keepMsg(this)" title="存进她的长期记忆">🧠 记住</button>`;
  const regen = role === "assistant"
    ? `<button data-regen="1" onclick="regenMsg()" title="按同一句重新生成">重新生成</button>` : "";
  const del = `<button onclick="delMsg(this)" title="删掉这一条">删除</button>`;
  const edit = role === "user" ? `<button onclick="editMsg(this)" title="改一下这句，然后从这里重新回答">编辑</button>` : "";
  const tools = `<button onclick="msgTools(this)" title="对这条做点处理：翻译 / 总结 / 拆解 / 润色">🛠 处理</button>`;
  return `<div class="acts">${copy}${edit}${quote}${tools}${speak}${keep}${regen}${del}</div>`;
}
/* 只有**最后一条**回复能重新生成：接口永远重跑「最后那一问」，
   挂在一堆旧回复上，点第三条其实替换的是最新那条 —— 会让人以为删错了。 */
function onlyLastRegen(){
  const box = $("msgs"); if (!box) return;
  const btns = Array.from(box.querySelectorAll('.acts button[data-regen]'));
  // 用隐藏而不是 remove：把最后一条删掉以后，前一条要能重新拿到按钮
  btns.forEach((b, i) => { b.hidden = i < btns.length - 1; });
}
function quoteHTML(q){
  if (!q || !q.text) return "";
  return `<div class="qb"><b>${esc(q.who || "引用")}</b>${fmt(String(q.text).slice(0, 300))}</div>`;
}
function attsHTML(m){
  return (m.images || []).map(r =>
    `<img class="att" src="/api/chat/image?p=${encodeURIComponent(r)}" alt="附件" loading="lazy"` +
    ` onclick="window.open(this.src,'_blank')">`).join("");
}
function bubble(m){
  const ts = Number(m.ts || 0);
  if (m.kind === "image" && m.img)
    return `<div class="msg klee" data-ts="${ts}">${charAva()}<div><div class="bub img">` +
      `<img src="/api/chat/image?p=${encodeURIComponent(m.img)}" alt="${esc(m.caption || "图片")}" loading="lazy"` +
      ` onclick="window.open(this.src,'_blank')">` +
      (m.caption ? `<div class="cap">${esc(m.caption)}</div>` : "") +
      `</div><div class="meta">${esc(ACTIVE.name)} · ${hhmm(m.ts)}</div>` +
      `${actsHTML("assistant")}</div></div>`;
  if (m.role === "user")
    return `<div class="msg me" data-ts="${ts}"><div class="ava">我</div><div><div class="bub" data-raw="${esc(m.text || "")}">${quoteHTML(m.quote)}${attsHTML(m)}${fmt(m.text)}</div>
      <div class="meta">${hhmm(m.ts)}</div>${actsHTML("user")}</div></div>`;
  const err = m.error ? `<div class="meta">⚠ ${esc(m.error)}</div>` : "";
  return `<div class="msg klee" data-ts="${ts}">${charAva()}<div><div class="bub" data-raw="${esc(m.text || "")}">${quoteHTML(m.quote)}${fmt(m.text || "(没接上话……再试一次？)")}</div>
    <div class="meta">${esc(ACTIVE.name)} · ${hhmm(m.ts)}${m.elapsed ? ` · 用时 ${m.elapsed} 秒` : ""}${m.via === "plugin" ? " · 🧩 插件" : ""}${m.via === "agent" ? ` · 🧠 Agent${m.tools ? "(" + m.tools + " 次工具)" : ""}` : ""}${m.via === "vision" ? " · 👁 看图" : ""}</div>${err}${actsHTML("assistant")}</div></div>`;
}
let lastRunning = null;

/* ---------- 心情 ----------
   三个维度：精神 / 心情 / 亲近。数据在 bot/mood.py，这里只负责显示。
   轮询走 30 秒缓存：它变得很慢（一轮才动几个点），没必要每 0.5 秒问一次。 */
let lastMood = {at: 0, data: null};
async function paintMood(force){
  const chip = document.getElementById("moodChip");
  if (!chip) return;
  if (!force && lastMood.data && Date.now() - lastMood.at < 30000) return;
  const d = await api("/api/mood?character=" + encodeURIComponent(ACTIVE.id));
  if (!d || !d.ok) return;
  lastMood = {at: Date.now(), data: d};
  chip.textContent = d.emoji;
  chip.title = `心情 ${d.mood_text} ${Math.round(d.mood)} · 精神 ${d.energy_text} ${Math.round(d.energy)}`
             + ` · 亲近 ${d.closeness_text} ${Math.round(d.closeness)}（点开看详情）`;
}
function moodBar(v, kind){
  // 颜色走 class（.mb-a/.mb-b/.mb-c）：内联写 var(--ui-accent) 会被文案体检当成
  // 「给用户看的 CSS 变量名」拦下来，也确实不该把主题变量名散在 JS 字符串里。
  const n = Math.max(0, Math.min(20, Math.round(v / 5)));
  return `<span class="mbar"><i class="mb-${esc(kind)}" style="width:${n * 5}%"></i></span>`;
}
async function showMood(){
  const box = document.getElementById("moodBox");
  if (box){ box.remove(); return; }
  // 刚进页面时心跳还没跑，lastMood 是空的 —— 以前这里只 flash 一句「还在读…」，
  // 用户点两下都打不开，看着像坏了。现在直接拉一次。
  if (!lastMood.data){
    await paintMood(true);
    if (!lastMood.data){ flash("读不到状态，稍后再试"); return; }
  }
  const d = lastMood.data;
  const el = document.createElement("div");
  el.id = "moodBox"; el.className = "card";
  el.style.cssText = "margin:8px 0 0;padding:12px;font-size:13px";
  el.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:center">
      <b>${d.emoji} ${esc(ACTIVE.name)} 现在的状态</b>
      <span class="row" style="gap:6px">
        <button class="btn tiny" onclick="refreshMood()">刷新</button>
        <button class="btn tiny" onclick="resetMood()">重置</button>
        <button class="btn tiny" onclick="document.getElementById('moodBox').remove()">✕</button>
      </span>
    </div>
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:7px">
      ${[
        ["心情", d.mood, d.emoji, d.mood_text, "a"],
        ["精神", d.energy, d.energy_emoji, d.energy_text, "b"],
        ["亲近", d.closeness, d.closeness_emoji, d.closeness_text, "c"],
      ].map(([name, v, emo, txt, col]) => `<div class="row" style="gap:8px;flex-wrap:nowrap">
        <span style="flex:none;width:34px">${esc(name)}</span>
        ${moodBar(v, col)}
        <b style="flex:none;width:52px;text-align:right">${Math.round(v)}</b>
        <span class="kv" style="flex:none;width:64px">${emo} ${esc(txt)}</span>
      </div>`).join("")}
    </div>
    <div class="kv" style="margin-top:8px;line-height:1.6">
      一起聊过 ${Number(d.turns) || 0} 轮。精神会随时间和熬夜掉、心情看聊得怎么样、
      亲近只会慢慢涨。状态明显偏离时，她说话的口气会跟着变（不会直接说出来）。
    </div>`;
  const msgs = document.getElementById("msgs");
  if (msgs) msgs.parentNode.insertBefore(el, msgs);

async function refreshMood(){

  const box = document.getElementById("moodBox");
  if (box) box.remove();

}
async function resetMood(){

  if (d && d.ok){ lastMood = {at: Date.now(), data: d}; flash("已恢复初始状态"); }

let lastCtx = {};
function paintCtx(c){
  lastCtx = c || {};
  const b = document.getElementById("ctxChip");
  if (!b) return;
  const n = Number(lastCtx.n || 0);
  b.hidden = !lastCtx.text;
  b.textContent = n ? `🧠 已压缩 ${n} 条` : "🧠 前情";
}
/* 「前情提要」是模型自己压的，用户有权看它到底记住了什么 ——
   而且要能一键清掉（压歪了就重新开始）。 */
function showCtx(){
  if (!lastCtx.text){ flash("这段对话还没压缩过（历史超过预算才会压）"); return; }
  const box = document.getElementById("ctxBox");
  if (box){ box.remove(); return; }
  const d = document.createElement("div");
  d.id = "ctxBox"; d.className = "card";
  d.style.cssText = "margin:8px 0 0;padding:10px 12px;font-size:13px;line-height:1.65";
  d.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center">
      <b>🧠 前情提要（${Number(lastCtx.n||0)} 条压成）</b>
      <button class="btn tiny" onclick="clearCtx()">忘掉这段</button></div>
    <div class="kv" style="margin-top:6px;white-space:pre-wrap">${esc(lastCtx.text)}</div>`;
  const msgs = document.getElementById("msgs");
  if (msgs) msgs.parentNode.insertBefore(d, msgs);

async function clearCtx(){
  const d = await post("/api/chat/context/forget", {session: chat.session, character: ACTIVE.id});
  const box = document.getElementById("ctxBox");
  if (box) box.remove();
  if (d.ok){ lastCtx = {}; paintCtx({}); flash("已忘掉这段前情"); }
}

async function pollChat(){
  const j = await api(`/api/chat?session=${encodeURIComponent(chat.session)}&after=${chat.after}&character=${encodeURIComponent(ACTIVE.id)}`);
  if (!j || j.session !== chat.session){ return; }
  const box = $("msgs"); if (!box) return;
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
  /* 去重：切会话/跳转时两个 poll 可能同时带着 after=0 回来（viewChat 一个、
     跳转一个），不去重就会把同一段历史插两遍。按 ts 认，比按条数靠谱。 */
  const seen = new Set(Array.from(box.querySelectorAll(":scope > .msg[data-ts]"))
                          .map(n => n.dataset.ts));
  const fresh = (j.messages || []).filter(m => !seen.has(String(Number(m.ts || 0))));
  fresh.forEach(m => box.insertAdjacentHTML("beforeend", bubble(m)));
  if (fresh.length) onlyLastRegen();
  if (fresh.length) maybeAutoSpeak(fresh);      // 自动朗读：只念刚到的回复
  chat.after = Math.max(chat.after, j.total);   // 慢的那个响应不能把游标推回去
  if (fresh.length || j.running){ chat.idle = 0; } else { chat.idle += 1; }
  // 间隔由 armChatPoll 每轮自己算，这里不再手动重排
  lastRunning = j.running;
  $("chatStat").textContent = j.queue > 0 ? `队列里还有 ${j.queue} 条` : "";
  paintCtx(j.context);
  paintMood();
  const t = $("typingB");
  if (j.running && !t){
    box.insertAdjacentHTML("beforeend", `<div class="msg klee typing" id="typingB">${charAva()}
      <div><div class="bub" id="tBub">${esc(ACTIVE.name)}正在想呀想<span class="dots"></span></div><div class="meta" id="tmeta">她正在赶过来（约 35 秒）</div></div></div>`);
  } else if (!j.running && t){ t.remove(); }
  /* 流式：后端把已生成的正文放在 running.partial 里，这里原地替换。
     用 textContent 而不是 fmt()：流到一半的 ** 或 ` 还没闭合，按富文本渲染会闪。 */
  const tb = $("tBub");
  if (tb && j.running){
    const partial = String(j.running.partial || "");
    const jobKey = String(j.running.started || "");
    if (partial){
      tb.dataset.blank = "0";          // 有正文了：旧占位标记作废
      tb.classList.add("streaming");
      if (tb.textContent !== partial) tb.textContent = partial;
      const tm = $("tmeta");
      if (tm) tm.textContent = `${ACTIVE.name}正在说…`;
      if (stick) box.scrollTop = box.scrollHeight;
      requestAnimationFrame(() => { if (stick) box.scrollTop = box.scrollHeight; });
    } else {
      tb.classList.remove("streaming");
      // 队列连着跑两个任务时 running 从没机会变 null，气泡是同一个：
      // 只认 blank 会留着上一个任务的流式正文，所以还要认「这是不是新任务」。
      if (tb.dataset.blank !== "1" || tb.dataset.job !== jobKey){
        tb.innerHTML = `${esc(ACTIVE.name)}正在想呀想<span class="dots"></span>`;
        tb.dataset.blank = "1";
      }
      tb.dataset.job = jobKey;
    }
  }
  const hero = $("emptyHero");
  if (hero && (j.total > 0 || j.running)) hero.remove();
  else if (!hero && j.total === 0 && !j.running)
    box.insertAdjacentHTML("afterbegin", heroHTML());
  if (stick) box.scrollTop = box.scrollHeight;
  updateToBottom();
  armChatPoll();           // 每轮结束重排：间隔根据「刚看到的 running」现算
}
function tickTyping(){
  const t = $("tmeta"); if (!t || !lastRunning) return;
  const s = Math.round(Date.now()/1000 - lastRunning.started);
  t.textContent = `已经跑了 ${s} 秒 —— ${ACTIVE.name}马上就到！`;
}

/* ================= 自定义 ================= */
const PRESET_ACCENTS = ["#e8484f","#e0743c","#d69a2d","#5aa469","#4f8fd0","#7a6bd6","#c65fa6","#5b5b6b"];
function uiPatchFromForm(){
  const num = id => { const el = $(id); return el ? Number(el.value) : 0; };
  return {
    accent: ($("uiAccent") ? $("uiAccent").value : ""),
    accent2: ($("uiAccent2") ? $("uiAccent2").value : ""),
    radius: num("uiRadius"), font_scale: num("uiFont"),
    density: ($("uiDensity") ? $("uiDensity").value : "comfy"),
    bg: ($("uiBg") ? $("uiBg").value : "aurora"),
    bubble: ($("uiBubble") ? $("uiBubble").value : "comic"),
    card_style: ($("uiCard") ? $("uiCard").value : "glass"),
    effects: !!($("uiEffects") && $("uiEffects").checked),
    modules: uiModules.slice(),
  };
}
let uiModules = [];
function uiMove(i, d){
  const j = i + d; if (j < 0 || j >= uiModules.length) return;
  [uiModules[i], uiModules[j]] = [uiModules[j], uiModules[i]];
  viewCustom(true);

let personaTab = "soul";
function ptab(name){
  personaTab = name;
  const panes = {soul: $("paneSoul"), kb: $("paneKb"), mem: $("paneMem"), stk: $("paneStk"),
                 ex: $("paneEx")};
  const btns = {soul: $("ptSoul"), kb: $("ptKb"), mem: $("ptMem"), stk: $("ptStk"), ex: $("ptEx")};
  for (const [k, el] of Object.entries(panes)) if (el) el.style.display = k === name ? "" : "none";
  for (const [k, el] of Object.entries(btns)) if (el) el.classList.toggle("on", k === name);
  if (name === "mem") loadMemories();
  if (name === "kb") loadKbSources();
  if (name === "stk") loadStickers();
  if (name === "ex") loadExamples();
}

/* ---------- 说话样例 ----------
   每个角色一份（state/characters/<id>/examples.json），整份替换保存：
   面板上就是编辑一个完整列表，逐条 PATCH 反而容易和群里 .样例 改的打架。 */
let exItems = [], exMax = 8;
async function loadExamples(){
  const box = $("exList"); if (!box) return;
  const d = await api("/api/characters/examples?character=" + encodeURIComponent(ACTIVE.id));
  if (!d || !d.ok){ box.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`; return; }
  exItems = d.items || [];
  const max = d.max || 8;
  exMax = max;
  const tag = $("exCount");
  if (tag) tag.textContent = `${exItems.length}/${max}`;
  box.innerHTML = exItems.length ? exItems.map((it, i) => `
    <div class="kbhit" style="display:flex;gap:10px;align-items:flex-start">
      <span class="tag" style="flex:none">${i + 1}</span>
      <div style="flex:1;min-width:0">
        <div class="kv" style="margin:0">用户：${esc(it.user)}</div>
        <div style="margin-top:2px">她：${esc(it.bot)}</div>
      </div>
      <button class="btn tiny" style="flex:none" onclick="exDel(${i})">删</button>
    </div>`).join("")
    : `<div class="empty"><b>🗣</b><span>还没有说话样例</span><i>下面填一句「用户说 / 她答」加进来</i></div>`;
}
async function exSave(items, okMsg){
  const d = await post("/api/characters/examples", {character: ACTIVE.id, items});
  const m = $("exMsg");
  if (!d || !d.ok){ if (m) m.textContent = "✗ " + ((d && d.error) || "保存失败"); return false; }
  exItems = d.items || [];
  await loadExamples();
  if (m) m.textContent = okMsg || "✓ 已保存";
  return true;
}
async function exAdd(){
  const u = $("exUser"), b = $("exBot"), m = $("exMsg");
  if (!u || !b) return;
  const user = u.value.trim(), bot = b.value.trim();
  if (!user || !bot){ if (m) m.textContent = "两边都要填"; return; }
  if (exItems.length >= exMax) { if (m) m.textContent = `已经 ${exMax} 条了，先删一条`; return; }
  if (await exSave(exItems.concat([{user, bot}]), "✓ 加好了（下一条消息就生效）")){ u.value = ""; b.value = ""; }
}
async function exDel(i){
  const next = exItems.slice();
  next.splice(i, 1);
  await exSave(next, "✓ 删掉了");
}

/* ---------- 表情包 ----------
   一个角色一套，存在 state/stickers/<角色>/，文件名=语义。
   上传直接走 data URL（和发图同一条解码路径），服务端按魔数认格式。 */
let stkItems = [];
async function loadStickers(){
  const box = $("stkGrid"); if (!box) return;
  const d = await api("/api/stickers?character=" + encodeURIComponent(ACTIVE.id));
  stkItems = (d && d.items) || [];
  if (!stkItems.length){
    box.innerHTML = `<div class="empty"><b>😀</b><span>还没有表情</span>
      <i>点右上「＋ 上传」，文件名写它的意思（开心.png）</i></div>`;
    return;
  }
  box.innerHTML = stkItems.map(it => `
    <div class="stk" title="${esc(it.name)} · ${Math.round(it.bytes / 1024)}KB">
      <img src="/api/chat/image?p=${encodeURIComponent(it.ref)}" alt="${esc(it.name)}" loading="lazy">
      <div class="nm">${esc(it.name)}</div>
      <div class="ops">
        <button class="btn tiny" onclick="stkSend(${esc(JSON.stringify(it.name))})">发到对话</button>
        <button class="btn tiny" onclick="stkDel(${esc(JSON.stringify(it.name))})">删</button>
      </div>
    </div>`).join("");
}
function stkPick(){ const el = $("stkFile"); if (el){ el.value = ""; el.click(); } }
async function stkUpload(inp){
  const files = Array.from(inp.files || []);
  inp.value = "";
  const msg = $("stkMsg");
  if (!files.length) return;
  let ok = 0, fail = [];
  for (const f of files.slice(0, 12)){
    if (f.size > 2 * 1024 * 1024){ fail.push(f.name + "（超过 2MB）"); continue; }
    const data = await new Promise(res => {
      const r = new FileReader();
      r.onload = () => res(String(r.result || ""));
      r.onerror = () => res("");
      r.readAsDataURL(f);
    });
    if (!data){ fail.push(f.name + "（读不到）"); continue; }
    const nm = String(f.name || "").replace(/\.[^.]+$/, "");
    const d = await post("/api/stickers/upload", {character: ACTIVE.id, name: nm, data});
    if (d && d.ok) ok++; else fail.push(nm + "：" + ((d && d.error) || "失败"));
  }
  if (msg) msg.textContent = fail.length
    ? `✓ ${ok} 张，${fail.length} 张没成：${fail.slice(0, 3).join("；")}`
    : `✓ 已上传 ${ok} 张`;
  loadStickers();
}
async function stkDel(name){
  if (!confirm(`删掉「${name}」这张表情？`)) return;
  const d = await post("/api/stickers/delete", {character: ACTIVE.id, name});
  if (d && d.ok) loadStickers();
}
async function stkSend(name){
  // 直接发到当前会话：想看效果不用先编一句话等模型回应
  const d = await post("/api/stickers/send", {character: ACTIVE.id, name,
                                              session: chat.session || "studio-main"});
  if (d && d.ok){ flash("发好啦，回对话页看"); }
  else flash((d && d.error) || "没发出去");
}

/* ---------- 记忆整理 ---------- */
let memPlan = null, memPlanParams = null;
function memTidyInvalidate(){
  // 改了阈值/天数就得重新预演：apply 用的必须是「你刚刚看过的那份计划」
  memPlan = null; memPlanParams = null;
  const go = $("memTidyGo");
  if (go) go.style.display = "none";
}
function memTidyParams(){
  return {threshold: Number((($("memTh") || {}).value) || 0.45),
          stale_days: Number((($("memStale") || {}).value) || 0)};
}
async function memTidyPreview(btn){
  btn = btn || {};
  const out = $("memTidyOut"), go = $("memTidyGo");
  // 参数在**发请求前**快照一份：比对要几秒，期间用户可能改了阈值 ——
  // URL 和 memPlanParams 必须来自同一份，否则装回去的是「旧计划 + 新参数」
  const args = Object.assign(memTidyParams(), {character: ACTIVE.id});
  if (out) out.innerHTML = `<div class="kv">比对中…（${ACTIVE.id} 的记忆）</div>`;
  btn.disabled = true;
  const d = await api("/api/memories/tidy?character=" + encodeURIComponent(ACTIVE.id) +
    "&threshold=" + args.threshold + "&stale_days=" + args.stale_days);
  btn.disabled = false;
  if (!d || !d.ok){
    memTidyInvalidate();          // 上一次的计划不能留着被点
    if (out) out.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`;
    return;
  }
  // 预演期间用户可能改了参数（oninput 已经把计划作废了）：别把旧参数的
  // 结果又装回去 —— 输入框是新值、要应用的是旧预览，那是最坑的一种错位
  const nowArgs = memTidyParams();
  if (nowArgs.threshold !== args.threshold || nowArgs.stale_days !== args.stale_days
      || ACTIVE.id !== args.character){
    memTidyInvalidate();
    if (out) out.innerHTML = `<div class="kv">参数改过了，这次比对作废，请重新预演。</div>`;
    return;
  }
  memPlan = d;
  memPlanParams = args;          // 和这次请求的 URL 同一份
  const c = d.counts || {};
  if (!c.groups && !c.stale){
    if (out) out.innerHTML = `<div class="kv">没有可以合并的（${c.total} 条记忆里没有近似重复）。</div>`;
    if (go) go.style.display = "none";
    return;
  }
  if (out) out.innerHTML = `<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:6px">
      <span class="tag">${c.total} 条</span>
      <span class="tag">合并 ${c.merged} 条</span>
      ${c.stale ? `<span class="tag">归档 ${c.stale} 条</span>` : ""}
      <span class="tag">整理后 ${c.keep} 条</span></div>`
    + (d.groups || []).map(g => `<div class="tidygrp">
        <div class="kv" style="margin:0">保留：${esc(g.text)}</div>
        ${(g.texts || []).map(t => `<div class="kv tidyold">合并：${esc(t)}</div>`).join("")}
      </div>`).join("")
    + (c.stale ? `<details><summary class="kv">要归档的 ${c.stale} 条</summary>
        ${(d.stale || []).map(x => `<div class="kv tidyold">${esc(String(x.text || "").slice(0, 100))}</div>`).join("")}
      </details>` : "");
  if (go) go.style.display = "";
}
async function memTidyApply(btn){
  if (!memPlan || !memPlanParams){ flash("先预演一次"); return; }
  if (memPlanParams.character && memPlanParams.character !== ACTIVE.id){
    flash("角色切换过了，先重新预演"); memTidyInvalidate(); return;
  }
  if (!confirm("确认整理？会写盘（先备份 .bak），合并掉的句子只保留最新那条。")) return;
  btn.disabled = true; btn.textContent = "整理中…";
  const d = await post("/api/memories/tidy", {
    character: ACTIVE.id,
    // 用**预演时**的参数：不然改完数字直接点确认，实际合并范围和刚才看到的不一致
    threshold: memPlanParams.threshold,
    stale_days: memPlanParams.stale_days,
    apply: true});
  btn.disabled = false; btn.textContent = "确认整理";
  const msg = $("memTidyMsg");
  if (!d || !d.ok){
    if (msg) msg.textContent = "✗ " + ((d && d.error) || "整理失败");
    return;
  }
  if (msg) msg.textContent = `✓ ${d.result.before} → ${d.result.after} 条（合并 ${d.result.merged}，归档 ${d.result.archived}）`;
  memPlan = null;
  // 整理要几秒，用户可能已经切页（DOM 被重绘掉）→ 别在这里 TypeError
  const goEl = $("memTidyGo"), outEl = $("memTidyOut");
  if (goEl) goEl.style.display = "none";
  if (outEl) outEl.innerHTML = "";
  loadMemories();
}

async function loadMemories(){
  const box = $("memOut");
  if (!box) return;
  const d = await api("/api/memories?character=" + encodeURIComponent(ACTIVE.id));
  const items = (d && d.items) || [];
  if (!items.length){
    box.innerHTML = `<div class="kv">还没有记忆。聊到要紧的事，点消息下面的「记住」，或者在上面写一条。</div>`;
    return;
  }
  box.innerHTML = items.map(e => {
    const when = e.ts ? new Date(e.ts * 1000).toLocaleString("zh-CN",
      {month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"}) : "";
    const from = e.source === "agent" ? "她自己记的" : "我记的";
    // scope：空 = 全局（面板里点的「记住」）；group:/private: = 只在那个会话算数
    const sc = !e.scope ? "全局" : (String(e.scope).startsWith("group") ? "群里" :
                                    String(e.scope).startsWith("web:") ? "网页" : "私聊");
    return `<div class="opsline" style="display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)">
      <span class="kv" style="flex:none;width:86px">${esc(when)}<br>${esc(from)} · ${esc(sc)}</span>
      <span style="flex:1;min-width:0;word-break:break-word">${esc(e.text)}</span>
      <button class="btn tiny icon" style="flex:none" title="忘掉这条"
              onclick="delMemory(${Number(e.ts) || 0})">✕</button>
    </div>`;
  }).join("");
}
async function addMemory(){
  const inp = $("memQ");
  const text = (inp && inp.value || "").trim();
  if (!text){ flash("写点什么再记"); return; }
  const r = await post("/api/memories", {character: ACTIVE.id, text, source: "panel"});
  if (!r || !r.ok){ alert((r && r.error) || "记不下来"); return; }
  if (inp) inp.value = "";
  flash(r.item && r.item.hits ? "这条已经记过了" : "记住了");
  loadMemories();
}
async function delMemory(ts){
  const r = await post("/api/memories/delete", {character: ACTIVE.id, ts});
  if (!r || !r.ok){ alert((r && r.error) || "删不掉"); return; }
  loadMemories();
  flash("忘掉了");
}
async function savePersona(){
  const soul = $("soul").value;
  $("pMsg").textContent = "保存中…";
  const r = await post("/api/persona", {soul, character: ACTIVE.id});
  $("pMsg").textContent = r.ok ? "✓ 已保存" : `✗ ${r.error}`;
}
function renderKbRecent(rows){
  const box = $("kbRecent"); if (!box) return;
  if (!rows.length){
    box.innerHTML = `<div class="kv">还没有命中记录</div>`;
    return;
  }
  box.innerHTML = rows.map(r => {
    const when = r.ts ? new Date(r.ts*1000).toLocaleString("zh-CN",{hour12:false}) : "—";
    const hits = (r.hits || []).map(h =>
      `<span class="tag">${esc(h.source || "?")}${h.title ? " · " + esc(h.title) : ""} <b>${(h.dense ?? 0).toFixed(3)}</b></span>`).join(" ");
    return `<div class="kbhit"><div class="kbh-h"><span class="kbh-t">「${esc(r.query || "")}」</span>
      <span class="kbh-s">${esc(when)} · ${r.via === "panel" ? "面板" : "QQ"} · 注入 ${r.chars || 0} 字</span></div>
      <div class="kbh-h" style="margin:0">${hits}</div></div>`;
  }).join("");
}
async function loadKbManual(){
  const box = $("kbManual"); if (!box) return;
  const d = await api("/api/kb/manual?character=" + encodeURIComponent(ACTIVE.id));
  const items = (d && d.items) || [];
  if (!items.length){ box.innerHTML = ""; return; }
  box.innerHTML = `<div class="kv" style="margin-bottom:4px">我加的（${items.length} 条，点标题可展开）</div>`
    + items.map(it => `<div class="kbhit">
        <div class="kbh-h"><span class="kbh-t" style="cursor:pointer"
            onclick="this.parentNode.nextElementSibling.hidden=!this.parentNode.nextElementSibling.hidden">
            ${esc(it.title || "（没标题）")}</span>
          <span class="kbh-s">#${it.id}
            <button class="btn tiny" onclick="kbDel(${it.id})">删</button></span></div>
        <div class="kbt" hidden>${esc(it.text)}</div>
      </div>`).join("");
}
async function kbAdd(){
  const text = ($("kbAddText").value || "").trim();
  const msg = $("kbAddMsg");
  if (text.length < 4){ if (msg) msg.textContent = "再多写几个字（至少 4 个）"; return; }
  if (msg) msg.textContent = "保存中…";
  const d = await post("/api/kb/add", {character: ACTIVE.id, title: $("kbAddTitle").value, text});
  if (!d || !d.ok){ if (msg) msg.textContent = "✗ " + ((d && d.error) || "失败"); return; }
  $("kbAddText").value = ""; $("kbAddTitle").value = "";
  if (msg) msg.textContent = `✓ 已加入（现在 ${d.chunks} 块）`;
  const n = document.querySelector("#paneKb .statgrid b");
  if (n) n.textContent = String(d.chunks);      // 卡片上的「知识块」跟着变，别停在旧值
  loadKbManual();
}
async function kbDel(id){
  if (!confirm("删掉这条？检索就再也找不到它了。")) return;
  const d = await post("/api/kb/delete", {character: ACTIVE.id, id});
  if (d && d.ok){
    flash(`删掉了（剩 ${d.chunks} 块）`);
    const n = document.querySelector("#paneKb .statgrid b");
    if (n) n.textContent = String(d.chunks);      // 卡片上的块数也要跟着减
    loadKbManual();
  } else flash((d && d.error) || "删不掉");
}
async function loadKbRecent(){
  loadKbManual();
  const d = await api("/api/kb/recent?n=20&character=" + encodeURIComponent(ACTIVE.id));
  renderKbRecent((d && d.hits) || []);
}
async function kbSearch(){
  const q = $("kbQ").value.trim(); if (!q) return;
  $("kbOut").innerHTML = '<div class="kv">检索中…</div>';
  const d = await api(`/api/kb/search?q=${encodeURIComponent(q)}&k=6&character=${encodeURIComponent(ACTIVE.id)}`);
  if (!d.ok){ $("kbOut").innerHTML = `<div class="kv">✗ ${esc(d.error || "失败")}</div>`; return; }
  const hits = d.hits || [];
  $("kbOut").innerHTML = `
    <div class="kv">best_dense = <b>${(d.best_dense ?? 0).toFixed(3)}</b> · 阈值 ${(d.threshold ?? 0.4)} · 这里展示原始排名</div>
    ${hits.map(h => `<div class="kbhit">
      <div class="kbh-h"><span class="kbh-t">${esc(h.title || "(无标题)")}</span>
        <span class="kbh-s">${esc(h.source || "")} · dense ${(h.dense ?? 0).toFixed(3)}${h.sparse != null ? " · sparse " + Number(h.sparse).toFixed(3) : ""}</span></div>
      <div class="kbt">${esc((h.text || "").slice(0, 260))}</div></div>`).join("") || '<div class="kv">没有命中</div>'}`;
}

let plFiles = [], plSel = null, plCfg = null, plTab = "file", plMeta = {};
/* ---------- 插件体检 ----------
   同一个角色内命令名/别名必须唯一：撞名时框架只写一行日志、把整条命令丢掉，
   面板上看不出来（插件显示正常、命令就是不在）。这里把这类「静默失效」
   翻出来 —— 项目已经因此丢过 .字数 和 .draw 两次。
   （跨角色同名是允许的：两份的角色集合不相交就都留着，按会话角色挑。） */
async function plugAudit(){
  const box = $("auditBox");
  if (!box) return;
  box.innerHTML = `<div class="card"><div class="kv">正在体检…（读插件目录 + 已注册命令）</div></div>`;
  const d = await api("/api/plugins/audit");
  if (!d || !d.ok){
    box.innerHTML = `<div class="card"><div class="kv">✗ ${esc((d && d.error) || "体检失败")}</div></div>`;
    return;
  }
  const issues = d.issues || [];
  const c = d.counts || {};
  if (!issues.length){
    box.innerHTML = `<div class="card" style="border-color:color-mix(in srgb,var(--green) 40%,var(--line))">
      <div class="row" style="justify-content:space-between;align-items:center">
        <b style="color:var(--green)">✓ 没发现问题</b>
        <span class="kv">${c.plugins || 0} 个插件 · ${c.commands || 0} 条命令 · ${esc(d.checked_at || "")}</span>
        <button class="btn tiny" onclick="plugAudit()">再查一次</button></div></div>`;
    return;
  }
  const kindCN = {command_taken:"命令被占", command_missing:"命令没注册上",
                  not_loaded:"没装载", ghost:"配置开着但没跑", plugin_error:"插件报错",
                  unknown_character:"角色不存在", tool_plugin_missing:"工具插件没装载",
                  tool_unregistered:"工具没人注册", ext_missing:"外部插件入口丢了",
                  schema:"配置项写坏", toolbox:"工具表读不到"};
  box.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <b>🩺 体检：${c.error || 0} 个必须修 · ${c.warn || 0} 个建议看看</b>
      <button class="btn tiny" onclick="plugAudit()">再查一次</button>
    </div>
    <div style="margin-top:8px">
      ${issues.map(i => `<div class="opsline" style="display:flex;gap:8px;align-items:flex-start;
          padding:6px 0;border-bottom:1px solid var(--line)">
        <span class="tag ${i.level === "error" ? "bad" : ""}" style="flex:none"
          >${i.level === "error" ? "必修" : "建议"}</span>
        <div style="flex:1;min-width:0">
          <div><b>${esc(i.plugin || "（全局）")}</b>
            <span class="kv">· ${esc(kindCN[i.kind] || i.kind)}</span></div>
          <div class="kv" style="line-height:1.6">${esc(i.message)}</div>
          ${i.fix ? `<div class="kv" style="opacity:.8">↳ ${esc(i.fix)}</div>` : ""}
        </div>
        ${i.plugin && plMeta[i.plugin] ? `<button class="btn tiny" style="flex:none"
            onclick="openPluginDrawer(${jsq(i.plugin)})">打开</button>` : ""}
      </div>`).join("")}
    </div></div>`;
}

let plugMode = "all";
const PLUG_ICON = {klee:"💥",hutao:"🦋",citlali:"🔮",cyrene:"🪶",honghong:"🦊",atri:"⚙️"};
let plugSearchTimer = null;
function plugSearchSoon(){
  clearTimeout(plugSearchTimer);
  plugSearchTimer = setTimeout(renderPlugGrid, 140);
}
function plugFilter(m){
  plugMode = m;
  document.querySelectorAll("[data-pf]").forEach(b => b.classList.toggle("on", b.dataset.pf === m));
  renderPlugGrid();
}
function renderPlugGrid(){
  const box = $("plugGrid"); if (!box) return;
  const q = ($("plugSearch") ? $("plugSearch").value : "").trim().toLowerCase();
  // 数据源用 meta（普通插件 + 系统插件都在里面），再用 files 补「刚放进来、
  // 还没来得及重载」的 .py —— 否则新插件在列表里根本看不见。
  const names = new Set(Object.keys(plMeta || {}));
  (plFiles || []).forEach(f => names.add(String(f.name || "").replace(/\.py$/, "")));
  const rows = [...names].map(name => {
    const m = plMeta[name] || {};
    return {name, title: bi(m.title || name, m.title_en), description: bi(m.description || "", m.description_en),
            system: !!m.system, chars: m.characters || [], locked: !!m.locked,
            enabled: !!m.enabled, error: m.error || "",
            commands: m.commands || 0, hits: m.hits || 0,
            usage: m.usage || "", version: m.version || "1.0",
            external: !!m.external, language: m.language || "",
            ingress: m.ingress || "", health: m.health || null,
            missing: m.missing || [], tools: m.tools || []};
  }).filter(p => {
    // 角色限定插件与角色绑定：不是当前角色的，直接不显示
    if (!p.system && p.chars.length && !p.chars.includes(ACTIVE.id)) return false;
    if (plugMode === "limited" && (!p.chars.length || p.system)) return false;
    if (plugMode === "general" && (p.system || p.chars.length)) return false;
    if (plugMode === "system" && !p.system) return false;
    if (plugMode === "on" && !p.enabled) return false;
    if (plugMode === "off" && p.enabled) return false;
    if (plugMode === "err" && !p.error) return false;
    if (q){
      const hay = (p.name + p.title + p.description + p.usage + p.ingress).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => {
    // 系统插件永远排前面（它们是「平台」，不是普通功能）
    if (a.system !== b.system) return a.system ? -1 : 1;
    return a.title.localeCompare(b.title, "zh");
  });
  if (!rows.length){
    box.innerHTML = `<div class="empty"><b>🧩</b><span>${t("plug.empty")}</span>
      <i>${q ? "换个关键词，或清空搜索" : ""}</i></div>`;
    return;
  }
  box.innerHTML = rows.map(p => {
    const owner = p.system
      ? t("owner.system")
      : (!p.chars.length
          ? "通用"
          : (p.chars.includes(ACTIVE.id)
              ? `${PLUG_ICON[ACTIVE.id] || "🎭"} ${esc(ACTIVE.name)}${p.chars.length > 1 ? " · 共享" : ""}`
              : `${PLUG_ICON[p.chars[0]] || "🎭"} ${esc(p.chars[0])}`));
    const sub = p.system
      ? (p.tools.length ? `${t("plug.tools")} · ${p.tools.length}`
                         : `${t("plug.adapter")} · ${esc(p.ingress || t("plug.outbound"))}`)
      : (p.tools.length ? `${t("plug.tools")} · ${p.tools.length} · ${esc(p.name)}.py`
      : (p.external
          ? `${esc(p.language || "binary")} · ${esc(p.name)} · v${esc(p.version)}`
          : `${esc(p.name)}.py · v${esc(p.version)}`));
    const ready = p.health && p.health.ok;
    const why = p.error || (p.health && p.health.error) || "";
    const foot = p.system
      ? `${p.missing.length ? `<span style="color:var(--red)" title="还差：${esc(p.missing.join(" / "))}">缺 ${p.missing.length} 项</span>` : ""}`
        + `<span title="${esc(why)}">${p.error ? t("plug.failed")
            : (p.enabled ? (ready ? t("plug.connected") : t("plug.disconnected")) : t("plug.off"))}</span>`
        + (why && p.enabled ? `<span title="${esc(why)}">详情</span>` : "")
      : `<span>${p.error ? t("plug.failed") : (p.enabled ? t("plug.on") : t("plug.off"))}</span>
         ${p.tools.length ? `<span>${t("plug.tools")} ${p.tools.length}</span>`
                          : `<span>${t("plug.commands")} ${p.commands}</span>`}<span>${t("plug.hits")} ${p.hits}</span>`;
    return `<div class="plugcard ${p.name === plSel ? "on" : ""} ${p.system ? "syscard" : ""}"
        onclick="openPluginDrawer(${jsq(p.name)})" title="${esc(p.description)}">
      <span class="st ${p.error ? "err" : (p.enabled ? "on" : "")}"></span>
      <div class="top"><span class="ico">${p.system ? "🔌"
        : (p.external ? (LANG_ICON[p.language] || "🧬")
        : (p.chars.length ? (PLUG_ICON[p.chars[0]] || "🎭") : "🧩"))}</span>
        <div><div class="nm">${esc(p.title)}</div><div class="sub">${sub}</div></div></div>
      <div class="desc">${esc(p.description || "（没有说明）")}</div>
      <div class="foot"><span class="lock" style="${p.chars.length || p.system ? "" : "color:var(--ink-soft);border-color:var(--line)"}">${owner}</span>
        ${foot}</div>
    </div>`;
  }).join("");
}
