async function fbSave(msg){
  const d = await post("/api/models", {fallbacks: __fb});
  const out = document.getElementById("fbOut");
  if (d.ok) { fbRender(d.fallbacks || []); if (out) out.textContent = msg || "✓ 已保存"; }
  else if (out) out.textContent = "✗ " + (d.error || "保存失败");
}
function fbAdd(){
  const p = $("fbProv").value, m = $("fbModel").value;
  if (!p || !m) return;
  if (__fb.length >= 4) { $("fbOut").textContent = "最多 4 个"; return; }
  if (__fb.some(x => x.provider === p && x.model === m)) { $("fbOut").textContent = "已经在列表里了"; return; }
  const act = (window.__md || {}).active || {};
  if (act.provider === p && act.model === m) { $("fbOut").textContent = "这就是当前主模型，加进来也不会被用到"; return; }
  __fb.push({provider: p, model: m});
  fbSave(`✓ 已加：${p} / ${m}（${__fb.length} 个备选）`);
}
function fbDel(i){ __fb.splice(i,1); fbSave("✓ 已删除"); }
function fbMove(i, d){
  const j = i + d;
  if (j < 0 || j >= __fb.length) return;
  [__fb[i], __fb[j]] = [__fb[j], __fb[i]];
  fbSave("✓ 顺序已调整");
}

/* ---- 角色专属模型 ---- */
let __cm = {};
function cmRender(map){
  __cm = Object.assign({}, map || {});
  const box = document.getElementById("cmList");
  if (!box) return;
  const chars = window.__chars || [];
  const provs = window.__provs || [];
  box.innerHTML = chars.map(c => {
    const own = __cm[c.id] || null;
    const pid = own ? own.provider : (provs[0] || {}).id;
    const p = provs.find(x => x.id === pid) || {models: []};
    const models = optList(p.models, own ? own.model : "");
    return `<div class="opsline" style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap">
      <b style="flex:none;min-width:74px">${esc((c.emoji||"") + " " + (c.name||c.id))}</b>
      <select id="cmp-${esc(c.id)}" onchange="cmFill(${jsq(c.id)})" style="min-width:150px">
        ${provs.map(x=>`<option value="${esc(x.id)}" ${x.id===pid?"selected":""}>${esc(x.name||x.id)}</option>`).join("")}
      </select>
      <select id="cmm-${esc(c.id)}" style="min-width:200px">
        <option value="">（跟全局）</option>
        ${models.map(m=>`<option ${own && m===own.model?"selected":""}>${esc(m)}</option>`).join("")}
      </select>
      <button class="btn tiny" onclick="cmSave(${jsq(c.id)})">保存</button>
      ${own ? `<span class="kv">用 ${esc(own.model)}</span>` : ""}
    </div>`;
  }).join("");
}
function cmFill(cid){
  const p = (window.__provs || []).find(x => x.id === $("cmp-"+cid).value) || {models: []};
  const own = __cm[cid] || null;
  $("cmm-"+cid).innerHTML = '<option value="">（跟全局）</option>' +
    optList(p.models, own ? own.model : "").map(m=>`<option>${esc(m)}</option>`).join("");
}
async function cmSave(cid){
  const model = $("cmm-"+cid).value;
  const d = await post("/api/models", {char_model: {character: cid, provider: $("cmp-"+cid).value, model}});
  const out = document.getElementById("cmOut");
  if (d.ok) { cmRender(d.characters || {}); if (out) out.textContent = model ? `✓ ${cid} 已单独指定：${model}` : `✓ ${cid} 恢复跟全局一样`; }
  else if (out) out.textContent = "✗ " + (d.error || "保存失败");
}

/* 下拉候选 = provider 的模型清单 + 已保存的那个值。
   少了后半句，<select> 会落到第一项：「保存」一下就把用户选的模型换掉/清空。 */
function optList(models, current){
  const ms = (models || []).map(String);
  const cur = String(current || "");
  if (cur && !ms.includes(cur)) ms.unshift(cur);
  return ms;
}
function botFillModels(){
  const p = (window.__provs || []).find(x => x.id === $("mpProv").value) || {models: []};
  $("mpModel").innerHTML = (p.models || []).map(m=>`<option>${esc(m)}</option>`).join("");
}
/* ---------- 用量预算 ---------- */
/* 注意：`d.action` 是**这一次判定**的结果（ok/near/warn/cheap/stop），
   不是配置里那个策略；两套词分开映射，别拿策略表去查判定值。 */
const BG_NOW = {ok: "正常", near: "快到上限了", warn: "超了（只提醒）",
                cheap: "超了（这轮用便宜模型）", stop: "超了（已停止调用）"};
async function bgLoad(){
  const box = $("bgBox");
  if (!box) return;
  const d = await api("/api/budget");
  if (!d || !d.ok){ box.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`; return; }
  const c = d.config || {};
  const pct = Math.max(d.pct_day || 0, d.pct_hour || 0);
  const cls = d.action === "stop" ? "bad" : (pct >= 0.8 ? "warn" : "ok");
  box.innerHTML = `
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:6px">
      <label class="check"><input type="checkbox" id="bgOn" ${c.on ? "checked" : ""}> 启用</label>
      <label class="kv" style="margin:0">每天 <input type="number" id="bgDay" value="${c.daily_tokens || 0}"
        min="0" step="10000" style="width:100px"> token</label>
      <label class="kv" style="margin:0">每小时 <input type="number" id="bgHour" value="${c.hourly_tokens || 0}"
        min="0" step="5000" style="width:90px"> token</label>
      <label class="kv" style="margin:0">超了
        <select id="bgAct" style="min-width:120px">
          ${Object.entries(d.actions || {}).map(([k, v]) =>
            `<option value="${k}" ${k === c.action ? "selected" : ""}>${esc(v)}</option>`).join("")}
        </select></label>
      <label class="kv" style="margin:0">便宜模型
        <select id="bgCheap" style="min-width:180px">
          <option value="">（没配 · 「换便宜模型」会退化成只提醒）</option>
          ${(() => {
            const pairs = (window.__provs || []).flatMap(p => (p.models || []).map(m => [p.id, m]));
            // 已配置但已经不在任何清单里的组合也要列出来：否则浏览器落到占位项，
            // 下次保存就把配置悄悄清空了
            const cur = c.cheap_model ? [c.cheap_provider || "", c.cheap_model] : null;
            if (cur && !pairs.some(([pid, m]) => pid === cur[0] && m === cur[1])) pairs.unshift(cur);
            return pairs.map(([pid, m]) => `<option value="${esc(pid + "|" + m)}"
              ${(c.cheap_provider === pid && c.cheap_model === m) ? "selected" : ""}>${esc(m)}${pid ? "" : "（未指定供应商）"}</option>`).join("");
          })()}
        </select></label>
      <button class="btn primary tiny" onclick="bgSave(this)">保存</button>
    </div>
    <div class="prbar" style="margin:6px 0 4px">
      <i class="pb-${cls === "bad" ? "k" : (cls === "warn" ? "b" : "c")}"
         style="width:${Math.min(100, Math.round(pct * 100))}%"></i>
    </div>
    <div class="kv" style="margin:0">
      今天 <b>${d.used_day}</b>${c.daily_tokens ? " / " + c.daily_tokens : ""} token
      · 这一小时 <b>${d.used_hour}</b>${c.hourly_tokens ? " / " + c.hourly_tokens : ""}
      · 现在：<b>${esc(BG_NOW[d.action] || d.action || "正常")}</b>
      ${d.reason ? `<span class="tag ${cls === "bad" ? "bad" : ""}">${esc(d.reason)}</span>` : ""}
    </div>`;
}
async function bgSave(btn){
  btn.disabled = true;
  const cheap = (($("bgCheap") || {}).value || "").split("|");
  const d = await post("/api/budget", {
    on: !!($("bgOn") || {}).checked,
    daily_tokens: Number(($("bgDay") || {}).value || 0),
    hourly_tokens: Number(($("bgHour") || {}).value || 0),
    action: ($("bgAct") || {}).value || "warn",
    cheap_provider: cheap[0] || "", cheap_model: cheap[1] || ""});
  btn.disabled = false;
  if (!d || !d.ok){ flash("保存失败：" + ((d && d.error) || "未知")); return; }
  bgLoad();
}

/* ---------- 语料来源：按 source 统计 / 整组删除 ---------- */
let kbPurgeArm = "";             // 两次点击确认：内容是 ACTIVE.id + "\u0000" + 来源
async function loadKbSources(){
  const box = $("kbSrc");
  if (!box) return;
  const d = await api("/api/kb/sources?character=" + encodeURIComponent(ACTIVE.id));
  if (!d || !d.ok){
    box.innerHTML = `<div class="kv">读不到来源：${esc((d && d.error) || "未知")}</div>`;
    return;
  }
  const items = d.items || [];
  if (!items.length){ box.innerHTML = `<div class="kv">这个角色的语料库是空的</div>`; return; }
  box.innerHTML = items.map(x => {
    // 键里带角色：「群聊新词」这种来源每个角色都有，只按名字记会让另一个角色
    // 的同名来源一进来就是「已武装」状态，一次点击就删掉
    const armed = kbPurgeArm === (ACTIVE.id + "\u0000" + x.source);
    return `<div class="kbhit" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <b style="flex:1;min-width:110px">${esc(x.source)}</b>
      <span class="kv" style="flex:none;margin:0">${x.chunks} 块</span>
      <button class="btn tiny ${armed ? "danger" : ""}" style="flex:none"
        onclick="kbPurge(${jsq(x.source)}, ${armed ? "true" : "false"})">
        ${armed ? "确定删除？" : "删除这个来源"}</button>
    </div>`;
  }).join("") + `<div class="kv" style="margin-top:6px">共 ${d.total} 块</div>`;
}
async function kbPurge(source, confirmed){
  if (!confirmed){
    kbPurgeArm = ACTIVE.id + "\u0000" + source;
    await loadKbSources();
    flash(`再点一次删除「${source}」`);
    return;
  }
  kbPurgeArm = "";
  const d = await post("/api/kb/purge", {character: ACTIVE.id, source, confirm: true});
  if (!d || !d.ok){ flash("✗ " + ((d && d.error) || "删除失败")); await loadKbSources(); return; }
  flash(`已删除「${source}」的 ${d.deleted} 块`);
  await loadKbSources();
}

/* ---------- 新词候选：从群聊里学梗 ----------
   判定是「频次 + 内部凝聚度 + 左右自由度」，纯规则；面板上人点一下才入库。 */
let nwDays = 14, nwChatSel = "", nwHideKnown = true;   // 都放模块变量：viewBoard 每 60 秒重绘整页
function nwSet(d){ nwDays = d; nwLoad(); }
async function nwLoad(){
  const box = $("nwBox"), sel = $("nwChat");
  if (!box) return;
  const days = nwDays, chat = nwChatSel || (sel ? sel.value : "");
  const hide = !!nwHideKnown;
  const d = await api("/api/newwords?days=" + days + (chat ? "&chat=" + encodeURIComponent(chat) : ""));
  // 过期响应：天数、会话、还有「隐藏已知」都要比对（少一样就会用旧开关渲染）
  if (days !== nwDays || hide !== !!nwHideKnown
      || chat !== (nwChatSel || (sel ? sel.value : ""))) return;
  if (!d || !d.ok){ box.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`; return; }
  for (const k of [7, 14, 30]){
    const b = $("nw" + k);
    if (b) b.classList.toggle("primary", k === days);
  }
  if (sel){
    // 每次都用服务端给的会话列表重建（以前读一个从没赋值的全局，下拉永远是空的）
    const chats = (d.chats || []).slice();
    const keep = nwChatSel;
    // 选中的群安静一阵就掉出「最近 40 个」：补一项保住选择，
    // 否则下拉悄悄跳回「全部会话」，而屏幕上的候选还是按旧 chat 过滤的
    if (keep && !chats.includes(keep)) chats.unshift(keep);
    sel.innerHTML = `<option value="">全部会话</option>` +
      chats.map(c => `<option value="${esc(c)}">${esc(prChatLabel(c))}</option>`).join("");
    sel.value = keep;
    nwChatSel = sel.value;
  }
  const all = d.items || [];
  const rows = hide ? all.filter(x => !x.known) : all;
  const msg = $("nwMsg");
  if (msg) msg.textContent = `${d.counts.scanned} 条消息里挑出 ${all.length} 个候选`
    + (hide ? `，隐藏了 ${all.length - rows.length} 个已知词` : "")
    + (d.counts.ignored ? `，忽略名单 ${d.counts.ignored} 个` : "");
  if (!rows.length){
    box.innerHTML = `<div class="kv">${all.length ? "候选都被标成已知了" : "还没有够格的新词（至少 3 次、2 个人说过）"}</div>`;
    return;
  }
  box.innerHTML = rows.map(x => `
    <div class="kbhit" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <b style="flex:none;min-width:74px">${esc(x.word)}</b>
      <span class="kv" style="flex:1;margin:0;min-width:120px">${x.count} 次 · ${x.users} 人
        · 凝聚 ${x.pmi}</span>
      ${x.known ? `<span class="tag">已在知识库</span>` : ""}
      <button class="btn tiny" style="flex:none" onclick="nwAdd(${jsq(x.word)})">加进知识库</button>
      <button class="btn tiny" style="flex:none" onclick="nwIgnore(${jsq(x.word)})">忽略</button>
    </div>`).join("");
}
async function nwAdd(word){
  const d = await post("/api/newwords", {action: "kb", word, character: ACTIVE.id});
  const m = $("nwMsg");
  if (!d || !d.ok){ if (m) m.textContent = "✗ " + ((d && d.error) || "没加进去"); return; }
  if (m) m.textContent = `✓ 「${word}」已收进知识库（下一条消息就可能命中）`;
  nwLoad();
}
async function nwIgnore(word){
  const d = await post("/api/newwords", {action: "ignore", word});
  if (!d || !d.ok){ flash("✗ " + ((d && d.error) || "没保存")); return; }
  flash(`已忽略「${word}」`);
  nwLoad();
}

      <label class="kv" style="margin:0">每分钟最多 <input type="number" id="thMin" value="${c.per_min || 0}"
        min="0" max="120" style="width:74px"> 条</label>
      <label class="kv" style="margin:0">每小时最多 <input type="number" id="thHour" value="${c.per_hour || 0}"
        min="0" max="5000" style="width:84px"> 条</label>
      <label class="kv" style="margin:0">超了
        <select id="thAct" style="min-width:120px">
          ${Object.entries(d.actions || {}).map(([k, v]) =>

    </div>`).join("") : `<div class="kv">最近没有会话在聊</div>`}
    <div class="kv" style="margin-top:6px">${esc(d.hint || "")}${d.throttled ? ` · 累计拦下 ${d.throttled} 条` : ""}</div>`;

async function thSave(btn){

/* ---------- 谁在花你的钱：按会话归账 ----------
   数据来自 /api/usage 的 chats（llm 每次调用记一条 usage 行，带 chat 字段）。
   老记录没有 chat → 归到「未记录」，不硬塞给当前会话。 */
let ucDays = 7;                     // 0 = 今天（本地零点起），其它是「最近 N 天」
/* 7 位数的 token 连写根本读不出来，统一加千分位 */
function tnum(n){
  const v = Math.round(Number(n) || 0);
  return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function ucSet(days){ ucDays = days; ucLoad(); }
async function ucLoad(){
  const box = $("ucBox"), sum = $("ucSum");
  if (!box) return;
  const days = ucDays;                     // 快照：连点几个按钮时，慢的那个不能盖掉新的
  const q = days === 0 ? "/api/usage?today=1" : "/api/usage?days=" + days;
  const d = await api(q);
  if (days !== ucDays) return;
  if (!d || !d.ok){ box.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`; return; }
  for (const k of [0, 7, 30]){
    const b = $("uc" + (k === 0 ? 1 : k));      // 「今天」按钮的 id 是 uc1
    if (b) b.classList.toggle("primary", k === days);
  }
  const rows = d.chats || [];
  const tot = (d.totals || {}).total || 0;
  if (sum) sum.textContent = tot
    ? `共 ${tnum(tot)} token · ${tnum((d.totals || {}).requests || 0)} 次调用` : "";
  if (!rows.length){ box.innerHTML = `<div class="kv">还没有用量记录</div>`; return; }
  const max = Math.max(...rows.map(r => r.total || 0), 1);
  box.innerHTML = rows.map(r => {
    const pct = Math.round(100 * (r.total || 0) / max);      // 条宽按最高那个会话算
    // 占比按总量算：小会话四舍五入成 0% 会被读成「没花钱」，所以 <0.1% 单独标
    const rawShare = tot ? 100 * (r.total || 0) / tot : 0;
    const share = rawShare > 0 && rawShare < 0.1 ? "<0.1"
                : (rawShare < 10 ? rawShare.toFixed(1) : String(Math.round(rawShare)));
    const label = r.chat ? prChatLabel(r.chat) : "未记录（老数据）";
    return `<div class="urow">
      <div class="utop"><b class="ulb">${esc(label)}</b>
        <span class="kv" style="margin:0;flex:none">${tnum(r.total)} token · ${tnum(r.requests)} 次调用</span></div>
      <div class="prbar"><i class="pb-c" style="width:${pct}%"></i></div>
      <div class="kv usub">占 ${share}%</div>
    </div>`;
  }).join("") + ((d.chat_kinds || 0) > rows.length
    ? `<div class="kv" style="margin-top:8px">还有 ${d.chat_kinds - rows.length} 个会话没列出（按花费只排前 8）</div>`
    : "");
}

async function botSaveModel(){
  const d = await post("/api/models", {active: {provider: $("mpProv").value, model: $("mpModel").value}});
  $("mpOut").textContent = d.ok ? "✓ 已保存：" + d.active.provider + " / " + d.active.model
                                : "✗ " + (d.error || "保存失败");
  if (d.ok){
    // 视图里的主模型快照必须跟着更新：看图/工具卡片的「跟聊天同一个」要按**新的**
    // 主 provider 列清单，否则这里还按旧 provider 校验，保存就把旧家的模型塞过去
    window.__md = Object.assign({}, window.__md || {}, {active: d.active,
      providers: d.providers || (window.__md || {}).providers, vision: d.vision,
      vision_raw: d.vision_raw, agent: d.agent, agent_raw: d.agent_raw});
    window.__provs = d.providers || window.__provs;
    // 看图卡片的候选和「当前：xx / yy」都是按主 provider 算的：主模型换了
    // 整张卡都要跟着走，否则显示的是「已关闭」而服务端其实还开着
    const visOn = !!((d.vision || {}).configured);
    const visRaw = d.vision_raw || {};
    // 未配置时 raw.model 只是残值：写进基线的话下拉会把它捡回来，一保存就
    // 把一个服务端明确说「关着」的功能悄悄打开
    window.__mvSaved = visOn ? (visRaw.model || "") : "";
    window.__vis = Object.assign({}, window.__vis || {}, {
      configured: visOn, model: visOn ? (visRaw.model || "") : "",
      provider: visOn ? (visRaw.provider || "") : ""});
    window.__mvSel = null;
    if ($("mvProv") && $("mvModel")){
      const mp = $("mvProv");
      // **先定 provider 再列模型**：botFillVisionModels 是按 provider 下拉的当前值
      // 取候选清单的，顺序反了会出现「显示 A、列的是 B 的模型」
      if (mp) mp.value = visOn ? (visRaw.provider || "") : "";
      botFillVisionModels();
      const out = $("mvOut");
      const rv = d.vision || {};
      if (out) out.textContent = rv.configured
        ? `当前：${rv.provider} / ${rv.model}`      // 用解析后的：raw 的 provider 可能为空

/* 换供应商时的选择：优先「当前下拉里合法的值」→「用户这次显式选的」→「服务端的值」。
   只记布尔「动没动」是不够的：A→B→A 绕一圈时中间会变成空，布尔会让我们误以为
   用户就是想清空，于是把钉住的模型悄悄抹掉。 */
function pickSel(now, sel, saved, ms){
  const base = String(saved || "");
  if (ms.includes(now)) return now;                       // 当前下拉合法 → 用它
  if (sel === null || sel === undefined)                  // 没动过 → 服务端的值
    return ms.includes(base) ? base : "";
  const want = String(sel);
  if (!want) return "";                                   // 用户明确要「跟聊天同一个/不启用」
  if (ms.includes(want)) return want;
  // 选了别家供应商的模型（中途切过供应商）：这个选择在这家不存在，
  // 退回服务端基线，别顺手把它清成空（保存时会把钉住的模型抹掉）
  return ms.includes(base) ? base : "";
}

  let cur = pickSel($("mvModel").value, window.__mvSel, window.__mvSaved, ms);

let pvFetched = "";          // 上一次成功拉取的 api|key_env，防重复请求
let pvPending = "";          // 卡片重渲染后要补到 pvOut 的一句话

function pvModelLines(){
  return ($("pvModels").value || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
}
function pvBox(){ return $("pvModelBox"); }

/* 拉到的清单 + 已勾选的取并集：编辑老供应商时，它原有的模型不会消失 */
function pvRender(all, sel){
  const box = pvBox();
  const keep = new Set(sel);
  const rows = [...new Set([...(all || []), ...keep])].sort((a, b) => a.localeCompare(b));
  if (!rows.length){ box.style.display = "none"; return; }
  box.innerHTML = rows.map(m => `<label title="${esc(m)}"><input type="checkbox" value="${esc(m)}"
    ${keep.has(m) ? "checked" : ""} onchange="pvSync()"> <span>${esc(m)}</span></label>`).join("");
  box.style.display = "";
  pvFitRows(box);                          // 可视高度凑成整行，别把最后一行切一半
  const n = keep.size;
  $("pvFetchOut").textContent = `拉到 ${rows.length} 个模型 · 已选 ${n} 个`;
  $("pvSearch").style.display = "";
  $("pvAll").style.display = ""; $("pvNone").style.display = "";
}
function pvFitRows(box){
  const first = box.querySelector("label");
  if (!first) return;
  const gap = parseFloat(getComputedStyle(box).rowGap) || 0;
  const rh = Math.ceil(first.getBoundingClientRect().height) + gap;
  const pad = 20;                          // .mpick 上下 padding 各 10
  const max = window.innerWidth <= 700 ? 300 : 280;
  const rows = Math.max(3, Math.floor((max - pad) / rh));
  box.style.maxHeight = (rows * rh + pad - gap) + "px";
}
window.addEventListener("resize", () => { if (pvBox()) pvFitRows(pvBox()); });

function pvSync(){
  const picked = [...pvBox().querySelectorAll("input:checked")].map(i => i.value);
  $("pvModels").value = picked.join("\n");
  const total = pvBox().querySelectorAll("input").length;
  $("pvFetchOut").textContent = `拉到 ${total} 个模型 · 已选 ${picked.length} 个`;
}

  const q = ($("pvSearch").value || "").trim().toLowerCase();
  pvBox().querySelectorAll("label").forEach(l => {

}

async function botProvFetch(quiet){
  const api = $("pvApi").value.trim();
  const ken = $("pvKeyEnv").value.trim();
  if (!/^https?:\/\//i.test(api)){
    if (!quiet) $("pvFetchOut").textContent = "先填一个 http(s) 地址";
    return false;
  }
  const sig = api + "|" + ken;
  if (quiet && sig === pvFetched) return true;
  $("pvFetchOut").textContent = "正在向 " + api + " 要模型清单…";
  let d;
  try { d = await post("/api/models/discover", {api, key_env: ken}); }
  catch (e){ $("pvFetchOut").textContent = "✗ 请求失败：" + e; return false; }
  if (!d || !d.ok){
    const msg = (d && d.error) || "拉取失败";
    // 还在敲地址/没填 key 时别吓人，成功了一次就正常报错
    $("pvFetchOut").textContent = (quiet && !pvFetched ? "…" : "✗ ") + msg.slice(0, 120);
    return false;
  }
  pvFetched = sig;
  pvRender(d.models, pvModelLines());          // pvRender 会写「拉到 N · 已选 M」
  if (!d.key_seen && ken){
    $("pvFetchOut").textContent += `（环境变量 ${ken} 没设值，只有公开接口能拉到）`;
  }
  return true;
}

/* ---- 插件按需装载：哪些角色真的装了、哪些在待命 ---- */
async function lpLoad(){
  const box = $("lpList"), meta = $("lpMeta");
  if (!box) return;
  const d = await api("/api/characters/loaded");
  if (!d || !d.ok){
    if (meta) meta.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`;
    return;
  }
  const chars = (charData && charData.items) || window.__chars || [];
  const loaded = new Set(d.loaded || []);
  const fixed = new Set(d.fixed || []);          // 全局 + 绑定了的：不能卸
  if (meta) meta.innerHTML = d.lazy
    ? `只装在用的角色：现在 <b>${loaded.size}</b> 个已加载（上限 ${d.max} 个），`
      + `另有 <b>${d.dormant}</b> 个插件在待命 —— 绑定或切到那个角色时会自动装上。`
    : `现在是<b>全部角色都装载</b>（按需装载关着），总共 ${(d.per ? Object.keys(d.per).length : 0)} 个角色、`
      + `${d.dormant === 0 ? "无" : d.dormant} 个待命。`;
  box.innerHTML = chars.map(c => {
    const on = loaded.has(c.id);
    const locked = fixed.has(c.id);
    const why = locked ? (c.id === d.global ? "当前角色" : "有会话绑着")
                       : (on ? "点一下卸载" : "用到时自动装");
    const canUnload = on && !locked && d.lazy;
    return `<span class="tag lptag ${on ? "on" : ""}" title="${esc(canUnload ? why : (d.lazy ? why : "按需装载关着，全部角色都在装"))}"
      ${canUnload ? `style="cursor:pointer" onclick="lpUnload(${jsq(c.id)})"` : ""}>
      ${esc((c.emoji || "") + " " + c.name)}${on ? " ✓" : ""}</span>`;
  }).join("");
}
async function lpUnload(cid){

}

/* ---- 导出角色包：人格 + 主题 + 专属插件 + 语料，能原样装回去 ---- */
async function exportChar(cid, btn){
  // 打包要读语料 + 压缩：过程中把按钮禁掉，连点几下会并发打多份
  const old = btn ? btn.textContent : "";
  if (btn){ btn.disabled = true; btn.textContent = "打包中…"; }
  try {
    const q = "/api/characters/export?id=" + encodeURIComponent(cid);
    let d = null;
    try { d = await api(q + "&dry=1"); } catch (e) { d = null; }
    if (!d || !d.ok){ flash("✗ " + ((d && d.error) || "导出失败")); return; }
    const r = await _blobDownload(q, cid + "-pack.zip");
    if (!r || !r.ok){ flash("✗ " + ((r && r.error) || "下载失败")); return; }
    const size = r.bytes > 1048576 ? (r.bytes / 1048576).toFixed(1) + " MB"
                                   : Math.max(1, Math.round(r.bytes / 1024)) + " KB";
    // 语料读不到时要说清原因（klee-kb 是可选的，别让人以为「角色本来就没有语料」）
    const kb = d.kb_rows ? `${d.kb_rows} 块语料`
                         : (d.kb_note ? `语料没导出（${d.kb_note}）` : "没有语料");
    flash(`✓ 已导出 ${d.name || cid}：人格 ${d.soul_chars} 字 · ${(d.plugins || []).length} 个插件 · ${kb} · ${size}`);
  } catch (e) {
    // fetch 被中断（服务重启 / 断网）时是 reject，不是返回 {ok:false} ——
    // 不接住就成未处理的 rejection：按钮恢复了，但用户什么都没看到
    flash("✗ 导出失败：" + String((e && e.message) || e));
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = old || "📤 导出角色包"; }
  }
}

        ${chars.map(c => `<option value="${esc(c.id)}" ${c.id === b.id ? "selected" : ""}>${esc((c.emoji || "") + " " + c.name)}</option>`).join("")}
      </select>

  box.innerHTML = rows || `<div class="kv">还没有固定任何会话 —— 所有群和私聊都跟着当前角色。</div>`;

async function ccSet(chat, id){
  const m = $("ccMsg");
  let d = null;
  try {
    d = await post("/api/characters/bind", {chat, id});
  } catch (e) {
    // fetch 被中断时是 reject，不是 {ok:false}：不接住就成了未处理的 rejection
    d = {ok: false, error: String((e && e.message) || e)};
  }
  if (!d || !d.ok){
    if (m) m.textContent = "✗ " + ((d && d.error) || "没保存上");
    return false;
  }
  ccRender(d);
  if (m) m.textContent = id ? "✓ 已固定（下一条消息就按它回）" : "✓ 已取消固定";
  flash(id ? "✓ 已固定" : "✓ 已取消");
  return true;
}
async function ccAdd(){
  const c = $("ccChat"), k = $("ccChar"), t = $("ccChatId");
  const manual = t ? String(t.value || "").trim() : "";
  const chat = manual || (c ? c.value : "");
  if (!chat || !k || !k.value){
    const m = $("ccMsg");
    if (m) m.textContent = "先选（或填）一个会话，再挑一个角色";
    return;
  }
  const ok = await ccSet(chat, k.value);
  if (ok && t) t.value = "";          // 失败时留着，别让人重敲一遍
}

function _cd(due, now){
  const s = Math.max(0, due - now);
  if (s < 60) return "马上";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return `${d} 天 ${h % 24} 小时`;
  if (h >= 1) return `${h} 小时 ${m % 60} 分`;
  return `${m} 分钟`;
}

  const out = document.getElementById("ruOut");
  if (!out) return;
  if (!d.hit) { out.textContent = "没有命中任何规则 → 会走模型"; return; }

    : `命中「${r.name}」→ 回「${d.reply}」`;

async function viewFeed(target){
  const T = target || "view";
  const embed = T !== "view";
  const srcs = (await api("/api/feed/sources")).sources || [];
  if (!srcs.some(s => s.value === feedSrc)) feedSrc = "";
  const d = await api(`/api/feed?limit=100&src=${encodeURIComponent(feedSrc)}`);
  const items = (d.messages || []);
  const fhash = JSON.stringify([feedSrc, srcs.map(s => s.value), items]);
  if ($("feedList") && fhash === feedHash){
    return;                                    // 20 秒一轮的自动刷新：没新消息就不重绘（不再闪）
  }
  feedHash = fhash;
  feedCache = items;
  feedShown = Math.max(30, Math.min(feedShown, items.length));
  const st = $(T).scrollTop;
  $(T).innerHTML = `
          : '<h2 class="page">📜 消息</h2>'}
  <div class="row feedbar" style="margin-bottom:10px">
    <select id="feedSel" title="按来源筛选">${(srcs.length ? srcs : [{value:"",label:"全部来源"}]).map(s=>`<option value="${esc(s.value)}" ${s.value===feedSrc?"selected":""}>${esc(s.label)}</option>`).join("")}</select>
    <button class="btn" onclick="viewFeed()">⟳ 刷新</button>
    <label class="check" style="font-size:12px"><input type="checkbox" id="feedAuto" ${feedAuto ? "checked" : ""}> 自动刷新</label>
  </div>
  <div class="feed" id="feedList">${feedListHTML(items, feedShown)}</div>`;
  $(T).scrollTop = st;
  $("feedSel").onchange = () => {
    feedSrc = $("feedSel").value;
    localStorage.setItem("ks_feed_src", feedSrc);
    viewFeed();
  };
  $("feedAuto").onchange = () => {
    feedAuto = $("feedAuto").checked;
    localStorage.setItem("ks_feed_auto", feedAuto ? "1" : "0");
    scheduleFeedRefresh();
  };
  scheduleFeedRefresh();
}

let insDays = 30, insSrc = "messages";
/* ================= 群友画像 ================= */
let ppDays = 30, ppChatSel = "";   // 选中项要跨重绘保留
/* 名字不能叫 ppChat：那个 id 的元素在 document 上有同名属性，
   内联处理器里 `ppChat(...)` 会先解析成 <select> 元素 → TypeError */
function ppPick(v){ ppChatSel = v || ""; ppLoad(); }
function ppSet(d){ ppDays = d;
  document.querySelectorAll("#ppDays button").forEach(b => b.classList.toggle("on", +b.dataset.d === d));
  ppLoad(); }
async function ppLoad(){
  const box = $("ppBox"), sel = $("ppChat");
  if (!box) return;
  // 以模块变量为准：viewBoard 重绘时 #ppChat 是空的（还没填 option），
  // 那时 sel.value 一定是 "" —— 发出去的请求就会变成「全部会话」，
  // 而下拉随后被恢复成群 X，数字和下拉对不上
  // 发请求前把参数**快照**到局部：连点「7 天 → 90 天」时两个请求同时在飞，
  // 慢的那个回来不能再读模块变量（那时已经是新值），否则会盖掉新结果
  // 不在这里做「5 秒内复用」：唯一的非强制调用方 viewBoard 每次都会先清缓存，
  // 那段分支等于永远走不到（真要去重就交给服务端 90 秒的行缓存）
  const days0 = ppDays, chat = ppChatSel || (sel ? sel.value : "");
  const d = await api("/api/people?days=" + days0 + (chat ? "&chat=" + encodeURIComponent(chat) : ""));
  // 回来先判一次「这次响应是不是已经过期」（参数又变了）：过期就连失败都不写，
  // 否则慢的那个失败响应会把已经画好的新结果刷成「读不到」
  const stale = days0 !== ppDays || chat !== ppChatSel;
  if (!d || !d.ok){
    if (stale) return;
    box.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`;
    return;
  }
  if (stale) return;           // 过期结果：连下拉都别碰（它会改写 ppChatSel）
  if (sel && !sel.options.length){
    sel.innerHTML = `<option value="">全部会话</option>` +
      (d.chats || []).map(c => `<option value="${esc(c.id)}">${esc(prChatLabel(c.id))}（${c.n}）</option>`).join("");
  }
  if (sel){
    // 重绘之后按模块变量恢复选中项：viewBoard 每 60 秒重建整页，不恢复就回到「全部会话」
    sel.value = ppChatSel;
    if (sel.value !== ppChatSel) sel.value = "";      // 那个群已经不在列表里了
    ppChatSel = sel.value;
  }
  // 选中项失效（群已滑出列表）时，上面这份数据是按失效的 id 拉的：
  // 用修正后的参数重拉一次，否则下拉说「全部会话」而数字是某个群
  if (chat !== ppChatSel) return ppLoad();
  ppRender(d);
}
function ppRender(d){
  const box = $("ppBox"), meta = $("ppMeta");
  if (!box) return;
  if (meta) meta.textContent = d.total_msgs ? `${d.total} 人 · ${d.total_msgs} 条` : "";
  if (!d.total){
    box.innerHTML = `<div class="kv">这个范围里还没有 QQ 消息。老记录没存说话人，只有新消息才有名字。</div>`;
    return;
  }
  const max = Math.max(1, ...(d.people || []).map(p => p.n));
  box.innerHTML = (d.people || []).map(p => {
    const w = Math.max(4, Math.round(p.n * 100 / max));
    const idle = p.silent_h >= 24 ? ` · ${Math.round(p.silent_h / 24)} 天没说话`
                                 : (p.silent_h >= 1 ? ` · ${p.silent_h.toFixed(0)} 小时前` : "");
    const nm = p.name || p.user_id || "—";
    const sub = (nm === "未记录" && p.chat) ? "（" + prChatLabel(p.chat) + "）" : "";
    return `<div class="pprow">
      <span class="nm" title="${esc(p.user_id || p.chat || "")}">${esc(nm)}${esc(sub)}</span>
      <span class="bar"><i style="width:${w}%"></i></span>
      <span class="ct">${p.n} 条 · 平均 ${p.avg_len} 字 · 她回了 ${p.replied} 次${idle}</span>
    </div>`;
  }).join("") + (d.total > (d.people || []).length
    ? `<div class="kv" style="margin-top:4px">……还有 ${d.total - d.people.length} 人（只显示前 ${d.people.length}）</div>` : "");
}

function insSet(days, src){
  if (days) insDays = days;
  if (src) insSrc = src;
  document.querySelectorAll("#insDays button").forEach(b =>
    b.classList.toggle("on", Number(b.dataset.d) === insDays));
  document.querySelectorAll("#insSrc button").forEach(b =>
    b.classList.toggle("on", b.dataset.s === insSrc));
  renderInsights();
}
async function renderInsights(){
  const box = $("insBox"); if (!box) return;
  const [d, cj] = await Promise.all([api(`/api/insights?days=${insDays}&src=${insSrc}`),
                                     api("/api/characters")]);
  const CNAME = {};
  ((cj && cj.items) || []).forEach(c => { CNAME[c.id] = (c.emoji ? c.emoji + " " : "") + (c.name || c.id); });
  if (!d || !d.ok){ box.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`; return; }
  const meta = $("insMeta");
  const wd = ["一", "二", "三", "四", "五", "六", "日"];
  // 热力图：7 行 × 24 列。颜色靠 class，不内联写颜色变量。
  const grid = {};
  (d.heat || []).forEach(x => { grid[x.w + "," + x.h] = x.n; });
  const mx = Math.max(1, ...(d.heat || []).map(x => x.n));
  const CW = 13, CH = 11, LEFT = 18, TOP = 10;
  let cells = "", labels = "";
  for (let h = 0; h < 24; h += 3){
    labels += `<text x="${LEFT + h * CW + 1}" y="${TOP - 3}">${h}</text>`;
  }
  for (let w = 0; w < 7; w++){
    labels += `<text x="2" y="${TOP + w * CH + 8}">${wd[w]}</text>`;
    for (let h = 0; h < 24; h++){
      const n = grid[w + "," + h] || 0;
      const lv = n === 0 ? 0 : Math.min(4, 1 + Math.floor(n / mx * 3.999));
      cells += `<rect class="${lv ? "h" + lv : ""}" x="${LEFT + h * CW}" y="${TOP + w * CH}"
        width="${CW - 1.5}" height="${CH - 1.5}"><title>周${wd[w]} ${String(h).padStart(2, "0")}:00 · ${n} 条</title></rect>`;
    }
  }
  const svg = `<svg class="ins-heat" viewBox="0 0 ${LEFT + 24 * CW + 4} ${TOP + 7 * CH + 4}"
    width="${LEFT + 24 * CW + 4}" height="${TOP + 7 * CH + 4}" role="img"
    aria-label="按星期与小时的消息分布">${labels}${cells}</svg>`;
  const bt = d.busiest || {};
  const busy = (bt.n > 0) ? `最热闹：周${wd[bt.weekday]} ${String(bt.hour).padStart(2, "0")}:00 前后（${bt.n} 条）` : "";
  const total = Number(d.total) || 0;
  const cmax = Math.max(1, ...(d.by_character || []).map(x => x.n));
  const charRows = (d.by_character || []).slice(0, 6).map(c => {
    const nm = c.id ? (CNAME[c.id] || c.id) : "未记角色";
    return `<div class="ins-bar"><span class="nm">${esc(nm)}</span>
      <span class="tr"><i style="width:${Math.round(c.n / cmax * 100)}%"></i></span>
      <span class="vv">${c.n}</span></div>`;
  }).join("");
  const chars = (d.top_chars || []).map(c =>
    `<span class="chip"><b>${esc(c.ch)}</b> ${c.n}</span>`).join("");
  const phr = (d.top_phrases || []).map(p =>
    `<span><b>${esc(p.text)}</b> ×${p.n}</span>`).join("");
  if (meta) meta.textContent = `${total} 条 · 平均每句 ${d.avg_user_len || 0} 字`;
  box.innerHTML = `
    ${total ? svg : '<div class="kv">这段时间还没有消息</div>'}
    ${busy ? `<div class="kv" style="margin-top:2px">${esc(busy)}</div>` : ""}
    <div class="ins-bars">${charRows}</div>
    ${chars ? `<div class="kv" style="margin-top:10px">常用字</div><div class="ins-chips">${chars}</div>` : ""}
    ${phr ? `<div class="kv" style="margin-top:10px">高频短句</div><div class="ins-phr">${phr}</div>` : ""}`;
}

async function loadIndexInfo(){
  const el = $("qIdx"); if (!el) return;
  const d = await api("/api/search/stats?days=14");
  if (!d || !d.ok){ el.textContent = ""; return; }
  const h = d.health || {};
  const days = (d.by_day || []).length;
  const from = d.from ? new Date(Number(d.from) * 1000).toLocaleDateString("zh-CN", {month:"2-digit", day:"2-digit"}) : "—";
  el.textContent = `索引 ${h.rows || 0} 条 · ${h.error ? "⚠ " + h.error : "正常"} · 最早 ${from} · 覆盖 ${days} 天`;
}

async function doSearch(){
  const box = $("qOut"), meta = $("qMeta"), inp = $("qInput");
  if (!box || !inp) return;
  const q = inp.value.trim();
  if (!q){ box.textContent = "先输入要搜的词"; return; }
  meta.textContent = "搜索中…";
  const d = await api("/api/search?q=" + encodeURIComponent(q) + "&limit=30");
  if (!d || !d.ok){
    meta.textContent = "";
    box.innerHTML = `<span style="color:var(--red)">${esc((d && d.error) || "搜索失败")}</span>`;
    return;
  }
  meta.textContent = ` ${d.count} 条 · ${d.took_ms} ms · 索引 ${(d.index && d.index.rows) || 0} 条`;
  if (!d.hits.length){ box.innerHTML = "没搜到。"; return; }
  box.innerHTML = d.hits.map(h => {
    const t = new Date(Number(h.ts) * 1000).toLocaleString("zh-CN",
      {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
    const who = h.role === "user" ? "👤" : "🤖";
    const sn = esc(h.snippet || h.text || "").replace(/&lt;&lt;/g, "<mark>").replace(/&gt;&gt;/g, "</mark>");
    return `<div class="qhit"><span class="qt">${esc(t)}</span>
      <span class="qw">${who}</span><span class="qs">${sn}</span></div>`;
  }).join("");
}

      <a class="wl" href="javascript:go('ops')">去处理 →</a></div>`,
  };
  // 窄屏是两列：带图的角色卡如果夹在中间，会把前一张卡挤成孤零零的半行。
  // 把它挪到末尾，前面的卡就能两两配平。
  const order = mods.slice();
  if (window.matchMedia && window.matchMedia("(max-width:760px)").matches) {
    const i = order.indexOf("char");
    if (i >= 0 && i !== order.length - 1) { order.splice(i, 1); order.push("char"); }
  }
  const items = order.map(m => {
    if (String(m).startsWith("!")) return null;
    const fn = cards[String(m)];
    return fn ? { key: String(m), html: fn() } : null;
  }).filter(Boolean);
  // 两列排到最后如果只剩一张普通卡，右边会空半行 —— 让它横过来占满
  const narrow = window.matchMedia && window.matchMedia("(max-width:760px)").matches;
  if (narrow) {
    const tiles = items.filter(x => x.key !== "char");
    if (tiles.length % 2 === 1) {
      const last = tiles[tiles.length - 1];
      last.html = last.html.replace('class="wcard"', 'class="wcard wfull"');
    }
  }
  const html = items.map(x => x.html).join("");
  return html ? `<div class="wgrid">${html}</div>` : "";
}

const LANG_ICON2 = {python:"🐍", go:"🐹", rust:"🦀", c:"🔵", cpp:"🔷",
                    node:"🟩", java:"☕", php:"🐘", csharp:"🟪", sql:"🗄"};
// 版本串前面补一个能看懂的前缀：`10.0.112` 单看不知道是哪门子的版本号
function prefixVer(lang, v){
  const s = String(v || "").trim();
  if (!s) return "";
  const pick = (re) => { const m = s.match(re); return m ? m[1] : s; };
  switch (lang) {
    case "csharp": return ".NET " + s;
    case "go": return "go " + pick(/go(\d[\w.]*)/);
    case "rust": return "rustc " + pick(/rustc\s+([\w.]+)/);
    case "c": return "gcc " + pick(/\)\s+([\d.]+)/);
    case "cpp": return "g++ " + pick(/\)\s+([\d.]+)/);
    case "java": return "JDK " + pick(/([\d.]+)/);
    case "php": return "PHP " + pick(/(\d+\.\d+\.\d+)/);
    case "node": return "node " + s.replace(/^v/, "");
    case "python": return s.replace(/^Python /, "Python ");
    default: return s;
  }
}

/* 平台的「未就绪」原始报错一般是 OneBotError: ... 一长串，运维页只说人话 */
function readyText(note){
  const s = String(note || "").trim();
  if (!s) return "";
  if (/OneBotError|URLError|Connection refused|timed out|HTTP 50\d/i.test(s))
    return "协议端没连上（没登录或没启动）";
  if (/token|401|403/i.test(s)) return "凭据没配好";
  return s.length > 44 ? s.slice(0, 44) + "…" : s;
}

function prBars(blocks){
  const tot = blocks.reduce((a, b) => a + (b.chars || 0), 0) || 1;
  return `<div class="prbar">` + blocks.map(b => {
    const w = Math.max(1, Math.round((b.chars || 0) * 100 / tot));
    return `<i class="pb-${PBHUE[b.key] || "i"}" style="width:${w}%" title="${esc(b.label)} ${b.chars} 字"></i>`;
  }).join("") + `</div>`;
}
function prRows(blocks){
  const rows = []; let h = null;
  for (const b of blocks){
    if (b.key === "hist"){
      if (!h){ h = {label:"历史对话", chars:0, n:0, texts:[]}; rows.push(h); }
      h.chars += b.chars || 0; h.n++; h.texts.push(b.text); continue;
    }
    h = null; rows.push({label:b.label, chars:b.chars, n:0, texts:[b.text], role:b.role, key:b.key});
  }
  return rows.map(r => `<details class="prrow"><summary>
      <span class="lb">${esc(r.label)}</span>
      ${r.n ? `<span class="ct">${r.n} 条</span>` : `<span class="ct">${esc(r.role || "")}</span>`}
      <span class="ct">${r.chars} 字</span>
    </summary>${r.texts.map(t => `<pre class="pretxt">${esc(t)}</pre>`).join("")}</details>`).join("");
}

async function prDry(btn){
  btn = btn || {style: {}};          // 键盘/脚本调用时不带按钮
  const text = (($("prText") || {}).value || "").trim();
  if (!text){ flash("先写一句要试的话"); return; }
  btn.disabled = true;
  const d = await post("/api/prompt/preview", {
    text, chat_id: prChat, is_group: ($("prWhere") || {}).value === "group",
    as_owner: !!($("prOwner") || {}).checked, kb: !!($("prKb") || {}).checked});
  btn.disabled = false;
  const out = $("prOut");
  if (!out) return;
  if (!d || !d.ok){
    out.innerHTML = `<span class="bad">试跑失败：${esc((d && d.error) || "未知")}</span>`;
    return;
  }
  const diff = !d.has_base ? `<span class="kv" style="margin:0">（这个会话还没有真实请求可比，下面是完整结果）</span>`
    : ((d.diff || []).map(x => {
        const sign = x.delta > 0 ? "+" : "";
        const cls = x.kind === "removed" ? "bad" : "";
        return `<span class="tag ${cls}">${esc(x.label)} ${sign}${x.delta} 字</span>`;
      }).join("") || `<span class="tag">和最近一次一样</span>`);
  out.innerHTML = `<div class="row" style="gap:4px;flex-wrap:wrap;margin:8px 0">
      <span class="kv" style="margin:0">共 ${d.messages} 条 / ${d.chars} 字 / 约 ${d.tokens} token</span>${diff}</div>`
    + prBars(d.blocks || []) + prRows(d.blocks || [])
    + `<details><summary class="kv">真实请求体（点开看原文）</summary>
         <pre class="pretxt">${esc(JSON.stringify(d.msgs || [], null, 1))}</pre></details>`
    + (d.kb_error ? `<div class="kv bad">知识库检索失败：${esc(d.kb_error)}</div>` : "");
}

async function pvTest(chat, btn){
  btn = btn || {style: {}};
  if (!confirm("现在真的发一条到 " + chat + " ？")) return;
  btn.disabled = true; btn.textContent = "生成中…";
  const d = await post("/api/proactive/test", {chat_id: chat});
  btn.disabled = false; btn.textContent = "现在发一条";
  if (!d || !d.ok) flash("发不出去：" + ((d && d.error) || "未知"));
  else if (d.unknown) flash("结果未知：" + (d.error || "") + "（已占名额，别马上再点）");
  else flash("已发送：" + (d.text || ""));

async function pvTick(btn){
  btn = btn || {style: {}};
  btn.disabled = true; btn.textContent = "巡检中…";
  const d = await post("/api/proactive/tick", {});
  btn.disabled = false; btn.textContent = "现在巡检一次";
  if (!d || !d.ok){ flash("巡检失败：" + ((d && d.error) || "未知")); return; }

  flash(acts.length ? acts.map(a => !a.send ? a.reason
      : (a.skipped ? "跳过：" + (a.reason || "")
         : a.unknown ? "结果未知：" + (a.error || "")
         : a.ok === false ? "失败：" + (a.error || "未知") : "发了")).join("；")
    : "没有开着的会话");
  pvLoad(true);
}

let ctlData = null, ctlFilter = "all", ctlQuery = "";
function ctlNormChat(raw, isGroup){
  // 裸数字按「场景」决定是群号还是 QQ 号 —— QQ 号也是 5~11 位，
  // 一律当群号会让「私聊 + 填 QQ」变成 group:<qq>（策略按 A 查、判定按 B 走）。
  // 已经带前缀的原样用；但调用方要用 ctlChatKind 把场景一起校准。
  const s = String(raw || "").trim();
  if (!s) return "";
  if (/^(group|private):/.test(s)) return s;
  return (isGroup ? "group:" : "private:") + s;
}
function ctlChatKind(raw, isGroup){
  // 显式前缀优先：粘了 `group:123` 却还选着「私聊」会让 chat_id 与 is_group 打架
  const s = String(raw || "").trim();
  if (s.startsWith("group:")) return true;
  if (s.startsWith("private:")) return false;
  return !!isGroup;
}
function chatLabel(id){
  const s = String(id || "");
  if (s.startsWith("group:")) return "群 " + (s.slice(6) || "（临时）");
  if (s.startsWith("private:")) return "私聊 " + (s.slice(8) || "（临时）");
  return s || "（临时会话）";
}

async function ctlLoad(){
  const d = await api("/api/control");
  if (!d || !d.ok){
    const box = $("ctlCmds");
    if (box) box.innerHTML = `<span class="bad">读不到：${esc((d && d.error) || "未知")}</span>`;
    return;
  }
  ctlData = d;
  const g = $("ctlGlobal");
  if (g) g.textContent = (d.modes || {})[d.global_mode] || d.global_mode;
  ctlRenderCmds();
  ctlRenderChats();
}
function ctlSetFilter(f){ ctlFilter = f;
  document.querySelectorAll("#ctlFilter button").forEach(b => b.classList.toggle("on", b.dataset.f === f));
  ctlRenderCmds(); }
function ctlRenderCmds(){
  const box = $("ctlCmds"), meta = $("ctlCmdMeta");
  if (!box || !ctlData) return;
  const q = ctlQuery.trim().toLowerCase();
  let rows = ctlData.commands || [];
  if (ctlFilter === "over") rows = rows.filter(r => r.override);
  if (ctlFilter === "group") rows = rows.filter(r => (r.scope_eff || "all") !== "all"
                                              && (r.scope_eff || "both") !== "both");
  if (q) rows = rows.filter(r => (r.name + " " + r.plugin + " " + (r.help || ""))
                                  .toLowerCase().includes(q));
  if (meta) meta.textContent = `· ${ctlData.counts.commands} 条`
    + (ctlData.counts.overridden ? `，${ctlData.counts.overridden} 条被改过` : "");
  if (!rows.length){ box.innerHTML = '<div class="kv">没有匹配的命令</div>'; return; }
  const perms = ctlData.perms || {}, scopes = ctlData.scopes || {};
  const opt = (map, cur) => Object.keys(map).map(k =>
    `<option value="${esc(k)}"${k === cur ? " selected" : ""}>${esc(map[k])}</option>`).join("");
  // 只渲染前 400 条（115 条命令 × 每行 2 个 select，全量渲染在手机上会卡）
  box.innerHTML = rows.slice(0, 400).map(r => `<div class="ctl-cmd ${r.override ? "ctl-ov" : ""}"
      data-plugin="${esc(r.plugin || "")}" title="${esc(r.help || "")}">
      <code>.${esc(r.name)}</code>
      <span class="pl">${esc(r.title || r.plugin || "")}</span>
      <span class="h">${esc((r.help || "").replace(/^\.[^\s]+\s*/, "").slice(0, 40))}</span>
      <select data-k="scope" onchange="ctlSetCmd(${jsq(r.name)}, 'scope', ${jsq(r.plugin || "")})">
        ${opt(scopes, r.scope_eff || "both")}</select>
      <select data-k="permission" onchange="ctlSetCmd(${jsq(r.name)}, 'permission', ${jsq(r.plugin || "")})">
        ${opt(perms, r.permission_eff || "all")}</select>
      ${r.override ? `<button class="btn tiny" onclick="ctlResetCmd(${jsq(r.name)}, ${jsq(r.plugin || "")})">默认</button>`
                   : '<span class="kv" style="flex:none;min-width:44px"></span>'}
    </div>`).join("");
}
function ctlFindRow(name, plugin){
  // 同名命令可能有两条（通用 + 角色专属）：只按 code 文本找会拿错行，
  // 提交出去的就是「第一行的值 + 第二行的插件名」
  return [...document.querySelectorAll("#ctlCmds .ctl-cmd")]
    .find(x => (x.querySelector("code") || {}).textContent === "." + name
            && (x.dataset.plugin || "") === (plugin || ""));
}
async function ctlSetCmd(name, field, plugin){
  // 只提交被改动的那一项：服务端是**按字段合并**的，两个字段一起发会把
  // 「没动的那一项」从「跟随插件默认」变成一条显式覆盖 —— 以后插件默认值
  // 放宽或收紧都不再生效（那正是这个设计要避免的静默覆盖）。
  const row = ctlFindRow(name, plugin);
  if (!row){ flash("找不到这一行"); return; }
  const sel = row.querySelector(`[data-k="${field}"]`);
  if (!sel) return;
  // 带上插件名：同名命令（通用 + 角色专属）只改这一行，不连带另一行
  const body = {command: name};
  if (plugin) body.plugin = plugin;
  body[field] = sel.value;
  const d = await post("/api/control/cmd", body);
  if (!d || !d.ok){ flash("没保存：" + ((d && d.error) || "未知")); return; }
  ctlData = d.after;
  ctlRenderCmds();
  flash("已生效：" + name);
}
async function ctlResetCmd(name, plugin){
  // 显式给空串才是「清掉这两项」（不给 = 不动，服务端分得很清楚）
  const body = {command: name, scope: "", permission: ""};
  if (plugin) body.plugin = plugin;
  const d = await post("/api/control/cmd", body);
  if (!d || !d.ok){ flash("没恢复：" + ((d && d.error) || "未知")); return; }
  ctlData = d.after; ctlRenderCmds(); flash("已回到插件默认：" + name);
}
let ctlExtra = [];          // 刚「加」进来、还没设任何项的会话（只在页面上挂着）
let ctlHidden = [];         // 从「最近聊过的会话」里暂时藏起来的（不动数据）
function ctlChatMetaText(){
  const n = Object.keys((ctlData && ctlData.chats) || {}).length;
  return n ? `· 设了 ${n} 个` : "· 都跟随全局";
}
function ctlRenderChats(){
  const box = $("ctlChats"), meta = $("ctlChatMeta");
  if (!box || !ctlData) return;
  const saved = ctlData.chats || {};
  const known = ctlData.known_chats || [];
  const modes = ctlData.modes || {};
  const ids = Object.keys(saved);
  // 设过的排前面，然后是新加的，最后补上「最近聊过的」（方便直接挑）
  ctlExtra.forEach(id => { if (!ids.includes(id)) ids.push(id); });
  known.forEach(k => {
    if (ids.includes(k.id) || ctlHidden.includes(k.id)) return;
    ids.push(k.id);
  });
  if (meta) meta.textContent = ctlChatMetaText();
  const opt = (cur) => Object.keys(modes).map(k =>
    `<option value="${esc(k)}"${k === (cur || "inherit") ? " selected" : ""}>${esc(modes[k])}</option>`).join("");
  if (!ids.length){
    box.innerHTML = '<div class="kv">还没有设过。上面输入群号加一个，或用模拟器先看看效果。</div>';
    return;
  }
  box.innerHTML = ids.slice(0, 30).map(id => {
    const r = saved[id] || {};
    const q = Array.isArray(r.quiet) ? r.quiet : ["", ""];
    return `<div class="ctl-cmd" data-chat="${esc(id)}">
      <code style="min-width:118px">${esc(chatLabel(id))}</code>
      <select data-k="mode" onchange="ctlSaveChat(${jsq(id)})">${opt(r.mode)}</select>
      <input data-k="q1" value="${esc(q[0] || "")}" placeholder="23:30" style="width:66px"
             title="静默开始（留空 = 没静默）" onchange="ctlSaveChat(${jsq(id)})">
      <span class="kv" style="flex:none">~</span>
      <input data-k="q2" value="${esc(q[1] || "")}" placeholder="07:00" style="width:66px"
             onchange="ctlSaveChat(${jsq(id)})">
      <label class="check" style="font-size:12px"><input type="checkbox" data-k="qm"
        ${r.quiet_mention ? "checked" : ""} onchange="ctlSaveChat(${jsq(id)})"> 静默时 @ 也回</label>
      <input data-k="note" value="${esc(r.note || "")}" placeholder="备注" style="width:90px"
             onchange="ctlSaveChat(${jsq(id)})">
      ${Object.keys(saved).includes(id)
        ? `<button class="btn tiny" data-act="del" onclick="ctlClearChat(${jsq(id)})">删</button>`
        : `<button class="btn tiny" data-act="drop" onclick="ctlForget(${jsq(id)})">移除</button>`}
    </div>`;
  }).join("");
}
async function ctlSaveChat(id){
  const row = document.querySelector(`[data-chat="${CSS.escape(id)}"]`);
  if (!row) return;
  const get = k => (row.querySelector(`[data-k="${k}"]`) || {}).value || "";
  const body = {chat_id: id, mode: get("mode"), note: get("note")};
  const q1 = get("q1").trim(), q2 = get("q2").trim();
  body.quiet = (q1 && q2) ? [q1, q2] : [];
  const qm = row.querySelector('[data-k="qm"]');
  body.quiet_mention = !!(qm && qm.checked);
  const d = await post("/api/control/chat", body);
  if (!d || !d.ok){ flash("没保存：" + ((d && d.error) || "未知")); return; }
  ctlData = d.after;
  // 不整表重渲染：用户改完「静默开始」按 Tab 进「静默结束」时，change 先触发，
  // 请求回来后把正在输入的框整个换掉会丢焦点、吞字符。只刷新 meta 与这一行的
  // 删除按钮。
  const meta = $("ctlChatMeta");
  if (meta) meta.textContent = ctlChatMetaText();
  const keep = Object.keys(ctlData.chats || {}).includes(id);
  const rowEl = document.querySelector(`[data-chat="${CSS.escape(id)}"]`);
  if (rowEl){
    const old = rowEl.querySelector("button[data-act]");
    const btn = document.createElement("button");
    btn.className = "btn tiny";
    btn.dataset.act = keep ? "del" : "drop";
    btn.textContent = keep ? "删" : "移除";
    btn.onclick = keep ? () => ctlClearChat(id) : () => ctlForget(id);
    // 替换而不是追加：刚「加」进来的行第一次保存后会变成「移除 + 删」两个按钮
    if (old) old.replaceWith(btn); else rowEl.appendChild(btn);
  }
  // 全默认的条目会被服务端规范化掉 —— 这时的「已保存」会误导人
  flash(keep ? ("已保存：" + chatLabel(id))
             : ("这一行没设任何项，已恢复成跟随全局：" + chatLabel(id)));
}
async function ctlClearChat(id){
  const d = await post("/api/control/chat", {chat_id: id, mode: "inherit", quiet: [],
                                             quiet_mention: false, note: ""});
  if (!d || !d.ok){ flash("没删掉：" + ((d && d.error) || "未知")); return; }
  ctlData = d.after; ctlRenderChats(); flash("已恢复成跟随全局");
}
function ctlForget(id){
  // 两种行：真「加」进来的（从 ctlExtra 里去掉就行）和从「最近聊过」里列出来的
  // （数据还在别处，只能记进「暂时隐藏」—— 否则重渲染又原样画回来，按钮像是坏的）。
  ctlExtra = ctlExtra.filter(x => x !== id);
  if (!ctlHidden.includes(id)) ctlHidden.push(id);
  ctlRenderChats();
}
async function ctlAddChat(){
  const el = $("ctlNewChat");
  const raw = (el && el.value || "").trim();
  if (!raw){ flash("先填群号或 private:QQ号"); return; }
  // 加会话这一行没有「群聊/私聊」下拉：5 位以上当群号（群里最常用），
  // 其余当 QQ 号；已经带前缀的原样用。
  const id = /^(group|private):/.test(raw) ? raw
    : (/^\d{5,}$/.test(raw) ? "group:" + raw : "private:" + raw);
  if (id === "group:" || id === "private:"){ flash("群号/QQ号没填"); return; }
  // 只在页面上挂一行：默认值不落盘（「全默认 = 等于没设」），
  // 用户真改了某一项再写进去。以前这里直接提交一个全默认的条目，
  // 被规范化丢掉，看起来像「加了但没出现」。
  if (!ctlExtra.includes(id)) ctlExtra.unshift(id);
  if (el) el.value = "";
  ctlRenderChats();
  flash("加上了一行：" + chatLabel(id) + "，改哪项就存哪项");
}
async function ctlSim(){
  const out = $("simOut"), text = ($("simText") || {}).value || "";
  if (!text.trim()){ flash("先打一句要试的话"); return; }
  const where = ($("simWhere") || {}).value || "dm";
  const role = ($("simRole") || {}).value || "member";
  // 显式写了 `group:` / `private:` 时以它为准，并同步下拉框，避免两套身份
  const isGroup = ctlChatKind(($("simChat") || {}).value || "", where === "group");
  if (isGroup !== (where === "group") && $("simWhere")) $("simWhere").value = isGroup ? "group" : "dm";
  // 「主人自己」要真的用配置里的主人 QQ —— 拿别的号去试，权限判定会完全不一样
  const owner = String((ctlData && ctlData.owner_id) || "");
  const body = {text, is_group: isGroup, mentioned: !!($("simAt") || {}).checked,
                role: role === "me" ? (isGroup ? "owner" : "member") : role,
                user_id: role === "me" ? (owner || "10001") : "10001",
                user_name: role === "me" ? "主人" : "访客",
                chat_id: ctlNormChat(($("simChat") || {}).value || "", isGroup)};
  if (out) out.innerHTML = '<div class="kv" style="margin-top:8px">判定中…</div>';
  const d = await post("/api/simulate", body);
  if (!out) return;
  if (!d || !d.ok){ out.innerHTML = `<div class="kv" style="color:var(--red);margin-top:8px">✗ ${esc((d && d.error) || "失败")}</div>`; return; }
  const badge = {pass: "通过", block: "拦下", skip: "未模拟", info: "说明"};
  const color = {ignore: "var(--dim)", command: "var(--green)", rule_reply: "var(--green)",
                 model: "var(--ui-accent)"};
  const verdict = {
    ignore: "不会回复",
    command: "会执行命令" + (d.command ? " ." + d.command : ""),
    rule_reply: "会直接回一句",
    model: "会交给模型"
  }[d.action] || d.action;
  out.innerHTML = `<div class="ctl-steps">${(d.steps || []).map(st => `
      <div class="ctl-step ${esc(st.state)}">
        <span class="badge">${esc(badge[st.state] || st.state)}</span>
        <span class="lb">${esc(st.label)}</span>
        <span class="dt">${esc(st.detail)}</span>
      </div>`).join("")}</div>
    <div class="ctl-verdict">
      <b style="color:${color[d.action] || "inherit"}">${esc(verdict)}</b>
      ${esc(d.reason || "")}
      ${d.reply ? `<div class="kv" style="margin-top:4px">会回：${esc(d.reply)}</div>` : ""}
      <div class="kv" style="margin-top:4px">会话 ${esc(chatLabel(d.chat_id))}</div>
    </div>`;
}

function cfgRow(field, vals){
  const v = vals[field.k];
  const val = v === null || v === undefined ? "" : String(v);
  let ctl;
  if (field.bool){
    ctl = `<select id="cfg_${field.k}"><option value="true" ${val === "true" ? "selected" : ""}>开</option><option value="false" ${val !== "true" ? "selected" : ""}>关</option></select>`;
  } else if (field.opts){
    ctl = `<select id="cfg_${field.k}">${field.opts.map(o => {
      const v = typeof o === "string" ? o : o.v;
      const t = typeof o === "string" ? o : o.t;
      return `<option value="${esc(v)}" ${v === val ? "selected" : ""}>${esc(t)}</option>`;
    }).join("")}</select>`;
  } else if (field.secret) {
    ctl = `<div class="row" style="gap:6px;flex-wrap:nowrap">
      <input type="password" id="cfg_${field.k}" value="${esc(val)}" placeholder="${esc(field.ph || "")}" style="flex:1">
      <button type="button" class="btn tiny" style="flex:none" onclick="cfgPeek('${field.k}', this)">显示</button>
    </div>`;
  } else {
    ctl = `<input type="text" id="cfg_${field.k}" value="${esc(val)}" placeholder="${esc(field.ph || "")}">`;
  }
  return `<div class="cfgrow"><label>${esc(field.label)}${field.hint ? ` <span class="hint">${esc(field.hint)}</span>` : ""}</label>${ctl}</div>`;
}

async function opsSaveCfg(){
  const updates = {};
  for (const f of CFG_FIELDS){
    const el = $("cfg_" + f.k); if (!el) continue;
    const nv = el.value;
    const ov = opsCfgPrev[f.k];
    const ovs = ov === null || ov === undefined ? "" : String(ov);
    if (nv !== ovs) updates[f.k] = nv;      // 只提交改过的字段，没碰的不动
  }
  if (!Object.keys(updates).length){ $("cfgMsg").textContent = "没有改动"; return; }
  $("cfgMsg").textContent = "保存中…";
  const r = await post("/api/config", {updates});
  const res = r.results || {};
  const bad = Object.entries(res).filter(([, s]) => s !== "ok");
  if (!bad.length){ for (const [k, v] of Object.entries(updates)) opsCfgPrev[k] = v; }
  $("cfgMsg").innerHTML = bad.length
    ? `✗ ${bad.map(([k, s]) => esc(k) + "：" + esc(String(s).slice(0, 80))).join("；")}`
    : `✓ 已写入 ${Object.keys(res).length} 项——已生效`;
}

async function opsLogs(manual){
  const box = $("logBox"); if (!box) return;
  const grepEl = $("logGrep"), nEl = $("logN");
  const d = await api(`/api/logs?n=${nEl ? encodeURIComponent(nEl.value) : "200"}&grep=${encodeURIComponent(grepEl ? grepEl.value : "")}`);
  const head = (d && d.enabled === false)
    ? "（运行日志已关闭 · 常用配置里可重新打开）\n"
    : "";
  const lines = (d && d.lines) || [];
  const lhtml = head + lines.map(l => {
    const cls = l.includes(" ERROR ") ? " class=\"le\"" : l.includes(" WARNING ") ? " class=\"lw\"" : "";
    return `<span${cls}>${esc(l)}</span>`;
  }).join("\n") + `\n\n<span style="color:#c9b8a4">— ${lines.length} 行 —</span>`;
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  if (lhtml !== logHash){                      // 内容没变不重绘；变了的重绘保留滚动，不硬拽到底
    logHash = lhtml;
    box.innerHTML = lhtml;
  }
  if (manual || !logInited || stick) box.scrollTop = box.scrollHeight;
  logInited = true;
}

async function opsAct(action){
  if (action === "restart_gateway" && !confirm("重载插件？（不影响 QQ）")) return;
  if (action === "restart_napcat" && !confirm("确定重启 NapCat？（会尝试快速登录，人在的话最稳）")) return;
  const r = await post("/api/action", {action});
  alert(r.msg || (r.ok ? "已执行" : r.error) || "done");
}

/* ================= 可见性 / 快捷键 ================= */
let hiddenAt = 0;
function pauseTimers(){
  clearInterval(stripTimer); stripTimer = null;
  if (chat.timer){ clearTimeout(chat.timer); chat.timer = null; }
  if (chat.tick){ clearInterval(chat.tick); chat.tick = null; }
  if (feedTimer){ clearInterval(feedTimer); feedTimer = null; }
  if (boardTimer){ clearInterval(boardTimer); boardTimer = null; }
  try{ stopOpsTimers(); }catch(e){}
}
function resumeTimers(){
  if (!stripTimer) stripTimer = setInterval(strip, 15000);
  strip();
  if (V === "chat" && !chat.timer){
    chat.idle = 0;
    armChatPoll();
    chat.tick = setInterval(tickTyping, 1000);
    pollChat();
  }
  if (Date.now() - hiddenAt < 30000) return;   // 短暂切走不重绘
  if (V === "board") viewBoard();
  else if (V === "feed") viewFeed();
  else if (V === "ops") viewOps();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ hiddenAt = Date.now(); pauseTimers(); }
  else resumeTimers();
});
document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); cmdkOpen(); return; }
  if (e.key === "Escape"){
    cmdkClose(); closePluginDrawer(); navClose();
    return;
  }
  if (typing) return;
  if (e.key === "/"){ e.preventDefault(); cmdkOpen(); return; }
  if (e.altKey && /^[1-8]$/.test(e.key)){
    e.preventDefault();
    const v = PAGES[Number(e.key) - 1]; if (v) go(v[0]);
  }
});

/* ================= 启动 ================= */
async function boot(){
  try {
    const d = await api("/api/characters");
    if (d && d.ok){
      charData = d;
      const c = (d.items || []).find(x => x.id === d.active) || (d.items || [])[0];
      if (c) setActiveChar(c);
      loadUI(d.active);                                   // 不阻塞首屏
    }
  } catch(e){}
  // PWA 快捷方式（manifest.shortcuts）带 ?v=<页面>
  const want = new URLSearchParams(location.search).get("v");
  if (want && PAGES.some(p => p[0] === want)){
    V = want;
    history.replaceState(null, "", "/");
  }
  render();
}
let stripTimer = setInterval(strip, 15000);
strip();
boot();
