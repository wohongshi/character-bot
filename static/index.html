<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="themeColor" content="#ffefdd">
<title>Character Bot</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/img/favicon-192.png">
<link rel="apple-touch-icon" href="/static/img/favicon-180.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Character Bot">
<link rel="preload" href="/static/fonts/ZCOOLKuaiLe-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script>
(function(){
  try{
    var s = localStorage.getItem("ks_theme");
    var d = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = (s === "light" || s === "dark") ? s : (d ? "dark" : "light");
  }catch(e){ document.documentElement.dataset.theme = "light"; }
})();
</script>
<style>
/* ============ 字体 ============ */
@font-face{
  font-family:"ZCOOL KuaiLe";
  src:url("/static/fonts/ZCOOLKuaiLe-Regular.ttf") format("truetype");
  font-display:swap;
}
/* ============ 主题 ============ */
:root{
  --bg:#fff3e2; --paper:#fffdf6; --ink:#4a342a; --dim:#94745a; --line:#f2dcc4;
  --red:#e8484f; --red-deep:#c93a45; --red-soft:#ffe9e6;
  --gold:#f2b23e; --gold-soft:#fff3d6;
  --sky:#6fb9e4; --sky-soft:#e8f5fc;
  --green:#7aab5e; --green-soft:#eef7e8;
  --shadow:0 4px 14px rgba(190,120,80,.14);
  --font-cute:"ZCOOL KuaiLe","PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --font-body:-apple-system,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light dark}
html,body{height:100%}
body{
  color:var(--ink);font:14px/1.65 var(--font-body);background:var(--bg);
  background-image:
    radial-gradient(circle at 10% 6%, rgba(255,186,164,.24), transparent 42%),
    radial-gradient(circle at 90% 3%, rgba(148,208,240,.20), transparent 40%),
    radial-gradient(#f8e6d1 1.2px, transparent 1.2px);
  background-size:auto, auto, 26px 26px;
  background-attachment:fixed;
}
/* 角色配色由主题插件下发（/api/theme.css），这里不再写死 */
.charava{flex:none;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  font-size:22px;color:#fff;box-shadow:0 4px 10px rgba(120,80,60,.22);line-height:1}
.charava.sm{width:38px;height:38px;border-radius:13px;font-size:18px}
.brand .charava{width:42px;height:42px;border-radius:14px;font-size:21px}
.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:12px}
.charitem{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px;
  cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.charitem:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.charitem.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.charitem.active{background:linear-gradient(180deg,var(--paper),var(--red-soft))}
.charitem .nm{font-family:var(--font-cute);font-size:17px;margin-top:8px}
.charitem .en{font-size:11px;color:var(--dim);letter-spacing:.5px}
.charitem .tagline{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5;min-height:34px}
.charitem .meta2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--dim)}
.charbadge{position:absolute;top:12px;right:12px;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--red);color:#fff;font-family:var(--font-cute)}
.charbadge.off{background:#e9dccd;color:#8a6f58}
.swatches{display:flex;gap:4px;align-items:center}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.08)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.themecard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.themecard .nm{font-family:var(--font-cute);font-size:14px}
.docbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 20px;
  font-size:13.5px;line-height:1.8;max-height:70vh;overflow:auto}
.docbox h1{font-family:var(--font-cute);font-size:20px;color:var(--red-deep);margin:6px 0 10px}
.docbox h2{font-family:var(--font-cute);font-size:16px;color:var(--red-deep);margin:18px 0 6px;
  padding-bottom:4px;border-bottom:1px dashed var(--line)}
.docbox h3{font-size:14px;margin:14px 0 4px}
.docbox p{margin:6px 0;color:var(--ink)}
.docbox ul{margin:6px 0 6px 20px}
.docbox li{margin:2px 0}
.docbox code{background:var(--red-soft);padding:1px 5px;border-radius:5px;font-size:12px}
.docbox pre{background:#2e2721;color:#f4e8d8;border-radius:10px;padding:10px 12px;overflow:auto;
  font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
.docbox pre code{background:none;padding:0;color:inherit;font-size:12px}
.docbox table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px}
.docbox th,.docbox td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.docbox th{background:var(--red-soft);color:var(--red-deep);font-weight:600}
.docbox tr:nth-child(even) td{background:rgba(0,0,0,.015)}
.charsoul{width:100%;min-height:320px;font:13px/1.7 var(--font-body);border:2px solid var(--line);
  border-radius:14px;padding:12px;background:var(--surface-2)}
/* 右下角暖光 */
body::after{
  content:"";position:fixed;right:-140px;bottom:-160px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,204,176,.55) 0%, rgba(255,204,176,0) 68%);
  pointer-events:none;z-index:0;
}
::selection{background:#ffd6cf;color:var(--red-deep)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#f0cdb0;border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#e7b28c;background-clip:content-box}
#app{display:flex;height:100vh;max-width:1200px;margin:0 auto;position:relative;z-index:1}
/* ============ 侧边栏 ============ */
aside{width:214px;flex:none;background:linear-gradient(180deg,#fffaf0,#ffeede);
  border-right:2px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 10px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;border-bottom:2px dashed #f3ddc2;margin-bottom:10px}
.brand img{width:52px;height:52px;border-radius:50%;border:3px solid var(--surface-2);background:var(--surface-2);
  box-shadow:var(--shadow);transition:transform .2s}
.brand:hover img{transform:translateY(-3px) rotate(-5deg)}
.bt{font-family:var(--font-cute);font-size:19px;color:var(--red);letter-spacing:1px;line-height:1.2}
.bs{font-size:9.5px;color:var(--dim);letter-spacing:2.5px;margin-top:2px}
.navgroup{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.navlabel{font-size:9.5px;letter-spacing:1.6px;color:var(--ink-soft);padding:2px 12px 3px}
nav button kbd{margin-left:auto;font-size:9px;color:var(--ink-soft);background:var(--surface-3);
  border:1px solid var(--glass-line);border-radius:5px;padding:0 4px;line-height:14px}
nav button.on kbd{color:#fff;background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}
.cmdkbtn{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;
  border:1px dashed color-mix(in srgb,var(--ink) 18%,transparent);background:var(--surface-3);
  border-radius:12px;padding:8px 10px;font-size:12px;color:var(--ink-soft);cursor:pointer}
.cmdkbtn:hover{background:var(--surface-2);color:var(--ink)}
.navgroup .navlabel:first-child{margin-top:0}
nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  color:var(--ink);font-family:var(--font-cute);font-size:14.5px;padding:10px 13px;border-radius:14px;
  cursor:pointer;text-align:left;transition:transform .15s,background .15s}
nav button:hover{background:var(--surface-2);transform:translateX(3px)}
nav button.on{background:linear-gradient(135deg,#ff7e60,#e8484f);color:#fff;
  box-shadow:0 4px 12px rgba(232,72,79,.35);transform:translateX(2px)}
.sidefoot{margin-top:auto;text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.55}
.sidefoot .peek{width:96px;display:block;margin:4px auto 2px;opacity:.92;
  filter:drop-shadow(0 6px 10px rgba(210,130,90,.26))}
#app:has(.hero) .sidefoot .peek{display:none}
/* ============ 主区 ============ */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;
  border-bottom:2px solid var(--line);background:color-mix(in srgb, var(--surface) 86%, transparent);backdrop-filter:blur(6px)}
.pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-cute);font-size:12px;
  background:var(--surface-2);border:2px solid var(--line);border-radius:999px;padding:3px 13px;color:var(--dim)}
.pill b{color:var(--ink);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;background:#d9c3aa;box-shadow:0 0 0 3px #f4e6d4}
.pill.ok{border-color:#cde7bd;background:#f6fcf1}
.pill.ok .dot{background:var(--green);box-shadow:0 0 0 3px #e2f2d8}
.pill.bad{border-color:#f2bcb6;background:color-mix(in srgb, var(--red-soft) 70%, var(--surface-2))}
.pill.bad .dot{background:#e05252;box-shadow:0 0 0 3px #fadcd9}
.pill.wait{border-color:#f0d9a8;background:color-mix(in srgb, var(--gold-soft) 70%, var(--surface-2))}
.pill.wait .dot{background:var(--gold);box-shadow:0 0 0 3px #f8ecc9}
.spacer{flex:1}
.content{flex:1;overflow:auto;padding:18px 20px 14px;position:relative}
h2.page{font-family:var(--font-cute);font-size:18px;font-weight:400;color:var(--red-deep);margin-bottom:4px}
p.tip{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
p.tip code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:11px}
.kv{font-size:12px;color:var(--dim);margin-top:5px}
.kv b{color:var(--ink)}
/* ============ 按钮 ============ */
button.btn{font-family:var(--font-cute);background:var(--surface-2);border:2px solid var(--line);border-radius:12px;
  padding:6px 15px;font-size:13px;cursor:pointer;color:var(--ink);
  box-shadow:0 3px 0 rgba(196,138,96,.16);transition:transform .12s,box-shadow .12s,border-color .12s}
button.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 rgba(196,138,96,.18);border-color:#eec9a4}
button.btn:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(196,138,96,.18)}
button.primary{background:linear-gradient(135deg,#ff7a5c,#e8484f);border-color:#d43c46;color:#fff;
  text-shadow:0 1px 0 rgba(150,40,40,.22)}
button.primary:hover{filter:brightness(1.05);color:#fff}
button.tiny{padding:3px 10px;font-size:12px;border-radius:10px;box-shadow:none}
button.tiny:hover{transform:none;box-shadow:none}
button:disabled{opacity:.5;pointer-events:none}
button.btn.tabon{background:var(--red-soft);border-color:#f0a99e;color:var(--red-deep);box-shadow:none}
/* ============ 对话 ============ */
#chatWrap{display:flex;flex-direction:column;height:100%}
.chatbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.chatbar select{font:inherit;font-family:var(--font-cute);padding:5px 11px;border-radius:12px;
  border:2px solid var(--line);background:var(--surface-2);color:var(--ink)}
#msgs{flex:1;overflow:auto;padding:6px 2px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:min(86%,640px);align-items:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.ava{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;border:2.5px solid #fff;
  box-shadow:0 3px 8px rgba(200,120,80,.28);background:var(--red-soft);
  display:flex;align-items:center;justify-content:center}
.ava img{width:100%;height:100%;display:block;object-fit:cover}
.msg.me .ava{background:linear-gradient(135deg,#f09a7a,#d96a55);color:#fff;font-size:12px;font-weight:700}
.msg > div{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.msg.me > div{align-items:flex-end}
.bub{position:relative;background:var(--surface-2);border:2px solid var(--line);border-radius:16px;border-top-left-radius:5px;
  padding:10px 14px;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;max-width:100%;font-size:14.5px}
.bub::before{content:"";position:absolute;left:-8px;top:15px;width:11px;height:11px;
  background:inherit;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.msg.me .bub::before{left:auto;right:-8px;border-left:0;border-bottom:0;
  border-right:2px solid #f2bfb4;border-top:2px solid #f2bfb4}
.msg.me .bub{background:linear-gradient(180deg,#ffece5,#ffdcd0);border-color:#f2bfb4;
  border-radius:16px;border-top-right-radius:5px}
.meta{font-size:11px;color:var(--dim);margin-top:5px;max-width:100%;overflow-wrap:anywhere}
.msg.me .meta{text-align:right}
.face{font-size:16px;vertical-align:-2px;margin:0 1px}
.face.chip{font-size:11px;background:var(--gold-soft);border:1px solid #f0dcae;border-radius:6px;
  padding:0 5px;vertical-align:1px;color:#8a6a1f}
.typing .bub{color:#b98f6b}
.typing .ava img{animation:run .8s ease-in-out infinite}
.dots::after{content:"…";animation:dots 1.2s steps(4) infinite}
/* 空状态：立绘 + 搭话 */
.hero{margin:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;padding:8px}
.hero img{width:clamp(150px,30vh,235px);border-radius:26px;filter:drop-shadow(0 12px 20px rgba(215,120,90,.30));
  animation:bob 3.4s ease-in-out infinite}
.hbub{position:relative;background:var(--surface-2);border:2px solid var(--line);border-radius:20px;
  border-bottom-left-radius:6px;padding:16px 20px;font-family:var(--font-cute);font-size:16px;
  color:var(--red-deep);box-shadow:var(--shadow);max-width:330px;transform:rotate(-1.5deg)}
.hbub small{display:block;font-family:var(--font-body);font-weight:400;color:var(--dim);
  font-size:12px;margin-top:8px;line-height:1.7}
#chatInput{display:flex;gap:10px;margin-top:12px;align-items:flex-end}
#chatInput textarea{flex:1;resize:none;font:inherit;border:2px solid var(--line);border-radius:18px;
  padding:11px 15px;min-height:48px;max-height:140px;background:var(--surface-2);box-shadow:var(--shadow);
  transition:border-color .15s,box-shadow .15s}
#chatInput textarea:focus{outline:none;border-color:#f3b0a5;box-shadow:0 0 0 4px rgba(232,72,79,.12)}
#sendBtn{font-size:15px;padding:10px 24px;border-radius:999px;min-height:48px}
.hintline{font-size:11px;color:var(--dim);text-align:right;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{background:var(--surface-3);border:2px solid color-mix(in srgb, var(--line) 80%, var(--gold));color:var(--ink-soft);border-radius:999px;
  padding:4px 13px;font-size:12px;cursor:pointer;font-family:var(--font-cute);transition:all .15s}
.chips button:hover{color:var(--red);border-color:#f0a99e;background:var(--red-soft);
  transform:rotate(-1deg) translateY(-1px)}
/* ============ 通用卡 ============ */
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 18px;
  box-shadow:var(--shadow);margin-bottom:16px}
.card h3{font-family:var(--font-cute);font-size:15px;font-weight:400;margin-bottom:10px;color:var(--red-deep)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:9px 13px}
.stat b{display:block;font-family:var(--font-cute);font-size:20px;color:var(--red);font-weight:400}
.stat span{font-size:11px;color:var(--dim)}
.stat:nth-child(2) b{color:#4d93c4}
.stat:nth-child(3) b{color:#c98d1e}
textarea.code{width:100%;min-height:380px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;
  border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-3);color:var(--ink)}
textarea.code:focus{outline:none;border-color:#f3b0a5}
label.f{font-family:var(--font-cute);font-size:13px;color:var(--dim);display:block;margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;border:2px solid var(--line);border-radius:12px;font-family:var(--font-body);background:var(--surface-2);
  padding:6px 11px;background:var(--surface-2);color:var(--ink)}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,textarea:focus,select:focus{outline:none;border-color:#f3b0a5}
input[type=checkbox]{accent-color:var(--red);width:15px;height:15px}
input::placeholder,textarea::placeholder{color:var(--ink-faint);opacity:1}
.check{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)}
.mpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 14px;
  max-height:280px;overflow:auto;margin-top:8px;padding:10px 12px;border-radius:12px;
  border:2px solid var(--line);background:var(--surface-2)}
.mpick label{display:flex;gap:7px;align-items:center;min-width:0;cursor:pointer;
  font-size:12px;color:var(--ink);padding:3px 0}
.mpick label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpick input{flex:none;accent-color:var(--ui-accent);margin:0}
.mpick{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 30%,transparent) transparent}
.mpick::-webkit-scrollbar{width:10px}
.mpick::-webkit-scrollbar-track{background:transparent}
.mpick::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 26%,transparent);
  border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.mpick::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--ink) 45%,transparent);background-clip:padding-box}
@media(max-width:700px){.mpick{grid-template-columns:1fr;max-height:300px}}
/* 人格页：官方介绍卡 */
.posterRow{display:flex;gap:20px;align-items:center}
.posterRow img{width:102px;border-radius:14px;border:3px solid #fff;
  box-shadow:0 8px 20px rgba(190,110,80,.30);transform:rotate(-2deg);transition:transform .25s}
.posterRow img:hover{transform:rotate(0deg) scale(1.03)}
.pcopy{font-size:12px;color:var(--dim);line-height:1.9}
.pcopy b{color:var(--red-deep);font-family:var(--font-cute);font-size:15px;font-weight:400}
.pcopy .hint{display:block;margin-top:6px;font-size:11.5px}
/* ============ 插件 ============ */
.plgrid{display:grid;grid-template-columns:250px 1fr;gap:16px}
/* 工坊工作台：代码区撑满、干跑台常驻可见 */
.plview{display:flex;flex-direction:column;overflow:hidden}
.plview .plgrid{display:grid;grid-template-columns:250px 1fr;gap:16px;flex:1;min-height:0}
.plcolL{display:flex;flex-direction:column;min-height:0}
.plcolL .pllist{overflow:auto;min-height:0}
.plcolR{display:flex;flex-direction:column;min-height:0;overflow:auto}
.plcolR textarea.code{flex:1;min-height:110px}
.plcolR .card.dry{margin:12px 0 0}
.pllist{background:var(--surface-2);border:2px solid var(--line);border-radius:16px;overflow:hidden;height:fit-content}
.pllist button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;
  background:transparent;padding:10px 13px;font-size:13px;cursor:pointer;
  border-bottom:2px dashed #f6ead8;color:var(--ink);transition:background .12s}
.pllist button:last-child{border-bottom:0}
.pllist button::before{content:"✦";color:#f2c78e;font-size:11px}
.pllist button:hover{background:var(--surface-3)}
.pllist button.on{background:var(--gold-soft);color:#9a6d15;font-weight:700}
.pllist button.on::before{color:var(--gold)}
.badge{font-size:10.5px;border-radius:99px;padding:0 8px;margin-left:auto}
.badge.on{background:var(--green-soft);color:#487a2e}

  display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:var(--comic-shadow);transition:transform .16s ease, box-shadow .16s ease;
}
.charitem:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(120,70,50,.18)}
.charitem .artbg{position:absolute;inset:0;background:
  radial-gradient(120% 80% at 50% 0%, color-mix(in srgb,var(--c2) 75%, white), transparent 70%),
  linear-gradient(160deg,var(--c2),var(--c1));}
.charitem .artbg img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;opacity:.92;
  mix-blend-mode:luminosity;filter:saturate(1.1) contrast(1.02)}
.charitem .artveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,8,8,.02) 12%,rgba(16,8,8,.18) 40%,rgba(16,8,8,.62) 68%,rgba(16,8,8,.88) 100%)}
.charitem .artbody{position:relative;z-index:1;padding:14px 15px 15px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.charitem .artbody .nm{font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:26px;margin:0;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.charitem .artbody .en{color:rgba(255,255,255,.88);font-size:10.5px;letter-spacing:2px}
.charitem .artbody .tagline{color:rgba(255,255,255,.86);min-height:0;margin-top:3px}
.charitem .artbody .meta2{color:rgba(255,255,255,.88);font-size:10.5px;gap:8px}
.charitem .bigemoji{position:absolute;left:14px;top:12px;z-index:1;font-size:40px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}
.charitem .stars{position:absolute;right:13px;top:14px;z-index:1;color:#ffe9a8;letter-spacing:2px;font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.charitem.active{box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-accent) 55%,white), 0 18px 38px rgba(120,70,50,.2)}
.charitem .charbadge{position:absolute;z-index:2;left:12px;top:54px;background:linear-gradient(135deg,var(--ui-accent),var(--ui-accent2));color:#fff;
  border-radius:999px;padding:2px 9px;font-size:10px;box-shadow:0 4px 12px rgba(0,0,0,.2)}

/* 插件商店 */
.plugkpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:8px 0 14px}
.plugkpi .k{background:var(--glass);border:1px solid var(--glass-line);border-radius:calc(var(--ui-radius) - 2px);padding:11px 13px;box-shadow:var(--comic-shadow)}
.plugkpi .k b{display:block;font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:26px;line-height:1.1;color:var(--ui-accent)}
.plugkpi .k span{font-size:11px;color:var(--ink-soft)}
.plugbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.plugbar input{flex:1;min-width:180px;border-radius:999px;border:1px solid var(--glass-line);background:var(--surface-2);padding:8px 14px;font-size:13px}
.plugbar .fbtn{border-radius:999px;padding:6px 12px;font-size:12px;border:1px solid var(--glass-line);background:var(--surface-3);cursor:pointer}
.plugbar .fbtn.on{background:var(--ui-accent);color:#fff;border-color:transparent;font-weight:700}
.pluggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px;margin-bottom:16px}
.plugcard{
  position:relative;text-align:left;border:1px solid var(--glass-line);border-radius:calc(var(--ui-radius) + 2px);
  background:linear-gradient(160deg,rgba(255,255,255,.9),color-mix(in srgb,var(--paper) 82%,white));
  padding:13px 14px;box-shadow:var(--comic-shadow);cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  display:flex;flex-direction:column;gap:6px;min-height:132px;
}
.plugcard:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(120,70,50,.16);border-color:color-mix(in srgb,var(--ui-accent) 35%,white)}
.plugcard.on{border-color:var(--ui-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-accent) 22%,transparent)}
.plugcard .top{display:flex;align-items:center;gap:8px}
.plugcard .ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ui-accent) 18%,white),color-mix(in srgb,var(--ui-accent2) 26%,white))}
.plugcard .nm{font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:16px;line-height:1.15}
.plugcard .sub{font-size:10px;color:var(--ink-soft);letter-spacing:.5px}
.plugcard .desc{font-size:11.5px;color:var(--ink-soft);line-height:1.55;flex:1}
.plugcard .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--ink-soft)}
.plugcard .st{position:absolute;right:11px;top:11px;width:9px;height:9px;border-radius:99px;background:#d9c9b8;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.plugcard .st.on{background:#59b36b;box-shadow:0 0 0 3px rgba(89,179,107,.18)}
.plugcard .st.err{background:#e05a4f}
.plugcard .lock{font-size:10px;color:var(--ui-accent);border:1px solid color-mix(in srgb,var(--ui-accent) 30%,transparent);border-radius:999px;padding:1px 7px}

details.card>summary{cursor:pointer;font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:17px;color:var(--red-deep);

/* 插件详情抽屉 */

.drawer.on{display:block}
.drawerbox{position:absolute;right:0;top:0;bottom:0;width:min(460px,94vw);background:var(--paper);

/* 更多面板 */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,12,10,.45);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheetbox{width:min(560px,100%);background:var(--paper);border-radius:24px 24px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));

.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
  font-family:"ZCOOL KuaiLe",var(--font-cute);font-size:20px}

/* 表单 / 自定义 */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}

.fld label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.5px}

/* ============ 深色主题 ============ */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"],
/* 角色主题（theme.css）把变量写在 body[data-theme] 上，这里必须同样落在 body 才盖得住 */
html[data-theme="dark"] body{
  --bg:#181210; --paper:#241c17;
  --ink:#f5e9dc; --dim:#cdb5a0;
  --line:#3c2d24;
  --red:#ff6f61; --red-deep:#ff9a86; --red-soft:#3a211d;
  --gold:#f2b23e; --gold-soft:#3a2e18;
  --sky:#79c2e8; --sky-soft:#1d2b36;

<script>
/* ================= 基础 ================= */
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FACE = {"呲牙":"😁","微笑":"🙂","大哭":"😭","流泪":"😢","捂脸":"🤦","调皮":"😜","doge":"🐶","比心":"🫰","点赞":"👍",
 "睡":"😴","抓狂":"😫","亲亲":"😘","委屈":"🥺","偷笑":"🤭","酷":"😎","可怜":"🥹","生气":"😠","疑问":"🤔","鼓掌":"👏",
 "ok":"👌","爱心":"❤️","玫瑰":"🌹","吃瓜":"🍉","惊讶":"😮","汗":"😅","奋斗":"💪","大兵":"🫡","抱抱":"🤗","庆祝":"🎉"};
function faces(text){
  return esc(text).replace(/\[表情[:：]([^\[\]]{1,16})\]/g, (m, n) => {
    const e = FACE[n.trim()];
    return e ? `<span class="face">${e}</span>` : `<span class="face chip">${esc(n.trim())}</span>`;
  });
}
function mdLite(h){
  // 输入已是 esc() 过的纯文本；只认最常见的几种，避免误伤角色扮演里的符号
  h = h.replace(/```([\s\S]*?)```/g, (m,c) => `<pre>${c.replace(/^\n+|\n+$/g,"")}</pre>`);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/(^|[\s（(])\*([^*\n]{1,80})\*(?=$|[\s，。！？、）」)])/g, "$1<i>$2</i>");
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}
function fmt(t){ return mdLite(faces(t)); }
function hhmm(ts){ const d = new Date(ts*1000); return d.toTimeString().slice(0,5); }
function hhmmss(ts){ const d = new Date(ts*1000); return d.toTimeString().slice(0,8); }
const _apiInflight = new Map();
async function api(path){
  // 同一 URL 并发只发一次（切页/轮询重叠时很常见）
  const key = String(path);
  if (_apiInflight.has(key)) return _apiInflight.get(key);
  const p = (async () => {
    // 面板读接口也带这个头：敏感 GET（二维码/日志/聊天/源码）在服务端要过同一道闸
    const r = await fetch(key, {headers:{"X-Klee-Studio":"1"}});
    return r.json();
  })().finally(() => _apiInflight.delete(key));
  _apiInflight.set(key, p);
  return p;
}
async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json","X-Klee-Studio":"1"}, body:JSON.stringify(body)});
  return r.json();
}
let ACTIVE = {id:"klee", name:"可莉", emoji:"💥", color:"#e4573d", color2:"#ffd9c9"};
const CHIPS = {
  klee: ["讲个蒙德的故事","猜个谜语","夸夸我","你今天在干嘛呀"],
  hutao: ["来一首打油诗","往生堂今天忙吗","你怎么看生死","陪我聊会儿"],
  citlali: ["帮我看看今天的征兆","你又在睡觉吗","给我一句预言","烟里有什么"],
  cyrene: ["听我讲个过去的故事","你会忘记我吗","陪我想想以前的事","说点什么吧"],
  atri: ["你在算什么","心是什么","今天开心吗","陪我聊会儿"],
};
function charAva(extra=""){
  return `<div class="ava charava ${extra}" style="background:linear-gradient(135deg,${ACTIVE.color},${ACTIVE.color2})">${ACTIVE.emoji}</div>`;
}
function setActiveChar(c){
  if (!c) return;
  ACTIVE = {...ACTIVE, ...c};
  const themeId = ACTIVE.theme || ACTIVE.id;
  document.body.dataset.char = ACTIVE.id;
  document.body.dataset.theme = themeId;
  const css = $("charThemeCss");
  if (css){
    const v = encodeURIComponent(ACTIVE.theme_version || Date.now());
    css.href = `/api/theme.css?character=${encodeURIComponent(ACTIVE.id)}&v=${v}`;
  }
  const b = $("brandAva");
  if (b){ b.textContent = ACTIVE.emoji; b.style.background = `linear-gradient(135deg,${ACTIVE.color},${ACTIVE.color2})`; }
  document.title = `Character Bot · ${ACTIVE.name}`;
  const tm = $("themeColor");
  if (tm) tm.content = ACTIVE.color2 || "#fff3e2";
  const peek = document.querySelector(".sidefoot .peek");
  if (peek){ peek.src = charArt(ACTIVE.id); peek.style.display = "block"; }
  loadUI(ACTIVE.id);
}

/* ================= UI 自定义（每角色一份，存服务端） ================= */
let UI = {accent:"",accent2:"",radius:20,density:"comfy",font_scale:100,bg:"aurora",
          bubble:"comic",effects:true,card_style:"glass",
          modules:["status","quick","recent","char","plugins","kb"]};
const MOD_LABEL = {status:"运行状态", quick:"快捷入口", recent:"最近消息", char:"当前角色",
                   plugins:"插件概览", kb:"知识库", ops:"运维告警", requests:"好友/入群请求"};
function applyUI(){
  const r = document.documentElement;
  r.style.setProperty("--ui-accent", UI.accent || ACTIVE.color || "#e8484f");
  r.style.setProperty("--ui-accent2", UI.accent2 || ACTIVE.color2 || "#f2b23e");
  r.style.setProperty("--ui-radius", (UI.radius || 20) + "px");
  r.style.setProperty("--ui-scale", String((UI.font_scale || 100) / 100));
  document.body.dataset.bg = UI.bg || "aurora";
  document.body.dataset.bubble = UI.bubble || "comic";
  document.body.dataset.density = UI.density || "comfy";
  document.body.dataset.card_style = UI.card_style || "glass";
  document.body.dataset.effects = UI.effects ? "true" : "false";
}
let uiReq = 0;
function uiCacheGet(cid){
  try{ const raw = localStorage.getItem("ks_ui_" + cid); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
async function loadUI(cid){
  const id = cid || ACTIVE.id;
  const cached = uiCacheGet(id);
  if (cached){ UI = {...UI, ...cached}; applyUI(); }      // 本地先画，避免白等一次 RTT
  const seq = ++uiReq;
  try{
    const d = await api("/api/ui?character=" + encodeURIComponent(id));
    if (seq !== uiReq) return;                            // 切角色途中回来的旧请求丢掉
    if (d && d.ok && d.prefs){
      UI = {...UI, ...d.prefs}; applyUI();
      try{ localStorage.setItem("ks_ui_" + id, JSON.stringify(d.prefs)); }catch(e){}
    }
  }catch(e){}
}
async function saveUI(patch){
  const r = await post("/api/ui", {character: ACTIVE.id, prefs: patch});
  if (r && r.ok){ UI = {...UI, ...r.prefs}; applyUI();
    try{ localStorage.setItem("ks_ui_" + ACTIVE.id, JSON.stringify(r.prefs)); }catch(e){}
    return true; }
  return false;
}
let toastTimer = null;
function flash(text){
  let el = $("toast");
  if (!el){ el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = text;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 4200);
}
function setTheme(mode){
  localStorage.setItem("ks_theme", mode);
  applyTheme();
  syncThemeSeg();
}
function applyTheme(){
  const mode = localStorage.getItem("ks_theme") || "auto";
  const sysDark = !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme =
    mode === "dark" || (mode !== "light" && sysDark) ? "dark" : "light";
}
function syncThemeSeg(){
  const cur = localStorage.getItem("ks_theme") || "auto";
  document.querySelectorAll("#themeSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === cur));
}
if (window.matchMedia){
  try{
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if ((localStorage.getItem("ks_theme") || "auto") === "auto") applyTheme();
    });
  }catch(e){}
}
function moreSheet(){ document.getElementById("sheet").classList.add("on"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); }
/* ================= 命令面板（Ctrl+K） ================= */
const PAGES = [
  ["chat", "💬", "对话", "和当前角色聊天"],
  ["chars", "🎭", "角色", "切换出演 / 导入角色包"],
  ["board", "📊", "看板", "消息、走势、好感度"],
  ["persona", "🌸", "人格 · 知识库", "SOUL 与检索"],
  ["plugins", "🧩", "插件", "当前角色专属 + 通用"],
  ["reminders", "⏰", "提醒", "提醒与纪念日"],
  ["ops", "⚙️", "运维 · 机器人", "连接、二维码、模型"],
  ["custom", "✨", "自定义", "配色、气泡、模块"],
];
let cmdItems = [], cmdIdx = 0, cmdPluginCache = null, cmdPluginTs = 0;
function cmdkOpen(){
  const el = $("cmdk"); if (!el) return;
  el.classList.add("on");
  const inp = $("cmdkInput"); inp.value = ""; inp.focus();
  cmdkRender("");
  if (!cmdPluginCache || Date.now() - cmdPluginTs > 60000){
    api("/api/plugins").then(d => {
      cmdPluginCache = d.meta || {}; cmdPluginTs = Date.now();
      if ($("cmdk") && $("cmdk").classList.contains("on")) cmdkRender($("cmdkInput").value);
    }).catch(() => {});
  }
}
function cmdkClose(){ const el = $("cmdk"); if (el) el.classList.remove("on"); }
function cmdkBuild(q){
  const needle = (q || "").trim().toLowerCase();
  const out = [];
  PAGES.forEach(([v, ic, title, sub]) => {
    if (!needle || (title + sub + v).toLowerCase().includes(needle))
      out.push({ic, title, sub, run: () => go(v)});
  });
  ((charData && charData.items) || []).forEach(c => {
    if (!needle || (c.name + c.en + c.tagline).toLowerCase().includes(needle))
      out.push({ic: c.emoji || "🎭", title: "切换到 " + c.name, sub: c.active ? "当前出演" : "角色",
                run: async () => {
                  if (c.active) return go("chars");
                  const r = await post("/api/characters/switch", {id: c.id});
                  if (r.ok){ setActiveChar(r.character); charSel = c.id; go("chars"); flash("已切换到 " + c.name); }
                  else flash("切换失败：" + (r.error || ""));
                }});
  });
  Object.entries(cmdPluginCache || {}).forEach(([name, m]) => {
    if (m.characters && m.characters.length && !m.characters.includes(ACTIVE.id)) return;
    const hay = "插件 " + (m.title || name) + " " + (m.description || "");
    if (needle && !hay.toLowerCase().includes(needle)) return;
    out.push({ic: m.characters && m.characters.length ? "🧩" : "⚙️", title: m.title || name,
              sub: "插件 · " + (m.commands || 0) + " 命令", run: () => openPluginDrawer(name, m)});
  });
  return out.slice(0, 14);
}
function cmdkRender(q){
  cmdItems = cmdkBuild(q); cmdIdx = 0;
  const box = $("cmdkList"); if (!box) return;
  box.innerHTML = cmdItems.length
    ? cmdItems.map((it, i) => `<div class="cmdkitem ${i === 0 ? "on" : ""}" onclick="cmdkRun(${i})">
        <span class="ic">${it.ic}</span><span>${esc(it.title)}</span><span class="sub">${esc(it.sub)}</span></div>`).join("")
    : `<div class="cmdkempty">没有找到；试试「角色」「插件」「运维」</div>`;
}
function cmdkKey(e){
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    if (!cmdItems.length) return;
    cmdIdx = (cmdIdx + (e.key === "ArrowDown" ? 1 : -1) + cmdItems.length) % cmdItems.length;
    document.querySelectorAll("#cmdkList .cmdkitem").forEach((x, i) => x.classList.toggle("on", i === cmdIdx));
    const on = document.querySelector("#cmdkList .cmdkitem.on"); if (on) on.scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter"){
    e.preventDefault(); cmdkRun(cmdIdx);
  } else if (e.key === "Escape"){
    cmdkClose();
  }
}
function cmdkRun(i){
  const it = cmdItems[i]; if (!it) return;
  cmdkClose();
  Promise.resolve(it.run()).catch(e => flash(String(e)));
}

async function installPluginPack(inp){

async function pollChat(){
  const j = await api(`/api/chat?session=${encodeURIComponent(chat.session)}&after=${chat.after}&character=${encodeURIComponent(ACTIVE.id)}`);
  if (!j || j.session !== chat.session){ return; }
  const box = $("msgs"); if (!box) return;
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
  const fresh = (j.messages || []);
  fresh.forEach(m => box.insertAdjacentHTML("beforeend", bubble(m)));
  chat.after = j.total;
  if (fresh.length || j.running){ chat.idle = 0; } else { chat.idle += 1; }
  if (chat.idle === 3 || chat.idle === 7) armChatPoll();   // 冷场后逐级降频
  lastRunning = j.running;
  $("chatStat").textContent = j.queue > 0 ? `队列里还有 ${j.queue} 条` : "";
  const t = $("typingB");
  if (j.running && !t){
    box.insertAdjacentHTML("beforeend", `<div class="msg klee typing" id="typingB">${charAva()}
      <div><div class="bub">${esc(ACTIVE.name)}正在想呀想<span class="dots"></span></div><div class="meta" id="tmeta">她正在赶过来（约 35 秒）</div></div></div>`);
  } else if (!j.running && t){ t.remove(); }
  const hero = $("emptyHero");
  if (hero && (j.total > 0 || j.running)) hero.remove();

    box.insertAdjacentHTML("afterbegin", heroHTML());
  if (stick) box.scrollTop = box.scrollHeight;
  updateToBottom();
}

}

function renderKbRecent(rows){
  const box = $("kbRecent"); if (!box) return;
  if (!rows.length){
    box.innerHTML = `<div class="kv">还没有命中记录。聊天时真的用到知识，这里才会出现。</div>`;
    return;
  }
  box.innerHTML = rows.map(r => {
    const when = r.ts ? new Date(r.ts*1000).toLocaleString("zh-CN",{hour12:false}) : "—";
    const hits = (r.hits || []).map(h =>
      `<span class="tag">${esc(h.source || "?")}${h.title ? " · " + esc(h.title) : ""} <b>${(h.dense ?? 0).toFixed(3)}</b></span>`).join(" ");
    return `<div class="kbhit"><div class="kbh-h"><span class="kbh-t">「${esc(r.query || "")}」</span>
      <span class="kbh-s">${esc(when)} · 注入 ${r.chars || 0} 字</span></div>
      <div class="kbh-h" style="margin:0">${hits}</div></div>`;
  }).join("");
}

            error: m.error || "", commands: m.commands || 0, hits: m.hits || 0,
            usage: m.usage || ""};
  }).filter(p => {
    // 角色限定插件与角色绑定：不是当前角色的，直接不显示
    if (p.chars.length && !p.chars.includes(ACTIVE.id)) return false;
    if (plugMode === "mine" && !(p.chars.includes(ACTIVE.id))) return false;
    if (plugMode === "general" && p.chars.length) return false;
    if (plugMode === "on" && !p.enabled) return false;
    if (plugMode === "err" && !p.error) return false;
    if (q){
      const hay = (p.name + p.title + p.description + p.usage).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (!rows.length){ box.innerHTML = `<div class="kv">没有匹配的插件。</div>`; return; }
  box.innerHTML = rows.map(p => {
    const owner = !p.chars.length
      ? "通用"
      : (p.chars.includes(ACTIVE.id)
          ? `${PLUG_ICON[ACTIVE.id] || "🎭"} ${esc(ACTIVE.name)}${p.chars.length > 1 ? " · 共享" : ""}`
          : `${PLUG_ICON[p.chars[0]] || "🎭"} ${esc(p.chars[0])}`);
    return `<div class="plugcard ${p.file === plSel ? "on" : ""}" onclick="openPluginDrawer('${esc(p.name)}')" title="${esc(p.description)}">
      <span class="st ${p.error ? "err" : (p.enabled ? "on" : "")}"></span>
      <div class="top"><span class="ico">${p.chars.length ? (PLUG_ICON[p.chars[0]] || "🎭") : "🧩"}</span>
        <div><div class="nm">${esc(p.title)}</div><div class="sub">${esc(p.name)}.py · v${esc((plMeta[p.name] || {}).version || "1.0")}</div></div></div>
      <div class="desc">${esc(p.description || "（没有说明）")}</div>
      <div class="foot"><span class="lock" style="${p.chars.length ? "" : "color:var(--ink-soft);border-color:var(--line)"}">${owner}</span>
        <span>${p.error ? "⚠ 加载失败" : (p.enabled ? "● 已启用" : "○ 已停用")}</span>
        <span>⌘ ${p.commands}</span><span>· 命中 ${p.hits}</span>
        ${p.error ? `<span style="color:#c0392b">· 加载失败</span>` : ""}</div>
    </div>`;
  }).join("");
}

/* ---- 模型供应商：地址一填就自动拉模型清单，勾选即可，不用手打 ---- */
let pvFetched = "";          // 上一次成功拉取的 api|key_env，防重复请求
let pvPending = "";          // 卡片重渲染后要补到 pvOut 的一句话
let pvTimer = null;

function pvModelLines(){
  return ($("pvModels").value || "").split(/\n+/).map(x => x.trim()).filter(Boolean);
}
function pvBox(){ return $("pvModelBox"); }

/* 拉到的清单 + 已勾选的取并集：编辑老供应商时，它原有的模型不会消失 */
function pvRender(all, sel){
  const box = pvBox();
  const keep = new Set(sel);
  const rows = [...new Set([...(all || []), ...keep])].sort((a, b) => a.localeCompare(b));
  if (!rows.length){ box.style.display = "none"; return; }
  box.innerHTML = rows.map(m => `<label title="${esc(m)}"><input type="checkbox" value="${esc(m)}"
    ${keep.has(m) ? "checked" : ""} onchange="pvSync()"> <span>${esc(m)}</span></label>`).join("");
  box.style.display = "";
  pvFitRows(box);                          // 可视高度凑成整行，别把最后一行切一半
  const n = keep.size;
  $("pvFetchOut").textContent = `拉到 ${rows.length} 个模型 · 已选 ${n} 个`;
  $("pvSearch").style.display = "";
  $("pvAll").style.display = ""; $("pvNone").style.display = "";
}
function pvFitRows(box){
  const first = box.querySelector("label");
  if (!first) return;
  const gap = parseFloat(getComputedStyle(box).rowGap) || 0;
  const rh = Math.ceil(first.getBoundingClientRect().height) + gap;
  const pad = 20;                          // .mpick 上下 padding 各 10
  const max = window.innerWidth <= 700 ? 300 : 280;
  const rows = Math.max(3, Math.floor((max - pad) / rh));
  box.style.maxHeight = (rows * rh + pad - gap) + "px";
}
window.addEventListener("resize", () => { if (pvBox()) pvFitRows(pvBox()); });

function pvSync(){
  const picked = [...pvBox().querySelectorAll("input:checked")].map(i => i.value);
  $("pvModels").value = picked.join("\n");
  const total = pvBox().querySelectorAll("input").length;
  $("pvFetchOut").textContent = `拉到 ${total} 个模型 · 已选 ${picked.length} 个`;
}
function pvFilter(){
  const q = ($("pvSearch").value || "").trim().toLowerCase();
  pvBox().querySelectorAll("label").forEach(l => {
    l.style.display = !q || l.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}
function pvPickAll(on){
  const q = ($("pvSearch").value || "").trim().toLowerCase();
  pvBox().querySelectorAll("label").forEach(l => {
    if (q && !l.textContent.toLowerCase().includes(q)) return;
    l.querySelector("input").checked = !!on;
  });
  pvSync();
}

async function botProvFetch(quiet){
  const api = $("pvApi").value.trim();
  const ken = $("pvKeyEnv").value.trim();
  if (!/^https?:\/\//i.test(api)){
    if (!quiet) $("pvFetchOut").textContent = "先填一个 http(s) 地址";
    return false;
  }
  const sig = api + "|" + ken;
  if (quiet && sig === pvFetched) return true;
  $("pvFetchOut").textContent = "正在向 " + api + " 要模型清单…";
  let d;
  try { d = await post("/api/models/discover", {api, key_env: ken}); }
  catch (e){ $("pvFetchOut").textContent = "✗ 请求失败：" + e; return false; }
  if (!d || !d.ok){
    const msg = (d && d.error) || "拉取失败";
    // 还在敲地址/没填 key 时别吓人，成功了一次就正常报错
    $("pvFetchOut").textContent = (quiet && !pvFetched ? "…" : "✗ ") + msg.slice(0, 120);
    return false;
  }
  pvFetched = sig;
  pvRender(d.models, pvModelLines());          // pvRender 会写「拉到 N · 已选 M」
  if (!d.key_seen && ken){
    $("pvFetchOut").textContent += `（环境变量 ${ken} 没设值，只有公开接口能拉到）`;
  }
  return true;
}

/* 角色卡：选中（只高亮，不切换） / 切换出演（真的换人格） */
function pickChar(id){
  charSel = id;
  document.querySelectorAll("#view .charitem").forEach(el =>
    el.classList.toggle("on", el.dataset.id === id));
  const cur = ((charData && charData.items) || []).find(c => c.id === id);
  const nameEl = $("charPlugName"), bodyEl = $("charPlugBody");
  if (cur && nameEl && bodyEl){
    nameEl.innerHTML = `🧩 ${esc(cur.name)} 的专属插件 `
      + `<span class="kv" style="font-family:var(--font-body)">随角色自动启用 · 不可关闭</span>`;
    bodyEl.innerHTML = (cur.plugins || []).length
      ? cur.plugins.map(p => `<span class="tag">${esc(p.title || p.name)}</span>`).join(" ")
      : "这个角色暂时没有专属插件（通用插件照常可用）";
  }
  if (cur && !cur.active) flash(`已选中「${cur.name}」——点「切换出演」才会真的换人`);
}

async function switchChar(id){
  if (!id) return;
  if (id === ACTIVE.id){ go("chars"); return; }
  flash("切换中…");
  let r;
  try {
    r = await post("/api/characters/switch", {id});
  } catch(e){
    flash("切换失败：网络错误"); return;
  }
  if (!r || !r.ok){
    flash("切换失败：" + ((r && r.error) || "未知错误"));
    return;
  }
  if (r.character) setActiveChar(r.character);
  if (charData && Array.isArray(charData.items)){
    charData.active = r.active || id;
    charData.items.forEach(c => { c.active = (c.id === charData.active); });
  }
  charSel = id;
  chat.char = ""; chat.after = 0;        // 回对话页时重新拉这个角色的会话
  flash("已切换到 " + ((r.character && r.character.name) || id));
  go("chars");
}

let remindTimer = null;
function _cd(due, now){
  const s = Math.max(0, due - now);
  if (s < 60) return "马上";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return `${d} 天 ${h % 24} 小时`;
  if (h >= 1) return `${h} 小时 ${m % 60} 分`;
  return `${m} 分钟`;
}

  }
  remindHash = rhash;

    $("remindCount").textContent = items.length;

  if (remindTimer){ clearInterval(remindTimer); remindTimer = null; }
  remindTimer = setInterval(() => {
    if (V === "reminders") viewReminders(false);

  }, 30000);
}

let feedSrc = localStorage.getItem("ks_feed_src") || "";
let feedAuto = localStorage.getItem("ks_feed_auto") !== "0";
let feedTimer = null;
function scheduleFeedRefresh(){
  if (feedTimer) { clearInterval(feedTimer); feedTimer = null; }
  if (feedAuto) feedTimer = setInterval(() => {
    if (V === "feed") viewFeed();
    else if (V === "board") viewFeed("feedSlot");
  }, 20000);
}
let feedHash = null, feedCache = [], feedShown = 30;
function feedListHTML(items, shown){
  if (!items.length) return '<div class="fitem">这里还没有消息——去跟她说句话吧</div>';
  const head = items.slice(0, shown).map(m => m.error ? `<div class="fitem">⚠ ${esc(m.error)}</div>` :
    `<div class="fitem ${m.role}"><div class="who">${hhmmss(m.ts)}<br><span class="tag">${esc(m.where)}</span></div>
     <div class="txt">${faces(m.text)}</div></div>`).join("");
  const more = items.length > shown
    ? `<div style="text-align:center;padding:10px"><button class="btn tiny" onclick="feedMore()">加载更多（还有 ${items.length - shown} 条）</button></div>`
    : "";
  return head + more;
}
function feedMore(){
  feedShown += 30;
  const box = $("feedList");
  if (box) box.innerHTML = feedListHTML(feedCache, feedShown);
}
async function viewFeed(target){
  const T = target || "view";
  const embed = T !== "view";
  const srcs = (await api("/api/feed/sources")).sources || [];
  if (!srcs.some(s => s.value === feedSrc)) feedSrc = "";
  const d = await api(`/api/feed?limit=100&src=${encodeURIComponent(feedSrc)}`);
  const items = (d.messages || []);
  const fhash = JSON.stringify([feedSrc, srcs.map(s => s.value), items]);
  if ($("feedList") && fhash === feedHash){
    return;                                    // 20 秒一轮的自动刷新：没新消息就不重绘（不再闪）
  }
  feedHash = fhash;
  feedCache = items;
  feedShown = Math.max(30, Math.min(feedShown, items.length));
  const st = $(T).scrollTop;
  $(T).innerHTML = `
  ${embed ? '<h3 style="margin:16px 0 8px">📜 消息</h3><p class="tip">她最近在各处的言行（最新在上）。</p>'
          : '<h2 class="page">📜 消息</h2><p class="tip">她最近在各处的言行（<b>最新在上</b>）。数据直读她的会话库，可以按来源筛选。</p>'}
  <div class="row feedbar" style="margin-bottom:10px">
    <select id="feedSel" title="按来源筛选">${(srcs.length ? srcs : [{value:"",label:"全部来源"}]).map(s=>`<option value="${esc(s.value)}" ${s.value===feedSrc?"selected":""}>${esc(s.label)}</option>`).join("")}</select>
    <button class="btn" onclick="viewFeed()">⟳ 刷新</button>
    <label class="check" style="font-size:12px"><input type="checkbox" id="feedAuto" ${feedAuto ? "checked" : ""}> 自动刷新</label>
  </div>
  <div class="feed" id="feedList">${feedListHTML(items, feedShown)}</div>`;
  $(T).scrollTop = st;
  $("feedSel").onchange = () => {
    feedSrc = $("feedSel").value;
    localStorage.setItem("ks_feed_src", feedSrc);
    viewFeed();
  };
  $("feedAuto").onchange = () => {
    feedAuto = $("feedAuto").checked;
    localStorage.setItem("ks_feed_auto", feedAuto ? "1" : "0");
    scheduleFeedRefresh();
  };
  scheduleFeedRefresh();
}

    });
    g.style.display = hit ? "" : "none";
    if (needle && hit) g.open = true;          // 有命中就展开
  });
}

async function viewBoard(target){

    </div>`;

  const widgets = boardWidgets(ov || {}, pl || {}, ch || {}, d || {});

  <p class="tip">可莉最近过得怎么样，一眼看完。消息量读自 hermes 会话库 <code>state.db</code>，

/* 好友/入群请求：只展示，通过/拒绝必须人点 */
async function opsRequests(){
  const box = $("reqBox"); if (!box) return;
  const d = await api("/api/requests?n=20");
  if (!d || !d.ok){ box.innerHTML = '<div class="kv">✗ 读取失败</div>'; return; }
  const items = d.items || [];
  const pending = items.filter(x => x.kind && !x.action);
  if (!pending.length){ box.innerHTML = '<div class="kv">最近没有待处理的请求。</div>'; return; }
  box.innerHTML = pending.map(r => {
    const who = esc(r.nickname || r.user_id || "?");
    const what = r.kind === "friend" ? "加好友" : `进群 ${esc(r.group_id || "")}`;
    const when = r.ts ? new Date(r.ts * 1000).toLocaleString("zh-CN", {hour12: false}) : "";
    return `<div class="opsline" style="margin:6px 0">
      <b>${who}</b>（${esc(r.user_id || "")}）想${what}
      ${r.comment ? `· 备注：${esc(r.comment)}` : ""}
      <span class="kv">${esc(when)}</span>
      <button class="btn tiny" onclick="opsReqAct('${esc(r.flag)}','${esc(r.kind)}',true)">通过</button>
      <button class="btn tiny" onclick="opsReqAct('${esc(r.flag)}','${esc(r.kind)}',false)">拒绝</button>
    </div>`;
  }).join("");
}
async function opsReqAct(flag, kind, approve){
  if (!confirm((approve ? "通过" : "拒绝") + "这个请求？")) return;
  const d = await post("/api/requests/action", {flag, kind, approve});
  $("reqMsg").textContent = d.ok ? (approve ? "✓ 已通过" : "✓ 已拒绝") : "✗ " + (d.error || "失败");
  opsRequests();
}

/* 掉线告警流水：QQ 离线 >2 分钟落一条 offline，恢复落一条 recovered —— 晨报直接读同一个 alerts.jsonl */
async function opsAlerts(){
  const box = $("alertBox"); if (!box) return;
  const d = await api("/api/alerts?n=20");
  if (!d || !d.ok){ box.innerHTML = `<div class="kv">✗ 读取失败</div>`; return; }
  const h = d.health || {};
  const head = h.connected
    ? `<b style="color:var(--green)">当前在线</b>`
    : `<b style="color:var(--red)">当前离线</b> · ${esc(h.detail || h.reason || "")}`;
  const list = (d.alerts || []).slice().reverse();
  const rows = list.map(e => {
    const bad = e.kind === "offline";
    const dur = (e.down_s === null || e.down_s === undefined) ? "—" : `${e.down_s}s`;
    return `· <b>${esc(e.time || "")}</b> <span class="pill ${bad ? "bad" : "ok"}" style="font-size:10px;padding:1px 7px">${bad ? "掉线" : "恢复"}</span>
      ${esc(e.text || "")} <span class="kv">(离线 ${dur})</span>`;
  }).join("<br>");
  const ahtml = `<div class="opsline">${head}</div>` + (rows
    ? `<div class="opsline" style="max-height:220px;overflow:auto;line-height:1.9">${rows}</div>`
    : `<div class="kv">还没有告警记录 —— 要么一直在线，要么掉线还没超过 2 分钟。</div>`);
  if (ahtml !== alertsHash){                   // 内容没变就不重绘（30 秒一轮不再闪）
    alertsHash = ahtml;
    box.innerHTML = ahtml;
  }
  if ($("alertMsg")) $("alertMsg").textContent = "更新于 " + hhmmss(Date.now() / 1000);
}

function cfgRow(field, vals){
  const v = vals[field.k];
  const val = v === null || v === undefined ? "" : String(v);
  let ctl;
  if (field.bool){
    ctl = `<select id="cfg_${field.k}"><option value="true" ${val === "true" ? "selected" : ""}>开 / true</option><option value="false" ${val === "false" ? "selected" : ""}>关 / false</option></select>`;
  } else if (field.opts){
    ctl = `<select id="cfg_${field.k}">${field.opts.map(o => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  } else if (field.secret) {
    ctl = `<div class="row" style="gap:6px;flex-wrap:nowrap">
      <input type="password" id="cfg_${field.k}" value="${esc(val)}" placeholder="${esc(field.ph || "")}" style="flex:1">
      <button type="button" class="btn tiny" style="flex:none" onclick="cfgPeek('${field.k}', this)">显示</button>
    </div>`;
  } else {
    ctl = `<input type="text" id="cfg_${field.k}" value="${esc(val)}" placeholder="${esc(field.ph || "")}">`;
  }
  return `<div class="cfgrow"><label>${esc(field.label)}${field.hint ? ` <span class="hint">${esc(field.hint)}</span>` : ""}</label>${ctl}</div>`;
}

async function opsSaveCfg(){
  const updates = {};
  for (const f of CFG_FIELDS){
    const el = $("cfg_" + f.k); if (!el) continue;
    const nv = el.value;
    const ov = opsCfgPrev[f.k];
    const ovs = ov === null || ov === undefined ? "" : String(ov);
    if (nv !== ovs) updates[f.k] = nv;      // 只提交改过的字段，没碰的不动
  }
  if (!Object.keys(updates).length){ $("cfgMsg").textContent = "没有改动"; return; }
  $("cfgMsg").textContent = "保存中…";
  const r = await post("/api/config", {updates});
  const res = r.results || {};
  const bad = Object.entries(res).filter(([, s]) => s !== "ok");
  if (!bad.length){ for (const [k, v] of Object.entries(updates)) opsCfgPrev[k] = v; }
  $("cfgMsg").innerHTML = bad.length
    ? `✗ ${bad.map(([k, s]) => esc(k) + "：" + esc(String(s).slice(0, 80))).join("；")}`
    : `✓ 已写入 ${Object.keys(res).length} 项——已生效`;
}

async function opsLogs(manual){
  const box = $("logBox"); if (!box) return;
  const grepEl = $("logGrep"), nEl = $("logN");
  const d = await api(`/api/logs?n=${nEl ? encodeURIComponent(nEl.value) : "200"}&grep=${encodeURIComponent(grepEl ? grepEl.value : "")}`);
  const head = (d && d.enabled === false)
    ? "（运行日志已关闭 · 常用配置里可重新打开）\n"
    : "";
  const lines = (d && d.lines) || [];
  const lhtml = head + lines.map(l => {
    const cls = l.includes(" ERROR ") ? " class=\"le\"" : l.includes(" WARNING ") ? " class=\"lw\"" : "";
    return `<span${cls}>${esc(l)}</span>`;
  }).join("\n") + `\n\n<span style="color:#c9b8a4">— ${lines.length} 行 —</span>`;
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  if (lhtml !== logHash){                      // 内容没变不重绘；变了的重绘保留滚动，不硬拽到底
    logHash = lhtml;
    box.innerHTML = lhtml;
  }
  if (manual || !logInited || stick) box.scrollTop = box.scrollHeight;
  logInited = true;
}

async function opsAct(action){
  if (action === "restart_gateway" && !confirm("重载面板 bot 的插件？（QQ 不中断）")) return;
  if (action === "restart_napcat" && !confirm("确定重启 NapCat？（会尝试快速登录，人在的话最稳）")) return;
  const r = await post("/api/action", {action});
  alert(r.msg || (r.ok ? "已执行" : r.error) || "done");
}

/* ================= 可见性 / 快捷键 ================= */
let hiddenAt = 0;
function pauseTimers(){
  clearInterval(stripTimer); stripTimer = null;
  if (chat.timer){ clearInterval(chat.timer); chat.timer = null; }
  if (chat.tick){ clearInterval(chat.tick); chat.tick = null; }
  if (feedTimer){ clearInterval(feedTimer); feedTimer = null; }
  if (boardTimer){ clearInterval(boardTimer); boardTimer = null; }
  try{ stopOpsTimers(); }catch(e){}
}
function resumeTimers(){
  if (!stripTimer) stripTimer = setInterval(strip, 15000);
  strip();
  if (V === "chat" && !chat.timer){
    chat.idle = 0;
    armChatPoll();
    chat.tick = setInterval(tickTyping, 1000);
    pollChat();
  }
  if (Date.now() - hiddenAt < 30000) return;   // 短暂切走不重绘
  if (V === "board") viewBoard();
  else if (V === "feed") viewFeed();
  else if (V === "ops") viewOpsBot();
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ hiddenAt = Date.now(); pauseTimers(); }
  else resumeTimers();
});
document.addEventListener("keydown", (e) => {
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); cmdkOpen(); return; }
  if (e.key === "Escape"){
    cmdkClose(); closePluginDrawer(); closeSheet();
    return;
  }
  if (typing) return;
  if (e.key === "/"){ e.preventDefault(); cmdkOpen(); return; }
  if (e.altKey && /^[1-8]$/.test(e.key)){
    e.preventDefault();
    const v = PAGES[Number(e.key) - 1]; if (v) go(v[0]);
  }
});

/* ================= 启动 ================= */
async function boot(){
  try {
    const d = await api("/api/characters");
    if (d && d.ok){
      charData = d;
      const c = (d.items || []).find(x => x.id === d.active) || (d.items || [])[0];
      if (c) setActiveChar(c);
      loadUI(d.active);                                   // 不阻塞首屏
    }
  } catch(e){}
  // PWA 快捷方式（manifest.shortcuts）带 ?v=<页面>
  const want = new URLSearchParams(location.search).get("v");
  if (want && PAGES.some(p => p[0] === want)){
    V = want;
    history.replaceState(null, "", "/");
  }
  render();
}
let stripTimer = setInterval(strip, 15000);
strip();
boot();
